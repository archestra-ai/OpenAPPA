version: 2
# Every ecosystem writes the `deps` type so its pull request titles pass the
# title linter and land in the changelog's Dependencies section. Without this,
# Dependabot infers `build(deps)` from the conventional-commit history.
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
      prefix-development: deps
    groups:
      rust-dependencies:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  - package-ecosystem: cargo
    directory: /bench/corp-systems
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
      prefix-development: deps

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps
