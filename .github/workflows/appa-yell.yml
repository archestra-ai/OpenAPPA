name: Deploy appa-yell

# The receiver behind `appa yell`. Its tests and lint run in ci.yml; this
# workflow only deploys: on every push to main that touches the receiver or
# this file, and on a manual dispatch from main.
#
# This workflow owns the function's *code* and nothing else. Scaling, ingress,
# IAM, the runtime service account, the bucket and its retention belong to the
# Terraform root in the infra repository, which is applied separately. That is
# why the deploy below passes almost no such flag: `gcloud functions deploy`
# leaves every setting it is not given alone, so CI cannot roll infrastructure
# back. The one exception is the build account, named below because when the
# flag is absent gcloud asks Cloud Build for the project's default, a call the
# deploy identity is not permitted to make. Terraform sets the same value.
#
# The deploy identity is appa-yell-deploy, its own, not appa-demo's. Optional
# secret in the `appa-yell` environment (main only): APPA_YELL_SLACK_WEBHOOK.
# Required repository variable: APPA_YELL_ENDPOINT.
#
# The deploy identity is bound to *this file at this path on main* — Google
# checks the `job_workflow_ref` claim, because every workflow on a ref mints
# the same subject and one of them being trusted would trust all of them. So
# renaming or moving this file revokes its own credentials, and the fix is in
# the infra repository, not here.

on:
  push:
    branches: [main]
    paths:
      - receiver/appa-yell/**
      - .github/workflows/appa-yell.yml
  workflow_dispatch:

permissions: {}

env:
  FUNCTION: appa-yell
  REGION: europe-west1

jobs:
  deploy:
    name: Deploy and smoke test
    if: github.ref == 'refs/heads/main' # a dispatch on any other ref deploys nothing
    runs-on: ubuntu-latest
    environment: appa-yell # Holds the Slack webhook; deploys from main only.
    timeout-minutes: 20
    concurrency:
      group: appa-yell-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # Required for Workload Identity Federation.
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Authenticate to Google Cloud
        uses: archestra-ai/.github/actions/google-auth@33a9bb2908d4ef0b09d2162e072705a44d87734f # v1.10.2
        with:
          service_account: appa-yell-deploy@friendly-path-465518-r6.iam.gserviceaccount.com
          workload_identity_provider: projects/354887056155/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          setup_gcloud: "true"

      - name: Deploy the function source
        env:
          SLACK_WEBHOOK: ${{ secrets.APPA_YELL_SLACK_WEBHOOK }}
        run: |
          # CLOUDSDK_CORE_PROJECT is set by the auth step from the deploy identity.
          # Always set APPA_YELL_SLACK_WEBHOOK so deleting the secret clears the variable.
          gcloud functions deploy "$FUNCTION" \
            --gen2 \
            --region "$REGION" \
            --source receiver/appa-yell \
            --runtime python312 \
            --entry-point receive \
            --build-service-account "projects/$CLOUDSDK_CORE_PROJECT/serviceAccounts/appa-yell-build@$CLOUDSDK_CORE_PROJECT.iam.gserviceaccount.com" \
            --update-env-vars "APPA_YELL_SLACK_WEBHOOK=$SLACK_WEBHOOK"

      - name: Smoke test the deployed endpoint
        env:
          APPA_YELL_ENDPOINT: ${{ vars.APPA_YELL_ENDPOINT }}
        run: python3 receiver/appa-yell/smoke.py
