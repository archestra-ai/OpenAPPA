name: Publish benchmark archive

# Uploads one published run's full trajectory archive to the private
# `archestra-appa-bench-archive` bucket. The layout, the identity, and the
# create-only guarantee are in archestra-ai/infra
# `gcp/workload_identity/README.md` and `appa-bench-publish.tf`.
#
# Why the archives arrive as release assets: `appa-bench-publish` is mintable
# only by this file on main (infra gcp/workload_identity/ci-workflow-trust.tf),
# so a run produced in an orb cannot upload directly. Committing the archives to relay them through Actions would put
# into git exactly the bloat the archive bucket exists to keep out, and the
# workflow itself is small enough to belong in the repository that publishes
# its results.
#
# The relay release is a draft: the bucket is private, and a published release
# would serve the archives to anyone holding the link while the run is in
# flight. Nothing is committed back by this workflow.
#
# Relay procedure, one draft release per run prefix. Dispatch on main; the
# job runs nothing on any other ref:
#
#   gh release create bench-relay-<run-id> --draft --title bench-relay-<run-id>
#   gh release upload bench-relay-<run-id> <run-id>-<sha256>.tar.zst index.json
#   gh workflow run bench-publish.yml --ref main \
#     -f bench=corp -f commit=<git-sha> -f run_id=<run-id> \
#     -f relay_tag=bench-relay-<run-id>
#
# The workflow verifies the archive, index, and requested destination agree,
# uploads with --no-clobber, then reads both objects back out of the bucket.
# The read-back is what the delete depends on: --no-clobber skips an object
# that is already there and still exits zero, so a successful copy is not
# evidence that the published object is the one this run carried. A failed run
# leaves the bytes where a retry finds them.
#
# If the download step cannot see the draft — draft visibility to GITHUB_TOKEN
# has regressed before (cli/cli#3037) — fetch the assets by id from the upload
# response instead:
#   gh api -H 'Accept: application/octet-stream' \
#     "/repos/$GITHUB_REPOSITORY/releases/assets/<asset-id>" > <name>
#
# Required repository configuration (from the infra outputs):
#   variable APPA_BENCH_GCS_BUCKET — the archive bucket name

on:
  workflow_dispatch:
    inputs:
      bench:
        description: Bench directory name, the <bench> segment of the archive path
        required: true
        type: string
      commit:
        description: Full commit SHA the run was produced at, the <git-commit> segment
        required: true
        type: string
      run_id:
        description: Run id, the <run-id> segment of the archive path
        required: true
        type: string
      relay_tag:
        description: Draft release tag holding this run's archives
        required: true
        type: string

permissions: {}

jobs:
  publish:
    name: Upload to the benchmark archive
    if: github.ref == 'refs/heads/main' # a dispatch on any other ref publishes nothing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: benchmark-archive-publish
      cancel-in-progress: false
    permissions:
      contents: write # read the draft release's assets, delete it afterwards
      id-token: write # Workload Identity Federation for appa-bench-publish
    steps:
      - name: Download the relay release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.relay_tag }}
        run: |
          [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true ] || {
            echo "::error::$TAG must identify a draft release"
            exit 1
          }
          mkdir -p relay
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir relay

      - name: Verify archive and index
        env:
          BENCH: ${{ inputs.bench }}
          COMMIT: ${{ inputs.commit }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd relay

          [[ "$BENCH" =~ ^[a-z0-9][a-z0-9-]*$ ]] || {
            echo "::error::bench must contain lowercase letters, digits, or hyphens"
            exit 1
          }
          [[ "$COMMIT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::commit must be a full lowercase Git SHA"
            exit 1
          }
          [[ "$RUN_ID" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] || {
            echo "::error::run_id contains unsupported characters"
            exit 1
          }

          archives=(*.tar.zst)
          if [ ${#archives[@]} -ne 1 ] || [ ! -f index.json ] || [ "$(find . -maxdepth 1 -type f | wc -l)" -ne 2 ]; then
            echo "::error::the relay release must contain exactly one .tar.zst and index.json"
            exit 1
          fi

          archive=${archives[0]}
          digest=$(sha256sum "$archive" | cut -d' ' -f1)
          expected="$RUN_ID-$digest.tar.zst"
          [ "$archive" = "$expected" ] || {
            echo "::error::$archive must be named $expected"
            exit 1
          }

          jq -e \
            --arg benchmark "$BENCH" \
            --arg commit "$COMMIT" \
            --arg run_id "$RUN_ID" \
            --arg archive "$archive" \
            --arg sha256 "$digest" \
            '.format_version == 1
             and .benchmark == $benchmark
             and .git_commit == $commit
             and .run_id == $run_id
             and .archive == $archive
             and .sha256 == $sha256' \
            index.json >/dev/null || {
              echo "::error::index.json does not describe the requested archive and destination"
              exit 1
            }

          echo "$archive matches index.json and SHA-256 $digest"

      - name: Validate repository configuration
        env:
          BUCKET: ${{ vars.APPA_BENCH_GCS_BUCKET }}
        run: |
          [ -n "$BUCKET" ] || {
            echo "::error::APPA_BENCH_GCS_BUCKET is not set for this repository"
            exit 1
          }

      - name: Authenticate to Google Cloud
        uses: archestra-ai/.github/actions/google-auth@3a014e2fa0a740f1ec68f6379b602470a418cd6e # v1.13.0
        with:
          service_account: appa-bench-publish@friendly-path-465518-r6.iam.gserviceaccount.com
          workload_identity_provider: projects/354887056155/locations/global/workloadIdentityPools/github-actions-pool/providers/github-actions-provider
          setup_gcloud: "true"

      - name: Upload the archives
        env:
          BUCKET: ${{ vars.APPA_BENCH_GCS_BUCKET }}
          PREFIX: bench/${{ inputs.bench }}/${{ inputs.commit }}/${{ inputs.run_id }}
        run: |
          set -euo pipefail
          archive=$(jq -r .archive relay/index.json)
          gcloud storage cp --no-clobber \
            "relay/$archive" relay/index.json "gs://$BUCKET/$PREFIX/"

      - name: Verify the upload
        env:
          BUCKET: ${{ vars.APPA_BENCH_GCS_BUCKET }}
          PREFIX: bench/${{ inputs.bench }}/${{ inputs.commit }}/${{ inputs.run_id }}
        run: |
          set -euo pipefail
          archive=$(jq -r .archive relay/index.json)
          digest=$(sha256sum "relay/$archive" | cut -d' ' -f1)

          gcloud storage cp "gs://$BUCKET/$PREFIX/$archive" /tmp/published.tar.zst
          echo "$digest  /tmp/published.tar.zst" | sha256sum --check --strict || {
            echo "::error::the published archive is not the archive in the relay release"
            exit 1
          }

          gcloud storage cat "gs://$BUCKET/$PREFIX/index.json" > /tmp/published-index.json
          cmp /tmp/published-index.json relay/index.json || {
            echo "::error::the published index.json is not the index in the relay release"
            exit 1
          }

          echo "gs://$BUCKET/$PREFIX/ holds $archive and this relay release's index.json"

      - name: Delete the relay release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.relay_tag }}
        run: gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
