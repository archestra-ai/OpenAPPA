name: Build and deploy appa-demo

# Builds the chat-playground service image, pushes it to Artifact Registry
# and rolls the appa-demo Cloud Run service to it. Runs only on manual
# dispatch from main; the crate itself is gated by ci.yml's `--workspace`
# jobs, which include it.
#
# Required repository secrets: APPA_GCP_SERVICE_ACCOUNT,
# APPA_GCP_WORKLOAD_IDENTITY_PROVIDER.

on:
  workflow_dispatch:

permissions: {}

env:
  IMAGE: europe-west1-docker.pkg.dev/friendly-path-465518-r6/appa-demo/appa-demo

jobs:
  build:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: appa-demo-image-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      # Read the repository to build the image from it.
      contents: read
      id-token: write # Required for Workload Identity Federation when pushing images.
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build image
        run: docker build --tag "$IMAGE:${GITHUB_SHA::12}" --tag "$IMAGE:latest" .

      - name: Authenticate to Google Cloud
        # Publishing only ever comes from a dispatch on main — a
        # workflow_dispatch on any other ref builds without publishing.
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          service_account: ${{ secrets.APPA_GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.APPA_GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up Google Cloud
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Push image
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker push "$IMAGE:${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        run: |
          gcloud run services update appa-demo \
            --region europe-west1 \
            --image "$IMAGE:${GITHUB_SHA::12}"
