name: Build and deploy appa-demo

# Builds the chat-playground service image, pushes it to Artifact Registry,
# and rolls the appa-demo Cloud Run service to it on every push to main. A
# manual dispatch can build any ref, but publishes and deploys only from main.
#
# Required repository secrets: APPA_GCP_SERVICE_ACCOUNT,
# APPA_GCP_WORKLOAD_IDENTITY_PROVIDER.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

env:
  IMAGE: europe-west1-docker.pkg.dev/friendly-path-465518-r6/appa-demo/appa-demo

jobs:
  build:
    name: Build, push and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: appa-demo-image-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      # Read the repository to build the image from it.
      contents: read
      id-token: write # Required for Workload Identity Federation when pushing images.
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Build image
        run: docker build --tag "$IMAGE:sha-${GITHUB_SHA::12}" --tag "$IMAGE:latest" .

      - name: Authenticate to Artifact Registry
        if: github.ref == 'refs/heads/main'
        uses: ./.github/actions/auth-to-gar
        with:
          service_account: ${{ secrets.APPA_GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.APPA_GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:sha-${GITHUB_SHA::12}"
          docker push "$IMAGE:latest"

      - name: Deploy to Cloud Run
        if: github.ref == 'refs/heads/main'
        run: |
          gcloud run services update appa-demo \
            --region europe-west1 \
            --image "$IMAGE:sha-${GITHUB_SHA::12}"
