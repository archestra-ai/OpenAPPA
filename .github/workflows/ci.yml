name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  installer-checks:
    name: Installer Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check Unix installer syntax
        if: runner.os != 'Windows'
        run: sh -n install.sh .github/scripts/test-install.sh

      - name: Lint Unix installer
        if: runner.os == 'Linux'
        run: shellcheck install.sh .github/scripts/test-install.sh

      - name: Test Unix installer
        if: runner.os != 'Windows'
        run: sh .github/scripts/test-install.sh

      - name: Test Windows installer
        if: runner.os == 'Windows'
        shell: powershell
        run: .github/scripts/test-install.ps1

  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        run: rustup show

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust check
        run: cargo check --workspace --locked

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

      # `bench/corp-systems` is the one crate outside the workspace: no APPA
      # dependency at all, and an older `rmcp` than the runtime pins.
      - name: Mock systems formatting
        run: cargo fmt --manifest-path bench/corp-systems/Cargo.toml --all --check

      - name: Mock systems lint
        run: cargo clippy --manifest-path bench/corp-systems/Cargo.toml --all-targets --locked -- -D warnings

      - name: Mock systems tests
        run: cargo test --manifest-path bench/corp-systems/Cargo.toml --locked
