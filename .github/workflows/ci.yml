name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  plugin-checks:
    name: Plugin Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check plugin shell syntax
        run: |
          sh -n integrations/claude-code/plugin/hooks/ensure-runtime.sh \
            integrations/claude-code/plugin/statusline.sh

      - name: Lint plugin shell scripts
        run: shellcheck -s sh integrations/claude-code/plugin/hooks/ensure-runtime.sh

      - name: Validate plugin JSON
        run: |
          jq -e .hooks integrations/claude-code/plugin/hooks/hooks.json >/dev/null
          jq -e .hooks integrations/claude-code/plugin/hooks/hooks.windows.json >/dev/null
          jq -e .plugins .claude-plugin/marketplace.json >/dev/null
          jq -e .plugins integrations/claude-code/.claude-plugin/marketplace.json >/dev/null

  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        run: rustup show

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust check
        run: cargo check --workspace --locked

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked
