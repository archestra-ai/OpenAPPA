name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` carries the run-e2e label that starts the live e2e subset.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.event.pull_request.number || github.ref }}"
  # A label event queues behind the run in flight and never cancels it.
  # The run-e2e label must not restart the macOS, Windows and Rust jobs.
  cancel-in-progress: ${{ github.event.action != 'labeled' }}

jobs:
  # Each job runs only when its own inputs change. Skipped required
  # checks still pass, so a docs-only pull request does not wait on
  # Rust, macOS, Windows, or image builds.
  changes:
    name: Changed Paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the checkout below reads the repository on a push
      pull-requests: read # the filter reads the pull request file list
    outputs:
      python: ${{ steps.filter.outputs.python }}
      go: ${{ steps.filter.outputs.go }}
      chart: ${{ steps.filter.outputs.chart }}
      integration: ${{ steps.filter.outputs.integration }}
      e2e: ${{ steps.filter.outputs.e2e }}
      rust: ${{ steps.filter.outputs.rust }}
      plugin: ${{ steps.filter.outputs.plugin }}
      installer: ${{ steps.filter.outputs.installer }}
      corp: ${{ steps.filter.outputs.corp }}
      agentthreatbench: ${{ steps.filter.outputs.agentthreatbench }}
    steps:
      # A pull request reads its file list from the API and needs no
      # checkout. Every other event diffs with git and needs the history.
      - name: Checkout project
        if: github.event_name != 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      # The action declares only its `changes` output. It sets the
      # per-filter outputs at run time, so the job maps each one above.
      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python: &python
              - 'integrations/kagent/appa-kagent-adk/**'
              - 'integrations/kagent/tests/**'
              - 'integrations/kagent/fixtures/**'
              - '.github/workflows/ci.yml'
            go:
              - 'integrations/kagent/appa-kagent-adk-go/**'
              - 'integrations/kagent/fixtures/**'
              - '.github/workflows/ci.yml'
            chart:
              - 'integrations/kagent/demo/chart/**'
              - 'charts/appa-runtime/**'
              - '.github/workflows/ci.yml'
            rust: &rust
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'rustfmt.toml'
              - '.github/workflows/ci.yml'
              - 'appa-runtime/**'
              - 'appa-runtime-api/**'
              - 'appa-engine/**'
              - 'appa-eventlog/**'
              - 'appa-policy/**'
              - 'appa-builtin/**'
              - 'appa-adapter-kagent/**'
              - 'appa-adapter-claude-code/**'
              - 'appa-example-agent/**'
              - 'appa-agent-python/**'
              - 'website-chat-playground/**'
              - 'bench/corp-agent/**'
              - 'bench/corp-systems/**'
              - 'bench/corp/policies/**'
              - 'examples/**'
              - 'batteries/**'
              - 'integrations/claude-code/**'
              - 'integrations/appa-guide/**'
              - 'integrations/kagent/fixtures/**'
              - 'website/content/docs/contracts.md'
            plugin:
              - 'integrations/claude-code/plugin/**'
              - 'integrations/claude-code/.claude-plugin/**'
              - '.claude-plugin/**'
              - 'batteries/**'
              - 'scripts/appa-stage-plugin-bundle.sh'
              - 'scripts/appa-install.sh'
              - 'scripts/appa-install-test.sh'
              - 'scripts/appa-refresh-batteries.py'
              - 'scripts/test_appa_refresh_batteries.py'
              - 'scripts/appa-guide-runtime.py'
              - 'scripts/test_appa_guide_runtime.py'
              - '.github/actions/check-release-versions/**'
              - '.github/release-please/**'
              - '.github/workflows/ci.yml'
              - 'Cargo.toml'
              - 'charts/appa-runtime/Chart.yaml'
              - 'charts/appa-runtime/README.md'
              - 'integrations/kagent/demo/chart/Chart.yaml'
              - 'integrations/kagent/demo/chart/README.md'
              - 'integrations/kagent/demo/README.md'
              - 'website/content/docs/kagent.md'
              - 'integrations/kagent/README.md'
            installer:
              - 'scripts/appa-install.sh'
              - 'scripts/appa-install-test.sh'
              - '.github/workflows/ci.yml'
            corp:
              - 'bench/corp/**'
              - '.github/workflows/ci.yml'
            agentthreatbench:
              - *rust
              - 'bench/agentthreatbench/**'
            integration: &integration
              - *python
              - 'integrations/kagent/examples/**'
              - 'integrations/kagent/demo/demo_tools.py'
              - 'integrations/kagent/demo/mocks/**'
              - 'integrations/kagent/demo/chart/files/**'
              # The suite hardcodes the prose and tool lists these
              # templates render, verbatim (tests/conftest.py).
              - 'integrations/kagent/demo/chart/templates/**'
              - 'appa-runtime/**'
              - 'appa-runtime-api/**'
              - 'appa-engine/**'
              - 'appa-eventlog/**'
              - 'appa-policy/**'
              - 'appa-builtin/**'
              - 'appa-adapter-kagent/**'
              - 'appa-adapter-claude-code/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
            e2e:
              - *integration
              - 'integrations/kagent/**'
              # Markdown in this tree does not change an image or the
              # A2A suite. Plugin Checks still reads the annotated
              # operator guides.
              - '!integrations/kagent/**/*.md'
              - 'appa-example-agent/**'
              - 'appa-agent-python/**'
              - 'bench/**'
              - 'website-chat-playground/**'
              - 'batteries/**'
              - 'website/content/docs/contracts.md'
              # The published image compiles a digest of the plugin
              # tree into the binary; these are the rest of the roots
              # appa-runtime/src/plugin_layout.rs maps.
              - 'integrations/claude-code/**'
              - 'integrations/appa-guide/**'
              - 'scripts/appa-refresh-batteries.py'
              - 'scripts/appa-guide-runtime.py'
              - 'scripts/test_appa_guide_runtime.py'
              # The root ignore file shapes the runtime build context.
              - '.dockerignore'

  plugin-checks:
    name: Plugin Checks
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check plugin shell syntax
        run: |
          sh -n integrations/claude-code/plugin/hooks/ensure-runtime.sh \
            integrations/claude-code/plugin/hooks/hook.sh \
            integrations/claude-code/plugin/hooks/appa-paths.sh \
            integrations/claude-code/plugin/statusline.sh \
            scripts/appa-stage-plugin-bundle.sh \
            scripts/appa-install.sh \
            scripts/appa-install-test.sh

      - name: Lint plugin shell scripts
        run: |
          shellcheck -x -s sh integrations/claude-code/plugin/hooks/ensure-runtime.sh \
            integrations/claude-code/plugin/hooks/hook.sh \
            integrations/claude-code/plugin/hooks/appa-paths.sh \
            scripts/appa-stage-plugin-bundle.sh \
            scripts/appa-install.sh \
            scripts/appa-install-test.sh

      # The Windows hook implementation had no check of any kind until a
      # review found a fail-open bug in it. `pwsh` is preinstalled on the
      # runner, and its own parser is the authority on what it will run.
      - name: Lint plugin PowerShell scripts
        shell: pwsh
        run: |
          $failed = $false
          foreach ($script in @(
            "integrations/claude-code/plugin/hooks/hook.ps1",
            "integrations/claude-code/plugin/hooks/appa-paths.ps1",
            "integrations/claude-code/plugin/statusline.ps1"
          )) {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script, [ref]$null, [ref]$errors) | Out-Null
            foreach ($error in $errors) {
              Write-Output "::error file=$script,line=$($error.Extent.StartLineNumber)::$($error.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: Validate plugin JSON
        run: |
          jq -e .hooks integrations/claude-code/plugin/hooks/hooks.json >/dev/null
          jq -e .hooks integrations/claude-code/plugin/hooks/hooks.windows.json >/dev/null
          jq -e .plugins .claude-plugin/marketplace.json >/dev/null
          jq -e .plugins integrations/claude-code/.claude-plugin/marketplace.json >/dev/null

      - name: Test battery externals
        run: |
          for dir in $(dirname batteries/test_*.py batteries/*/test_*.py | sort -u); do
            python3 -m unittest discover -s "$dir" -p 'test_*.py'
          done

      - name: Test release battery refresh
        run: python3 -m unittest scripts/test_appa_refresh_batteries.py scripts/test_appa_guide_runtime.py

      - name: Check release versions
        uses: ./.github/actions/check-release-versions

  installer-checks:
    name: Installer Checks (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.installer == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      # The installer runs with whatever sh, tar, curl and digest tool the
      # user's platform ships, so its cases run on each supported one.
      - name: Installer cases
        run: sh scripts/appa-install-test.sh

  # Rust toolchain checks, split so cargo clippy and cargo test run in
  # parallel instead of serializing ~11 min on one runner. `cargo check`
  # is omitted: clippy --all-targets is a superset. Each rust-cache key is
  # per job: clippy and test write different target/ trees, so they must
  # not share one entry. A job that runs on main seeds the key later PRs
  # restore.
  rust-lint:
    name: Rust Lint
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        run: rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-lint
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  rust-tests:
    name: Rust Tests
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # init_cli copies and hashes the test binary many times. Debug metadata
    # adds no signal in CI and makes each of those full-file operations larger.
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        run: rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: rust-tests
          env-vars: CARGO_PROFILE_TEST_DEBUG
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Rust tests
        run: cargo test --workspace --locked

  # Stable-named gate so a required check named "Rust Checks" still
  # covers the split jobs. Both jobs skipped is success: their paths
  # did not change.
  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    if: always() && !cancelled()
    needs: [changes, rust-lint, rust-tests]
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check rust job results
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          LINT_RESULT: ${{ needs.rust-lint.result }}
          TESTS_RESULT: ${{ needs.rust-tests.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::Changed Paths failed ($CHANGES_RESULT)."
            exit 1
          fi
          if [ "$LINT_RESULT" != "success" ] && [ "$LINT_RESULT" != "skipped" ]; then
            echo "::error::Rust lint failed ($LINT_RESULT)."
            exit 1
          fi
          if [ "$TESTS_RESULT" != "success" ] && [ "$TESTS_RESULT" != "skipped" ]; then
            echo "::error::Rust tests failed ($TESTS_RESULT)."
            exit 1
          fi
          if [ "$LINT_RESULT" != "$TESTS_RESULT" ]; then
            echo "::error::Rust lint and tests disagreed (lint: $LINT_RESULT, tests: $TESTS_RESULT)."
            exit 1
          fi

  replay-examples:
    name: Replay Examples
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        run: rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Every directory under examples/tests is one policy and one trace file.
      # The test suite pins them too; this runs the command line end to end,
      # the way a policy author would, and fails on the first example that
      # does not pass.
      - name: Replay the shipped examples
        run: |
          cargo build --locked --package appa
          for dir in examples/tests/*/; do
            ./target/debug/appa replay --config "${dir}appa.toml" "$dir"
          done

  macos-deployment-checks:
    name: macOS Deployment Checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        run: rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Only what is platform-specific here: the config and data directory
      # rules, the process ownership check init stops a runtime with, and the
      # hooks a materialized deployment renders. Not a second full workspace
      # check, clippy and test run.
      - name: Deployment tests
        run: |
          cargo test --locked --package appa --lib init::
          cargo test --locked --package appa --lib plugin_bundle::
          cargo test --locked --package appa --test init_cli
          cargo test --locked --package appa --test plugin_hooks
          cargo test --locked --package appa --test rendered_hooks

  windows-deployment-checks:
    name: Windows Deployment Checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        run: rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build runtime
        run: cargo build --locked --package appa

      # Start from an empty directory, as the release package check does. The
      # generated policy must both open and omit the subprocess fallback this
      # platform cannot serve.
      - name: Verify fresh deployment
        shell: pwsh
        run: |
          $work = Join-Path $env:RUNNER_TEMP "appa-windows-deployment"
          New-Item -ItemType Directory -Path $work | Out-Null
          $stdout = Join-Path $work "runtime.stdout.log"
          $stderr = Join-Path $work "runtime.stderr.log"
          $start = @{
            FilePath = Join-Path $PWD "target/debug/appa.exe"
            ArgumentList = @("runtime")
            WorkingDirectory = $work
            PassThru = $true
            RedirectStandardOutput = $stdout
            RedirectStandardError = $stderr
          }
          $process = Start-Process @start
          try {
            $healthy = $false
            for ($attempt = 0; $attempt -lt 30; $attempt++) {
              try {
                $health = Invoke-RestMethod -Uri "http://127.0.0.1:8787/health" -TimeoutSec 1
                if ("$health".Trim() -eq "ok") {
                  $healthy = $true
                  break
                }
              } catch {
                $process.Refresh()
                if ($process.HasExited) { break }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $healthy) {
              if (Test-Path $stderr) { Get-Content $stderr }
              throw "Fresh Windows runtime did not become healthy"
            }
            $policy = Get-Content (Join-Path $work "appa.toml") -Raw
            if ($policy -match 'builtin = "claude-code"' -or $policy -match '(?m)^name = "\*"\r?$') {
              throw "Fresh Windows policy contains the unsupported Claude subprocess fallback"
            }
          } finally {
            $process.Refresh()
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force }
          }

  python-binding-checks:
    name: Python Binding Checks
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        run: rustup show

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Python binding tests
        run: uv run --project appa-agent-python pytest appa-agent-python/tests

  corp-benchmark-checks:
    name: Corporate Benchmark Checks
    needs: changes
    if: needs.changes.outputs.corp == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Corporate benchmark tests
        run: uv run --project bench/corp pytest bench/corp/tests

  agentthreatbench-checks:
    name: AgentThreatBench Checks
    needs: changes
    if: needs.changes.outputs.agentthreatbench == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        run: rustup show

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: AgentThreatBench lint
        run: |
          uv run --project bench/agentthreatbench ruff check bench/agentthreatbench
          uv run --project bench/agentthreatbench ruff format --check bench/agentthreatbench

      - name: AgentThreatBench tests
        run: uv run --project bench/agentthreatbench pytest bench/agentthreatbench/tests

  kagent-python-checks:
    name: kagent Python Checks
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: appa-kagent-adk lint
        run: |
          uv run --project integrations/kagent/appa-kagent-adk ruff check integrations/kagent/appa-kagent-adk/src integrations/kagent/appa-kagent-adk/tests integrations/kagent/tests
          uv run --project integrations/kagent/appa-kagent-adk ruff format --check integrations/kagent/appa-kagent-adk/src integrations/kagent/appa-kagent-adk/tests integrations/kagent/tests

      - name: appa-kagent-adk tests, locked lane
        run: uv run --project integrations/kagent/appa-kagent-adk pytest integrations/kagent/appa-kagent-adk/tests

      # The stable kagent v0.9.12 lane: the pinned kagent-adk with its own
      # resolution (google-adk 1.31.1, a2a-sdk 0.3.x). The entrypoint tests
      # run only here; they skip on the bare lane above.
      - name: appa-kagent-adk tests, kagent v0.9.12 lane
        run: >
          uv run --project integrations/kagent/appa-kagent-adk
          --with "kagent-adk @ git+https://github.com/kagent-dev/kagent@v0.9.12#subdirectory=python/packages/kagent-adk"
          --with "a2a-sdk>=0.3.23,<0.4" --with "google-adk==1.31.1" --with "mcp>=1.25,<2"
          pytest integrations/kagent/appa-kagent-adk/tests

  kagent-go-checks:
    name: kagent Go Checks
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: integrations/kagent/appa-kagent-adk-go
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: integrations/kagent/appa-kagent-adk-go/go.mod
          cache-dependency-path: integrations/kagent/appa-kagent-adk-go/go.sum

      - name: gofmt
        run: test -z "$(gofmt -l .)"

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  kagent-chart-checks:
    name: kagent Chart Checks
    needs: changes
    if: needs.changes.outputs.chart == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Lint the chart render scripts
        run: |
          shellcheck -s sh integrations/kagent/demo/chart/tests/render-test.sh \
            charts/appa-runtime/tests/render-test.sh

      - name: Lint the charts
        run: |
          helm lint integrations/kagent/demo/chart
          helm lint charts/appa-runtime

      # The name-collision refusal and the quoting of scalar-looking names
      # run only where something renders the chart, so this job does.
      - name: Render the charts
        run: |
          sh integrations/kagent/demo/chart/tests/render-test.sh
          sh charts/appa-runtime/tests/render-test.sh

  # The deterministic A2A matrix: the real runtime, the real plugin, the real
  # kagent executor, mock externals and a scripted model. No cluster, no key.
  kagent-integration:
    name: kagent Integration Matrix
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        run: rustup show

      # The suite drives a real appa runtime, so this job builds the binary
      # and caches the build under the default job key. Lint, tests, replay,
      # and the Python bindings each have their own rust-cache entry.
      - name: Cache the Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Build the runtime binary
        run: cargo build --package appa --locked

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      # The suite starts the runtime, the mock externals and the demo tools,
      # and serves both agents on loopback ports. Only the model is scripted.
      # It writes the trajectory database and one log per process under its
      # temporary directory, so `--basetemp` names the directory to upload.
      - name: kagent integration matrix, kagent v0.9.12 lane
        env:
          APPA_INTEGRATION: "1"
          APPA_BIN: ${{ github.workspace }}/target/debug/appa
          APPA_INTEGRATION_BASETEMP: ${{ runner.temp }}/appa-integration
        run: >
          uv run --project integrations/kagent/appa-kagent-adk
          --with "kagent-adk @ git+https://github.com/kagent-dev/kagent@v0.9.12#subdirectory=python/packages/kagent-adk"
          --with "a2a-sdk>=0.3.23,<0.4" --with "google-adk==1.31.1" --with "mcp>=1.25,<2"
          pytest integrations/kagent/tests -q --basetemp "$APPA_INTEGRATION_BASETEMP"

      - name: Upload the trajectory database and the process logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kagent-integration-logs
          path: ${{ runner.temp }}/appa-integration
          if-no-files-found: ignore
          retention-days: 7

  # The live A2A matrix runs on demand only, and it carries NO same-named
  # placeholder job. GitHub treats a skipped check run as satisfying a
  # required status check, so the real job reports its own name when its
  # `if` is false and nothing waits on a context that never arrives. A
  # same-named twin would report skipped beside a real failure and
  # satisfy the requirement anyway, which is how a twin masks red e2e.
  #
  # All 17 A2A cases against a real model on a kind cluster. Each test gets
  # three total attempts; a test that exhausts them fails the gate.
  #
  # The steps below own the runner. The scripts under e2e/ci own the stack:
  #   kind-up.sh    loads the three `:ci` images into the cluster. It keeps
  #                 the cluster the action above creates.
  #   install.sh    installs kagent and the demo chart, then waits for rollout.
  #   run-a2a.sh    port-forwards the agent and the mocks, runs the cases,
  #                 and writes the model and the timings to the step summary.
  # Each script reads the environment this job exports. e2e/ci/README.md
  # documents the same three commands for a laptop or a dev VM.
  kagent-a2a-e2e:
    name: kagent A2A E2E
    needs: changes
    # A pull request runs the matrix when it carries the label and it
    # changes an e2e path. A fork never reads the OpenRouter key.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      (contains(github.event.pull_request.labels.*.name, 'run-e2e') ||
      github.event.label.name == 'run-e2e') &&
      needs.changes.outputs.e2e == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KIND_CLUSTER: appa-e2e
      KAGENT_VERSION: "0.9.12"
      APPA_E2E_NAMESPACE: kagent
      APPA_E2E_IMAGE_TAG: ci
      # The load leaves each image in the daemon and in the cluster node,
      # so the script drops the daemon copy.
      APPA_E2E_PRUNE_DAEMON_IMAGES: "1"
      # One endpoint serves the agents and the policy's sanitizers. This is
      # the same model and endpoint as the public playground.
      APPA_E2E_MODEL: openai/gpt-5.6-luna
      APPA_E2E_BASE_URL: https://openrouter.ai/api/v1
    steps:
      # Standard runners ship about 25 GB of unused toolchains. Delete them
      # in the background; no OpenAPPA build reads these paths.
      - name: Reclaim disk space (background)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup &

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # These builds read the cache the images job writes. They never
      # write it: two jobs writing one scope in one run overwrite each other.
      - name: Build the shared runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: appa-runtime/Dockerfile
          tags: appa-runtime:${{ env.APPA_E2E_IMAGE_TAG }}
          load: true
          push: false
          cache-from: type=gha,scope=appa-runtime

      - name: Build the Python plugin image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: integrations/kagent/appa-kagent-adk
          tags: appa-kagent-adk:${{ env.APPA_E2E_IMAGE_TAG }}
          load: true
          push: false
          cache-from: type=gha,scope=appa-kagent-adk

      - name: Build the demo tools image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: integrations/kagent/demo
          tags: appa-demo-tools:${{ env.APPA_E2E_IMAGE_TAG }}
          load: true
          push: false
          cache-from: type=gha,scope=appa-demo-tools

      - name: Build the demo mocks image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: integrations/kagent/demo/mocks
          tags: appa-demo-mocks:${{ env.APPA_E2E_IMAGE_TAG }}
          load: true
          push: false
          cache-from: type=gha,scope=appa-demo-mocks

      - name: Reclaim the build cache
        run: |
          docker buildx prune --all --force
          df -h /

      - name: Create the kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
        with:
          cluster_name: ${{ env.KIND_CLUSTER }}

      - name: Load the images into the cluster
        run: bash integrations/kagent/e2e/ci/kind-up.sh

      - name: Install kagent and the demo chart
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: bash integrations/kagent/e2e/ci/install.sh

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Run all 17 A2A cases
        id: live-e2e
        run: bash integrations/kagent/e2e/ci/run-a2a.sh

      # A diagnostic command must not replace the live test failure.
      - name: Collect cluster diagnostics
        if: failure()
        env:
          DIAGNOSTICS_DIR: ${{ runner.temp }}/kagent-e2e-diagnostics
        run: |
          mkdir -p "$DIAGNOSTICS_DIR"
          kubectl get pods -A -o wide > "$DIAGNOSTICS_DIR/pods.txt" 2>&1 || true
          kubectl describe pods -n "$APPA_E2E_NAMESPACE" > "$DIAGNOSTICS_DIR/describe.txt" 2>&1 || true
          for pod in $(kubectl get pods -n "$APPA_E2E_NAMESPACE" -o name || true); do
            kubectl logs -n "$APPA_E2E_NAMESPACE" "$pod" --all-containers --tail=2000 \
              > "$DIAGNOSTICS_DIR/${pod##*/}.log" 2>&1 || true
          done
          df -h /

      - name: Upload the cluster diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kagent-a2a-e2e-diagnostics
          path: ${{ runner.temp }}/kagent-e2e-diagnostics
          if-no-files-found: ignore
          retention-days: 7

  # All published images get an amd64 build here on every change
  # that can break them. Publishing itself happens in release.yml.
  kagent-images-build:
    name: kagent Images Build
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Match the e2e job: reclaim unused runner toolchains while checkout
      # and Buildx setup proceed.
      - name: Reclaim disk space (background)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup &

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the shared runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: appa-runtime/Dockerfile
          tags: appa-runtime:ci
          push: false
          load: true
          cache-from: type=gha,scope=appa-runtime
          cache-to: type=gha,mode=min,scope=appa-runtime

      - name: Smoke-test the shared runtime image
        run: |
          docker run --detach --name appa-runtime-ci \
            --publish 127.0.0.1:18787:18787 \
            --volume "$PWD/charts/appa-runtime/files/appa.toml:/etc/appa/appa.toml:ro" \
            appa-runtime:ci
          trap 'docker rm --force appa-runtime-ci >/dev/null 2>&1 || true' EXIT
          healthy=false
          for _ in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:18787/health >/dev/null; then
              healthy=true
              break
            fi
            if [ "$(docker inspect --format '{{.State.Running}}' appa-runtime-ci)" != true ]; then
              docker logs appa-runtime-ci
              exit 1
            fi
            sleep 1
          done
          if [ "$healthy" != true ]; then
            docker logs appa-runtime-ci
            exit 1
          fi
          python3 -c \
            'import json, urllib.request; body=json.load(urllib.request.urlopen("http://127.0.0.1:18787/batteries", timeout=2)); assert any(item["name"] == "slack" for item in body["batteries"])'

      - name: Build the Python plugin image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: integrations/kagent/appa-kagent-adk
          tags: appa-kagent-adk:ci
          push: false
          cache-from: type=gha,scope=appa-kagent-adk
          cache-to: type=gha,mode=max,scope=appa-kagent-adk

      - name: Build the go plugin image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: integrations/kagent/appa-kagent-adk-go
          tags: appa-kagent-adk-go:ci
          push: false
          cache-from: type=gha,scope=appa-kagent-adk-go
          cache-to: type=gha,mode=max,scope=appa-kagent-adk-go

      - name: Build the demo tools image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: integrations/kagent/demo
          tags: appa-demo-tools:ci
          push: false
          cache-from: type=gha,scope=appa-demo-tools
          cache-to: type=gha,mode=max,scope=appa-demo-tools

      - name: Build the demo mocks image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: integrations/kagent/demo/mocks
          tags: appa-demo-mocks:ci
          push: false
          cache-from: type=gha,scope=appa-demo-mocks
          cache-to: type=gha,mode=max,scope=appa-demo-mocks

  # The two multi-platform release images also build on the same native
  # arm64 runner type the release workflow uses. No first arm build waits
  # until after a release tag exists.
  shared-images-arm-build:
    name: Shared Images Build (arm64)
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      # The native arm runner has the same unused toolchain payload. Reclaim
      # it while checkout and Buildx setup proceed.
      - name: Reclaim disk space (background)
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup &

      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build the shared runtime image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: appa-runtime/Dockerfile
          platforms: linux/arm64
          tags: appa-runtime:ci-arm64
          push: false
          cache-from: type=gha,scope=appa-runtime-arm64
          cache-to: type=gha,mode=min,scope=appa-runtime-arm64

      - name: Build the Python plugin image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: integrations/kagent/appa-kagent-adk
          platforms: linux/arm64
          tags: appa-kagent-adk:ci-arm64
          push: false
          cache-from: type=gha,scope=appa-kagent-adk-arm64
          cache-to: type=gha,mode=max,scope=appa-kagent-adk-arm64
