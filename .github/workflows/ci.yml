name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: true

jobs:
  plugin-checks:
    name: Plugin Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Check plugin shell syntax
        run: |
          sh -n integrations/claude-code/plugin/hooks/ensure-runtime.sh \
            integrations/claude-code/plugin/statusline.sh

      - name: Lint plugin shell scripts
        run: |
          shellcheck -s sh integrations/claude-code/plugin/hooks/ensure-runtime.sh
          shellcheck -s sh integrations/claude-code/plugin/report-install.sh

      - name: Validate plugin JSON
        run: |
          jq -e .hooks integrations/claude-code/plugin/hooks/hooks.json >/dev/null
          jq -e .hooks integrations/claude-code/plugin/hooks/hooks.windows.json >/dev/null
          jq -e .plugins .claude-plugin/marketplace.json >/dev/null
          jq -e .plugins integrations/claude-code/.claude-plugin/marketplace.json >/dev/null

      - name: Test battery resolvers
        run: python3 -m unittest discover -s batteries/claude-code -p 'test_*.py'

  rust-checks:
    name: Rust Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        run: rustup show

      - name: Rust formatting
        run: cargo fmt --all --check

      - name: Rust check
        run: cargo check --workspace --locked

      - name: Rust lint
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Rust tests
        run: cargo test --workspace --locked

  python-binding-checks:
    name: Python Binding Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        run: rustup show

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Python binding tests
        run: uv run --project appa-agent-python pytest appa-agent-python/tests

  corp-benchmark-checks:
    name: Corporate Benchmark Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Corporate benchmark tests
        run: uv run --project bench/corp pytest bench/corp/tests

  agentthreatbench-checks:
    name: AgentThreatBench Checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout project
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        run: rustup show

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: AgentThreatBench lint
        run: |
          uv run --project bench/agentthreatbench ruff check bench/agentthreatbench
          uv run --project bench/agentthreatbench ruff format --check bench/agentthreatbench

      - name: AgentThreatBench tests
        run: uv run --project bench/agentthreatbench pytest bench/agentthreatbench/tests
