name: Nightly Canary

# Nightly defended-vs-empty canary: `bench-corp canary` runs both APPA arms
# (guarded `appa`, empty `appa-open`) over the full scenario set under the
# redteam-chaos prompt profile, on the pinned model pair. Red means the
# harness broke or the defended arm leaked — never a model-score dip; the
# empty arm is reported for context only.
#
# Results stay internal: the run directory is uploaded as a workflow
# artifact, the verdict goes to Slack, and nothing is committed back.
#
# Required repository secrets: OPENROUTER_API_KEY (model access),
# APPA_CANARY_SLACK_WEBHOOK_URL (incoming webhook; skipped when absent).
# Optional GCS copy of the run records: set the APPA_CANARY_GCS_BUCKET
# repository variable (bucket name, no gs:// prefix) and grant the
# APPA_GCP_SERVICE_ACCOUNT / APPA_GCP_WORKLOAD_IDENTITY_PROVIDER identity
# write access to it.

on:
  schedule:
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      benchmark_archive_url:
        description: One-time authenticated URL for the prepared benchmark archives
        required: false
        type: string
      benchmark_archive_sha256:
        description: SHA-256 of the transfer archive
        required: false
        type: string

permissions: {}

concurrency:
  group: nightly-canary
  cancel-in-progress: false

jobs:
  canary:
    if: ${{ inputs.benchmark_archive_url == '' }}
    name: Defended vs empty
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      id-token: write # Workload Identity Federation for the optional GCS upload.
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Setup Rust
        run: rustup show

      - name: Setup uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true

      - name: Run canary
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: uv run --project bench/corp bench-corp canary

      - name: Locate run records
        if: always()
        id: rundir
        run: |
          dir=$(find bench/corp/runs -mindepth 1 -maxdepth 1 -type d 2>/dev/null | head -n 1 || true)
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Upload run records
        if: ${{ always() && steps.rundir.outputs.dir != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: canary-run-${{ github.run_id }}
          path: ${{ steps.rundir.outputs.dir }}

      - name: Authenticate to Google Cloud
        if: ${{ always() && vars.APPA_CANARY_GCS_BUCKET != '' && steps.rundir.outputs.dir != '' }}
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          service_account: ${{ secrets.APPA_GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.APPA_GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up Google Cloud
        if: ${{ always() && vars.APPA_CANARY_GCS_BUCKET != '' && steps.rundir.outputs.dir != '' }}
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Upload run records to GCS
        if: ${{ always() && vars.APPA_CANARY_GCS_BUCKET != '' && steps.rundir.outputs.dir != '' }}
        env:
          BUCKET: ${{ vars.APPA_CANARY_GCS_BUCKET }}
          RUN_DIR: ${{ steps.rundir.outputs.dir }}
        run: gcloud storage cp -r "$RUN_DIR" "gs://$BUCKET/canary/"

      - name: Notify Slack
        if: always()
        env:
          WEBHOOK: ${{ secrets.APPA_CANARY_SLACK_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_DIR: ${{ steps.rundir.outputs.dir }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "APPA_CANARY_SLACK_WEBHOOK_URL not configured; skipping"
            exit 0
          fi
          if [ -n "$RUN_DIR" ] && [ -f "$RUN_DIR/slack.json" ]; then
            curl -sf -X POST -H 'Content-Type: application/json' \
              --data @"$RUN_DIR/slack.json" "$WEBHOOK"
          else
            printf '{"text":"🔥 APPA nightly canary crashed before reporting: %s"}' "$RUN_URL" |
              curl -sf -X POST -H 'Content-Type: application/json' --data @- "$WEBHOOK"
          fi

  publish-benchmark-archive:
    if: ${{ inputs.benchmark_archive_url != '' }}
    name: Publish prepared benchmark archives
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download and verify transfer archive
        env:
          SOURCE_URL: ${{ inputs.benchmark_archive_url }}
          SOURCE_SHA256: ${{ inputs.benchmark_archive_sha256 }}
        run: |
          curl --fail --location --cookie-jar /tmp/portal-cookie --cookie /tmp/portal-cookie \
            --output /tmp/bench-publish-transfer.tar.gz "$SOURCE_URL"
          echo "$SOURCE_SHA256  /tmp/bench-publish-transfer.tar.gz" | sha256sum --check --strict
          mkdir /tmp/bench-publish
          tar -xzf /tmp/bench-publish-transfer.tar.gz -C /tmp/bench-publish

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          service_account: ${{ secrets.APPA_BENCH_GCP_SERVICE_ACCOUNT }}
          workload_identity_provider: ${{ secrets.APPA_GCP_WORKLOAD_IDENTITY_PROVIDER }}

      - name: Set up Google Cloud
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1

      - name: Publish and verify immutable archives
        env:
          BUCKET: archestra-appa-bench-archive
        run: |
          set -euo pipefail
          commit=c79958dce63cf37ca4fc269c787eb54a8782e64b
          publish() {
            bench=$1
            run=$2
            index="/tmp/bench-publish/$run.index.json"
            archive=$(jq -r .archive "$index")
            sha=$(jq -r .sha256 "$index")
            prefix="gs://$BUCKET/bench/$bench/$commit/$run"
            echo "$sha  /tmp/bench-publish/$archive" | sha256sum --check --strict
            gcloud storage cp --no-clobber "/tmp/bench-publish/$archive" "$prefix/$archive"
            gcloud storage cp --no-clobber "$index" "$prefix/index.json"
            gcloud storage cp "$prefix/$archive" "/tmp/verified-$archive"
            echo "$sha  /tmp/verified-$archive" | sha256sum --check --strict
            gcloud storage ls "$prefix/"
          }
          publish agentthreatbench full-sonnet-5
          publish corp 20260911-162255
          publish corp 20260911-164615
