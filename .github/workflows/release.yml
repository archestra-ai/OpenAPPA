name: Release OpenAPPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_existing_release:
        description: Publish assets for an existing draft release
        required: false
        default: false
        type: boolean
      version:
        description: Existing version without the v prefix (for example, 0.2.0)
        required: false
        type: string

permissions: {}

concurrency:
  group: release-openappa-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required to create release tags and draft release metadata.
      issues: write # Required to apply Release Please labels.
      pull-requests: write # Required to create and update the release approval PR.
    outputs:
      should_publish: ${{ steps.resolve.outputs.should_publish }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      version: ${{ steps.resolve.outputs.version }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
    steps:
      # Create releases before calculating the next release PR. A draft release
      # needs its forced tag to exist before Release Please can anchor that calculation.
      - name: Create releases for merged release PRs
        if: ${{ !inputs.publish_existing_release }}
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json
          target-branch: main
          skip-github-pull-request: true

      - name: Resolve release to publish
        id: resolve
        env:
          ACTION_RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          ACTION_TAG_NAME: ${{ steps.release.outputs.tag_name }}
          ACTION_VERSION: ${{ steps.release.outputs.version }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUT_PUBLISH_EXISTING_RELEASE: ${{ inputs.publish_existing_release }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$INPUT_PUBLISH_EXISTING_RELEASE" = "true" ]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::version is required and must be a release version"
              exit 1
            fi
            tag_name=v${INPUT_VERSION}
            is_draft=$(gh release view "$tag_name" --json isDraft --jq '.isDraft')
            if [ "$is_draft" != "true" ]; then
              echo "::error::${tag_name} is not a draft release"
              exit 1
            fi
            source_commit=$(gh api "repos/${GH_REPO}/commits/${tag_name}" --jq '.sha')
            if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::${tag_name} did not resolve to a commit"
              exit 1
            fi
            {
              echo "should_publish=true"
              echo "version=${INPUT_VERSION}"
              echo "tag_name=${tag_name}"
              echo "source_commit=${source_commit}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "should_publish=${ACTION_RELEASE_CREATED:-false}"
            echo "version=${ACTION_VERSION}"
            echo "tag_name=${ACTION_TAG_NAME}"
            echo "source_commit=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

  release-pr:
    name: Create or update next release PR
    if: ${{ !inputs.publish_existing_release }}
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required to update the release manifest and changelog.
      issues: write # Required to apply Release Please labels.
      pull-requests: write # Required to create and update the approval PR.
    steps:
      - name: Create or update next release PR
        id: release-pr
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json
          target-branch: main
          skip-github-release: true

      - name: Checkout release PR
        if: ${{ steps.release-pr.outputs.prs_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release-pr.outputs.pr).headBranchName }}
          fetch-depth: 1
          persist-credentials: false

      - name: Synchronize release version
        if: ${{ steps.release-pr.outputs.prs_created == 'true' }}
        uses: ./.github/actions/check-release-versions
        with:
          relock: "true"

      - name: Update release PR
        if: ${{ steps.release-pr.outputs.prs_created == 'true' }}
        env:
          RELEASE_PR: ${{ steps.release-pr.outputs.pr }}
          RELEASE_PUSH_TOKEN: ${{ github.token }}
        run: |
          release_branch=$(jq -er '.headBranchName' <<<"$RELEASE_PR")
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "chore: synchronize release version"
          git -c credential.helper= \
            -c 'credential.helper=!f() { test "$1" = get && printf "%s\n" "username=x-access-token" "password=$RELEASE_PUSH_TOKEN"; }; f' \
            push origin "HEAD:${release_branch}"

  plugin-artifact:
    name: Build the plugin artifact
    if: ${{ needs.release-please.outputs.should_publish == 'true' }}
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify and checkout release source
        uses: ./.github/actions/verify-release-source
        with:
          release_ref: ${{ needs.release-please.outputs.tag_name }}
          source_commit: ${{ needs.release-please.outputs.source_commit }}

      - name: Package the plugin
        id: package
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          mkdir -p dist
          sh scripts/appa-stage-plugin-bundle.sh staged
          tar -C staged -czf "dist/appa-plugin-${VERSION}.tar.gz" .
          digest=$(sha256sum "dist/appa-plugin-${VERSION}.tar.gz" | cut -d' ' -f1)
          echo "sha256=${digest}" >> "$GITHUB_OUTPUT"

      - name: Upload the plugin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appa-plugin
          path: dist/appa-plugin-${{ needs.release-please.outputs.version }}.tar.gz
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  build-binaries:
    name: Build release binaries
    if: ${{ needs.release-please.outputs.should_publish == 'true' }}
    needs:
      - release-please
      - plugin-artifact
    permissions:
      contents: read # Required to verify and check out the release tag.
    uses: ./.github/workflows/build-appa-runtime-binaries.yml
    with:
      release_ref: ${{ needs.release-please.outputs.tag_name }}
      source_commit: ${{ needs.release-please.outputs.source_commit }}
      expected_version: ${{ needs.release-please.outputs.version }}
      plugin_sha256: ${{ needs.plugin-artifact.outputs.sha256 }}

  # Build each shared image on its native architecture. The digest
  # artifacts let the merge job publish one immutable multi-platform tag.
  publish-shared-image-legs:
    name: Build ${{ matrix.image }} (${{ matrix.arch }})
    if: ${{ needs.release-please.outputs.should_publish == 'true' }}
    needs: release-please
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: appa-runtime
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: appa-runtime
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
          - image: appa-kagent-adk
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - image: appa-kagent-adk
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read # Required to verify and check out the release tag.
      packages: write # Required to push the image leg by digest.
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify and checkout release source
        uses: ./.github/actions/verify-release-source
        with:
          release_ref: ${{ needs.release-please.outputs.tag_name }}
          source_commit: ${{ needs.release-please.outputs.source_commit }}

      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the image registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push appa-runtime leg
        if: ${{ matrix.image == 'appa-runtime' }}
        id: build-runtime
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: appa-runtime/Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/archestra-ai/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-please.outputs.source_commit }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}

      - name: Build and push appa-kagent-adk leg
        if: ${{ matrix.image == 'appa-kagent-adk' }}
        id: build-adk
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: integrations/kagent/appa-kagent-adk
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/archestra-ai/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          provenance: true
          sbom: true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=${{ matrix.image }}-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-please.outputs.source_commit }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}

      - name: Record image digest
        env:
          RUNTIME_DIGEST: ${{ steps.build-runtime.outputs.digest }}
          ADK_DIGEST: ${{ steps.build-adk.outputs.digest }}
        run: |
          DIGEST=${RUNTIME_DIGEST:-$ADK_DIGEST}
          if [[ ! "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::image build did not report a digest"
            exit 1
          fi
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.image }}-${{ matrix.arch }}
          path: /tmp/digests/*
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  publish-shared-images:
    name: Publish shared multi-platform images
    if: ${{ needs.release-please.outputs.should_publish == 'true' }}
    needs:
      - release-please
      - publish-shared-image-legs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Required to download image digest artifacts.
      packages: write # Required to publish the merged manifests.
    steps:
      - name: Download appa-runtime digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-appa-runtime-*
          path: /tmp/digests/appa-runtime
          merge-multiple: true

      - name: Download appa-kagent-adk digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digests-appa-kagent-adk-*
          path: /tmp/digests/appa-kagent-adk
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the image registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Merge and verify image manifests
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          for image in appa-runtime appa-kagent-adk; do
            sources=()
            for digest in "/tmp/digests/${image}"/*; do
              sources+=("ghcr.io/archestra-ai/${image}@sha256:${digest##*/}")
            done
            if [ "${#sources[@]}" -ne 2 ]; then
              echo "::error::${image} has ${#sources[@]} platform digests, expected 2"
              exit 1
            fi
            docker buildx imagetools create \
              --tag "ghcr.io/archestra-ai/${image}:${VERSION}" \
              "${sources[@]}"
            docker buildx imagetools inspect \
              "ghcr.io/archestra-ai/${image}:${VERSION}"
            docker buildx imagetools inspect --raw \
              "ghcr.io/archestra-ai/${image}:${VERSION}" \
              | jq -e '[.manifests[].platform | select(.os == "linux") | .architecture] | sort == ["amd64", "arm64"]'
          done

  # The three amd64 kagent/demo images and the `golang-adk` alias. Each
  # package needs public visibility, an organization setting made once
  # after its first publish. The charts default pull anonymously.
  publish-images:
    name: Publish container images
    if: ${{ needs.release-please.outputs.should_publish == 'true' }}
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # Required to verify and check out the release tag.
      packages: write # Required to push the images to GitHub Packages.
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify and checkout release source
        uses: ./.github/actions/verify-release-source
        with:
          release_ref: ${{ needs.release-please.outputs.tag_name }}
          source_commit: ${{ needs.release-please.outputs.source_commit }}

      # Two images pass 1.5 GB. The build needs the space the runner's
      # preinstalled toolchains hold.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo docker image prune --all --force
          df -h /

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to the image registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push appa-kagent-adk-go
        id: adk-go
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: integrations/kagent/appa-kagent-adk-go
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/archestra-ai/appa-kagent-adk-go:${{ needs.release-please.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-please.outputs.source_commit }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}

      - name: Build and push appa-demo-tools
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: integrations/kagent/demo
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/archestra-ai/appa-demo-tools:${{ needs.release-please.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-please.outputs.source_commit }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}

      - name: Build and push appa-demo-mocks
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: integrations/kagent/demo/mocks
          platforms: linux/amd64
          push: true
          provenance: true
          sbom: true
          tags: ghcr.io/archestra-ai/appa-demo-mocks:${{ needs.release-please.outputs.version }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.release-please.outputs.source_commit }}
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}

      # kagent's controller derives the Go runtime image from the python one:
      # it replaces the last path segment with `golang-adk`. The alias carries
      # that name and the digest this job pushed.
      - name: Alias the Go image to the name kagent derives
        env:
          GO_DIGEST: ${{ steps.adk-go.outputs.digest }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if [[ ! "$GO_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::the Go image build did not report a digest"
            exit 1
          fi
          docker buildx imagetools create \
            --tag "ghcr.io/archestra-ai/golang-adk:${VERSION}" \
            "ghcr.io/archestra-ai/appa-kagent-adk-go@${GO_DIGEST}"
          docker buildx imagetools inspect \
            "ghcr.io/archestra-ai/appa-kagent-adk-go:${VERSION}"
          docker buildx imagetools inspect \
            "ghcr.io/archestra-ai/golang-adk:${VERSION}"
          alias_digest=$(docker buildx imagetools inspect \
            --format '{{.Manifest.Digest}}' \
            "ghcr.io/archestra-ai/golang-adk:${VERSION}")
          if [ "$alias_digest" != "$GO_DIGEST" ]; then
            echo "::error::golang-adk resolves to ${alias_digest}, not ${GO_DIGEST}"
            exit 1
          fi
          anonymous_token=$(curl --fail --silent \
            'https://ghcr.io/token?scope=repository%3Aarchestra-ai%2Fgolang-adk%3Apull&service=ghcr.io' \
            | jq -r .token)
          test -n "$anonymous_token"
          curl --fail --silent --output /dev/null \
            -H "Authorization: Bearer $anonymous_token" \
            -H 'Accept: application/vnd.oci.image.index.v1+json' \
            "https://ghcr.io/v2/archestra-ai/golang-adk/manifests/${VERSION}"

  publish-chart:
    name: Publish Helm charts
    if: ${{ needs.release-please.outputs.should_publish == 'true' }}
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Required to verify and check out the release tag.
      packages: write # Required to push the OCI chart to GitHub Packages.
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify and checkout release source
        uses: ./.github/actions/verify-release-source
        with:
          release_ref: ${{ needs.release-please.outputs.tag_name }}
          source_commit: ${{ needs.release-please.outputs.source_commit }}

      - name: Package and verify the chart
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          helm lint charts/appa-runtime
          helm lint integrations/kagent/demo/chart
          mkdir -p dist
          helm package charts/appa-runtime --destination dist
          helm package integrations/kagent/demo/chart --destination dist
          for chart in \
            "dist/appa-runtime-${VERSION}.tgz" \
            "dist/appa-kagent-demo-${VERSION}.tgz"; do
            test -f "$chart"
            test "$(helm show chart "$chart" | sed -n 's/^version: *//p')" = "$VERSION"
            test "$(helm show chart "$chart" | sed -n 's/^appVersion: *//p')" = "$VERSION"
          done

      - name: Log in to the chart registry
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USERNAME: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | helm registry login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin

      - name: Publish the chart
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          helm push "dist/appa-runtime-${VERSION}.tgz" oci://ghcr.io/archestra-ai/charts
          helm push "dist/appa-kagent-demo-${VERSION}.tgz" oci://ghcr.io/archestra-ai/charts

      - name: Upload the runtime chart artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appa-runtime-chart
          path: dist/appa-runtime-${{ needs.release-please.outputs.version }}.tgz
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 7

      - name: Upload the demo chart artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appa-kagent-demo-chart
          path: dist/appa-kagent-demo-${{ needs.release-please.outputs.version }}.tgz
          archive: false
          overwrite: true
          if-no-files-found: error
          retention-days: 7

  publish-release:
    name: Publish GitHub release
    if: ${{ needs.release-please.outputs.should_publish == 'true' }}
    needs:
      - release-please
      - plugin-artifact
      - build-binaries
      - publish-shared-images
      - publish-images
      - publish-chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Required to download archives from the reusable build jobs.
      contents: write # Required to upload assets and publish the draft release.
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify and checkout release source
        uses: ./.github/actions/verify-release-source
        with:
          release_ref: ${{ needs.release-please.outputs.tag_name }}
          source_commit: ${{ needs.release-please.outputs.source_commit }}

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: appa-*
          merge-multiple: true
          skip-decompress: true

      # The installer ships beside the archives it installs, so the script a
      # user pipes into sh is the one this release's source carried.
      - name: Stage the installer
        run: cp scripts/appa-install.sh dist/appa-install.sh

      - name: Verify release assets and write checksums
        working-directory: dist
        env:
          EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
          PLUGIN_SHA256: ${{ needs.plugin-artifact.outputs.sha256 }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          test "$TAG_NAME" = "v${EXPECTED_VERSION}"
          # Six binary-only platform archives, the platform-independent plugin
          # artifact every binary accepts, and both Helm charts.
          expected_archives=(
            appa-x86_64-unknown-linux-gnu.tar.gz
            appa-aarch64-unknown-linux-gnu.tar.gz
            appa-x86_64-apple-darwin.tar.gz
            appa-aarch64-apple-darwin.tar.gz
            appa-x86_64-pc-windows-msvc.zip
            appa-aarch64-pc-windows-msvc.zip
            "appa-plugin-${EXPECTED_VERSION}.tar.gz"
            "appa-runtime-${EXPECTED_VERSION}.tgz"
            "appa-kagent-demo-${EXPECTED_VERSION}.tgz"
          )
          for archive in "${expected_archives[@]}"; do
            test -f "$archive" || {
              echo "::error::missing release archive: $archive"
              exit 1
            }
          done
          shopt -s nullglob
          actual_archives=(appa-*.tar.gz appa-*.zip appa-*.tgz)
          if [ "${#actual_archives[@]}" -ne "${#expected_archives[@]}" ]; then
            echo "::error::expected exactly ${#expected_archives[@]} release archives, found ${#actual_archives[@]}"
            exit 1
          fi
          # The binaries were built with this digest compiled in; a mismatch
          # here would ship a release whose binaries refuse their own plugin.
          published=$(sha256sum "appa-plugin-${EXPECTED_VERSION}.tar.gz" | cut -d' ' -f1)
          if [ "$published" != "$PLUGIN_SHA256" ]; then
            echo "::error::the published plugin artifact is not the one the binaries accept"
            exit 1
          fi
          sh -n appa-install.sh
          # The installer is an asset like any other. Leaving it out of
          # SHA256SUMS meant the one file users are told to pipe into a shell
          # was the only one they could not verify.
          sha256sum "${expected_archives[@]}" appa-install.sh > SHA256SUMS

      - name: Refuse an already-published release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          is_draft=$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')
          # Publishing is the whole point of this job. A release that is already
          # public cannot be published again, and skipping both remaining steps
          # would report success for a run that shipped nothing -- the worst
          # possible answer for a workflow whose recovery story is "dispatch it
          # again".
          if [ "$is_draft" != "true" ]; then
            echo "::error::${TAG_NAME} is already published; nothing was uploaded"
            exit 1
          fi

      - name: Upload release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber

      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release edit "$TAG_NAME" --draft=false
          echo "Published release $TAG_NAME."
