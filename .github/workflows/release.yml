name: Release OpenAPPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_existing_release:
        description: Publish assets for an existing draft release
        required: false
        default: false
        type: boolean
      version:
        description: Existing version without the v prefix (for example, 0.2.0)
        required: false
        type: string

permissions: {}

concurrency:
  group: release-openappa-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required to create release tags and draft release metadata.
      issues: write # Required to apply Release Please labels.
      pull-requests: write # Required to create and update the release approval PR.
    outputs:
      should_publish: ${{ steps.resolve.outputs.should_publish }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      version: ${{ steps.resolve.outputs.version }}
      source_commit: ${{ steps.resolve.outputs.source_commit }}
    steps:
      # Create releases before calculating the next release PR. A draft release
      # needs its forced tag to exist before Release Please can anchor that calculation.
      - name: Create releases for merged release PRs
        if: ${{ !inputs.publish_existing_release }}
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json
          target-branch: main
          skip-github-pull-request: true

      - name: Resolve release to publish
        id: resolve
        env:
          ACTION_RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          ACTION_TAG_NAME: ${{ steps.release.outputs.tag_name }}
          ACTION_VERSION: ${{ steps.release.outputs.version }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUT_PUBLISH_EXISTING_RELEASE: ${{ inputs.publish_existing_release }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$INPUT_PUBLISH_EXISTING_RELEASE" = "true" ]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::version is required and must be a release version"
              exit 1
            fi
            tag_name=v${INPUT_VERSION}
            is_draft=$(gh release view "$tag_name" --json isDraft --jq '.isDraft')
            if [ "$is_draft" != "true" ]; then
              echo "::error::${tag_name} is not a draft release"
              exit 1
            fi
            source_commit=$(gh api "repos/${GH_REPO}/commits/${tag_name}" --jq '.sha')
            if [[ ! "$source_commit" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::${tag_name} did not resolve to a commit"
              exit 1
            fi
            {
              echo "should_publish=true"
              echo "version=${INPUT_VERSION}"
              echo "tag_name=${tag_name}"
              echo "source_commit=${source_commit}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "should_publish=${ACTION_RELEASE_CREATED:-false}"
            echo "version=${ACTION_VERSION}"
            echo "tag_name=${ACTION_TAG_NAME}"
            echo "source_commit=${GITHUB_SHA}"
          } >> "$GITHUB_OUTPUT"

  release-pr:
    name: Create or update next release PR
    if: ${{ !inputs.publish_existing_release }}
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required to update the release manifest and changelog.
      issues: write # Required to apply Release Please labels.
      pull-requests: write # Required to create and update the approval PR.
    steps:
      - name: Create or update next release PR
        id: release-pr
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json
          target-branch: main
          skip-github-release: true

      - name: Checkout release PR
        if: ${{ steps.release-pr.outputs.prs_created == 'true' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ fromJSON(steps.release-pr.outputs.pr).headBranchName }}
          fetch-depth: 1
          persist-credentials: false

      - name: Synchronize release version
        if: ${{ steps.release-pr.outputs.prs_created == 'true' }}
        run: |
          version=$(tr -d '\r\n' < .github/release-please/version.txt)
          cargo update --workspace
          cargo_version=$(cargo metadata --locked --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "appa") | .version')
          plugin_version=$(jq -r '.version' \
            integrations/claude-code/plugin/.claude-plugin/plugin.json)
          test "$cargo_version" = "$version"
          test "$plugin_version" = "$version"

      - name: Update release PR
        if: ${{ steps.release-pr.outputs.prs_created == 'true' }}
        env:
          RELEASE_PR: ${{ steps.release-pr.outputs.pr }}
          RELEASE_PUSH_TOKEN: ${{ github.token }}
        run: |
          release_branch=$(jq -er '.headBranchName' <<<"$RELEASE_PR")
          if git diff --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock
          git commit -m "chore: synchronize release version"
          git -c credential.helper= \
            -c 'credential.helper=!f() { test "$1" = get && printf "%s\n" "username=x-access-token" "password=$RELEASE_PUSH_TOKEN"; }; f' \
            push origin "HEAD:${release_branch}"

  plugin-artifact:
    name: Build the plugin artifact
    if: ${{ needs.release-please.outputs.should_publish == 'true' }}
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      sha256: ${{ steps.package.outputs.sha256 }}
    steps:
      - name: Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify and checkout release source
        env:
          RELEASE_REF: ${{ needs.release-please.outputs.tag_name }}
          SOURCE_COMMIT: ${{ needs.release-please.outputs.source_commit }}
        run: |
          git fetch --no-tags origin \
            "refs/tags/${RELEASE_REF}:refs/tags/${RELEASE_REF}"
          test "$(git rev-parse "${RELEASE_REF}^{commit}")" = "$SOURCE_COMMIT"
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Package the plugin
        id: package
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          mkdir -p dist
          sh scripts/appa-stage-plugin-bundle.sh staged
          tar -C staged -czf "dist/appa-plugin-${VERSION}.tar.gz" .
          digest=$(sha256sum "dist/appa-plugin-${VERSION}.tar.gz" | cut -d' ' -f1)
          echo "sha256=${digest}" >> "$GITHUB_OUTPUT"

      - name: Upload the plugin artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appa-plugin
          path: dist/appa-plugin-${{ needs.release-please.outputs.version }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 7

  build-binaries:
    name: Build release binaries
    if: ${{ needs.release-please.outputs.should_publish == 'true' }}
    needs:
      - release-please
      - plugin-artifact
    permissions:
      contents: read # Required to verify and check out the release tag.
    uses: ./.github/workflows/build-appa-runtime-binaries.yml
    with:
      release_ref: ${{ needs.release-please.outputs.tag_name }}
      source_commit: ${{ needs.release-please.outputs.source_commit }}
      expected_version: ${{ needs.release-please.outputs.version }}
      plugin_sha256: ${{ needs.plugin-artifact.outputs.sha256 }}

  publish-release:
    name: Publish GitHub release
    if: ${{ needs.release-please.outputs.should_publish == 'true' }}
    needs:
      - release-please
      - plugin-artifact
      - build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Required to download archives from the reusable build jobs.
      contents: write # Required to upload assets and publish the draft release.
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Verify and checkout release source
        env:
          RELEASE_REF: ${{ needs.release-please.outputs.tag_name }}
          SOURCE_COMMIT: ${{ needs.release-please.outputs.source_commit }}
        run: |
          git fetch --no-tags origin \
            "refs/tags/${RELEASE_REF}:refs/tags/${RELEASE_REF}"
          test "$(git rev-parse "${RELEASE_REF}^{commit}")" = "$SOURCE_COMMIT"
          git checkout --detach "$SOURCE_COMMIT"
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: appa-*
          merge-multiple: true
          skip-decompress: true

      # The installer ships beside the archives it installs, so the script a
      # user pipes into sh is the one this release's source carried.
      - name: Stage the installer
        run: cp scripts/appa-install.sh dist/appa-install.sh

      - name: Verify release assets and write checksums
        working-directory: dist
        env:
          EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
          PLUGIN_SHA256: ${{ needs.plugin-artifact.outputs.sha256 }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          test "$TAG_NAME" = "v${EXPECTED_VERSION}"
          # Six binary-only platform archives plus the one platform-independent
          # plugin artifact every binary of this release is built to accept.
          expected_archives=(
            appa-x86_64-unknown-linux-gnu.tar.gz
            appa-aarch64-unknown-linux-gnu.tar.gz
            appa-x86_64-apple-darwin.tar.gz
            appa-aarch64-apple-darwin.tar.gz
            appa-x86_64-pc-windows-msvc.zip
            appa-aarch64-pc-windows-msvc.zip
            "appa-plugin-${EXPECTED_VERSION}.tar.gz"
          )
          for archive in "${expected_archives[@]}"; do
            test -f "$archive" || {
              echo "::error::missing release archive: $archive"
              exit 1
            }
          done
          shopt -s nullglob
          actual_archives=(appa-*.tar.gz appa-*.zip)
          if [ "${#actual_archives[@]}" -ne "${#expected_archives[@]}" ]; then
            echo "::error::expected exactly ${#expected_archives[@]} release archives, found ${#actual_archives[@]}"
            exit 1
          fi
          # The binaries were built with this digest compiled in; a mismatch
          # here would ship a release whose binaries refuse their own plugin.
          published=$(sha256sum "appa-plugin-${EXPECTED_VERSION}.tar.gz" | cut -d' ' -f1)
          if [ "$published" != "$PLUGIN_SHA256" ]; then
            echo "::error::the published plugin artifact is not the one the binaries accept"
            exit 1
          fi
          sh -n appa-install.sh
          # The installer is an asset like any other. Leaving it out of
          # SHA256SUMS meant the one file users are told to pipe into a shell
          # was the only one they could not verify.
          sha256sum "${expected_archives[@]}" appa-install.sh > SHA256SUMS

      - name: Refuse an already-published release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          is_draft=$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')
          # Publishing is the whole point of this job. A release that is already
          # public cannot be published again, and skipping both remaining steps
          # would report success for a run that shipped nothing -- the worst
          # possible answer for a workflow whose recovery story is "dispatch it
          # again".
          if [ "$is_draft" != "true" ]; then
            echo "::error::${TAG_NAME} is already published; nothing was uploaded"
            exit 1
          fi

      - name: Upload release assets
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber

      - name: Publish release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release edit "$TAG_NAME" --draft=false
          echo "Published release $TAG_NAME."
