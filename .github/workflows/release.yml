name: Release OpenAPPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_existing_release:
        description: Publish assets for an existing draft release
        required: false
        default: false
        type: boolean
      version:
        description: Existing version without the v prefix (for example, 0.2.0)
        required: false
        type: string
      tag_name:
        description: Existing release tag (for example, v0.2.0)
        required: false
        type: string

permissions: {}

concurrency:
  group: release-openappa-main
  cancel-in-progress: false

jobs:
  release-please:
    name: Create or resolve release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required to create release tags and draft release metadata.
      issues: write # Required to apply Release Please labels.
      pull-requests: write # Required to create and update the release approval PR.
    outputs:
      should_publish: ${{ steps.resolve.outputs.should_publish }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      # Create releases before calculating the next release PR. A draft release
      # needs its forced tag to exist before Release Please can anchor that calculation.
      - name: Create releases for merged release PRs
        if: ${{ !inputs.publish_existing_release }}
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json
          target-branch: main
          skip-github-pull-request: true

      - name: Resolve release to publish
        id: resolve
        env:
          ACTION_RELEASE_CREATED: ${{ steps.release.outputs.release_created }}
          ACTION_TAG_NAME: ${{ steps.release.outputs.tag_name }}
          ACTION_VERSION: ${{ steps.release.outputs.version }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUT_PUBLISH_EXISTING_RELEASE: ${{ inputs.publish_existing_release }}
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$INPUT_PUBLISH_EXISTING_RELEASE" = "true" ]; then
            if [[ ! "$INPUT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::version is required and must be a release version"
              exit 1
            fi
            tag_name=${INPUT_TAG_NAME:-v${INPUT_VERSION}}
            test "$tag_name" = "v${INPUT_VERSION}"
            is_draft=$(gh release view "$tag_name" --json isDraft --jq '.isDraft')
            if [ "$is_draft" != "true" ]; then
              echo "::error::${tag_name} is not a draft release"
              exit 1
            fi
            {
              echo "should_publish=true"
              echo "version=${INPUT_VERSION}"
              echo "tag_name=${tag_name}"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "should_publish=${ACTION_RELEASE_CREATED:-false}"
            echo "version=${ACTION_VERSION}"
            echo "tag_name=${ACTION_TAG_NAME}"
          } >> "$GITHUB_OUTPUT"

  release-pr:
    name: Create or update next release PR
    if: ${{ !inputs.publish_existing_release }}
    needs: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # Required to update the release manifest and changelog.
      issues: write # Required to apply Release Please labels.
      pull-requests: write # Required to create and update the approval PR.
    steps:
      - name: Create or update next release PR
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ github.token }}
          config-file: .github/release-please/release-please-config.json
          manifest-file: .github/release-please/.release-please-manifest.json
          target-branch: main
          skip-github-release: true

  build-binaries:
    name: Build release binaries
    if: ${{ needs.release-please.outputs.should_publish == 'true' }}
    needs: release-please
    permissions:
      contents: read # Required by the reusable workflow to check out the release tag.
    uses: ./.github/workflows/build-appa-runtime-binaries.yml
    with:
      source_ref: ${{ needs.release-please.outputs.tag_name }}
      expected_version: ${{ needs.release-please.outputs.version }}

  publish-release:
    name: Publish GitHub release
    if: ${{ needs.release-please.outputs.should_publish == 'true' }}
    needs:
      - release-please
      - build-binaries
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read # Required to download archives from the reusable build jobs.
      contents: write # Required to upload assets and publish the draft release.
    steps:
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Checkout released version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          path: release-source
          persist-credentials: false
          fetch-depth: 1

      - name: Download release archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          pattern: appa-runtime-v2-*
          merge-multiple: true
          skip-decompress: true

      - name: Stage installers and version
        run: cp install.sh install.ps1 release-source/version.txt dist/

      - name: Verify release assets and write checksums
        working-directory: dist
        env:
          EXPECTED_VERSION: ${{ needs.release-please.outputs.version }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          test "$TAG_NAME" = "v${EXPECTED_VERSION}"
          expected_archives=(
            appa-runtime-v2-x86_64-unknown-linux-gnu.tar.gz
            appa-runtime-v2-aarch64-unknown-linux-gnu.tar.gz
            appa-runtime-v2-x86_64-apple-darwin.tar.gz
            appa-runtime-v2-aarch64-apple-darwin.tar.gz
            appa-runtime-v2-x86_64-pc-windows-msvc.zip
            appa-runtime-v2-aarch64-pc-windows-msvc.zip
          )
          for archive in "${expected_archives[@]}"; do
            test -f "$archive" || {
              echo "::error::missing release archive: $archive"
              exit 1
            }
          done
          shopt -s nullglob
          actual_archives=(appa-runtime-v2-*.tar.gz appa-runtime-v2-*.zip)
          if [ "${#actual_archives[@]}" -ne "${#expected_archives[@]}" ]; then
            echo "::error::expected exactly 6 release archives, found ${#actual_archives[@]}"
            exit 1
          fi
          sha256sum "${expected_archives[@]}" install.sh install.ps1 version.txt > SHA256SUMS

      - name: Read release state
        id: release-state
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          is_draft=$(gh release view "$TAG_NAME" --json isDraft --jq '.isDraft')
          echo "is_draft=${is_draft}" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        if: ${{ steps.release-state.outputs.is_draft == 'true' }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" dist/* --clobber

      - name: Publish release
        if: ${{ steps.release-state.outputs.is_draft == 'true' }}
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          gh release edit "$TAG_NAME" --draft=false
          echo "Published release $TAG_NAME."
