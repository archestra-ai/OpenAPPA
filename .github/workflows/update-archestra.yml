name: Update OpenAPPA in Archestra

on:
  # Releases published with GITHUB_TOKEN do not emit another workflow event.
  # release.yml calls this workflow after publishing; this event also covers
  # stable releases published manually by a maintainer.
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable OpenAPPA tag to retry (for example v0.30.0)
        type: string
        required: true
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      source_commit:
        type: string
        required: true
    secrets:
      APPA_ARCHESTRA_UPDATER_PRIVATE_KEY:
        required: true

permissions: {}

concurrency:
  group: appa-archestra-update
  cancel-in-progress: false

jobs:
  prepare:
    if: >-
      github.repository == 'archestra-ai/OpenAPPA' &&
      (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main') &&
      (github.event_name != 'release' || !github.event.release.prerelease)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.prepare.outputs.changed }}
    steps:
      - name: Checkout updater
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: openappa
          fetch-depth: 0
          persist-credentials: false

      - name: Checkout Archestra main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: archestra-ai/archestra
          ref: main
          path: archestra
          persist-credentials: false

      - name: Install Archestra's pinned Rust toolchain
        working-directory: archestra/platform
        run: rustup show active-toolchain

      - name: Verify release and regenerate Cargo pins and lockfile
        id: prepare
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 openappa/scripts/appa-archestra-update.py prepare
          --source openappa --target archestra --tag "$RELEASE_TAG"
          --expected-sha "$SOURCE_COMMIT" --bundle prepared/update.json

      - name: Compile the embedded OpenAPPA bridge
        id: compile
        if: steps.prepare.outputs.changed == 'true'
        # Compatibility failures belong on the draft PR for human repair.
        # The publishing job reports failure after opening that draft.
        continue-on-error: true
        working-directory: archestra/platform
        run: cargo check --locked --manifest-path archestra-rs/Cargo.toml -p openappa_rs

      - name: Record compilation result for human review
        if: steps.prepare.outputs.changed == 'true'
        env:
          COMPILE_OUTCOME: ${{ steps.compile.outcome }}
        run: >-
          python3 openappa/scripts/appa-archestra-update.py record-check
          --bundle prepared/update.json --outcome "$COMPILE_OUTCOME"

      - name: Upload validated update
        if: steps.prepare.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: appa-archestra-update
          path: prepared/update.json
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: prepare
    if: needs.prepare.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      # This fresh runner never executes Archestra or release build scripts.
      - name: Checkout updater
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: openappa
          fetch-depth: 0
          persist-credentials: false

      - name: Download validated update from this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: appa-archestra-update
          path: prepared

      - name: Create Archestra-only installation token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.APPA_ARCHESTRA_UPDATER_APP_ID }}
          private-key: ${{ secrets.APPA_ARCHESTRA_UPDATER_PRIVATE_KEY }}
          owner: archestra-ai
          repositories: archestra
          permission-contents: write
          permission-pull-requests: write

      - name: Open draft PR and close superseded automation PRs
        id: publish
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_READ_TOKEN: ${{ github.token }}
          BOT_LOGIN: ${{ steps.app-token.outputs.app-slug }}[bot]
        run: >-
          python3 openappa/scripts/appa-archestra-update.py publish
          --source openappa --bundle prepared/update.json --bot-login "$BOT_LOGIN"

      - name: Report incompatible bridge after proposing the update
        if: steps.publish.outputs.compile_passed == 'false'
        run: |
          echo "::error::The release update draft requires an Archestra bridge compatibility fix. See compilation logs and native PR checks."
          exit 1
