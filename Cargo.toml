[workspace]
resolver = "3"
members = [
    "appa-agent",
    "appa-agent-python",
    "appa-builtin",
    "appa-engine",
    "appa-policy",
    "appa-runtime-v2/adapters/claude-code",
    "appa-runtime-v2/api",
    "appa-runtime-v2/runtime",
    "appa-runtime-v2/runtime/tests/fixtures/module-bad",
    "appa-runtime-v2/runtime/tests/fixtures/module-good",
    "demo/appa-demo",
    "demo/corporate-agent",
]
# Its own workspace, and no APPA dependency at all: the mock internal systems
# the corporate demo talks to over MCP. It pins an older `rmcp` than the
# runtime does, and keeps its own lockfile and its own per-manifest gate.
exclude = ["demo/corp-systems"]

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
dead_code = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_json_canonicalizer = "0.3"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
tokio-util = { version = "0.7", default-features = false }
appa-engine = { path = "appa-engine" }
appa-policy = { path = "appa-policy" }
appa-runtime-api = { path = "appa-runtime-v2/api" }
appa-runtime-v2 = { path = "appa-runtime-v2/runtime" }
