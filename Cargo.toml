[workspace]
resolver = "3"
members = ["appa-agent", "appa-agent-python", "appa-dojo-sidecar", "appa-engine", "appa-gateway", "appa-runtime", "appa-runtime-v2", "appa-sdk"]

[workspace.package]
edition = "2024"
publish = false

[workspace.lints.rust]
dead_code = "deny"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "time", "macros", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
tokio-util = { version = "0.7", default-features = false }
appa-engine = { path = "appa-engine" }
appa-runtime = { path = "appa-runtime" }
appa-sdk = { path = "appa-sdk" }
