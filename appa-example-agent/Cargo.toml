[package]
name = "appa-example-agent"
version.workspace = true
edition.workspace = true
publish = false
description = "A protoagent on the runtime: it owns the loop, the transcript and the tool catalogue, and gates every flow through the hook dispatcher"

[dependencies]
appa-runtime-api = { workspace = true }
appa-runtime = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
tempfile = "3"
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
# To read back the decision record a host subscribes to.
tracing-subscriber = { version = "0.3", default-features = false, features = ["std"] }

[lints]
workspace = true
