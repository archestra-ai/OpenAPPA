write_trust = "trusted"

[[path]]
pattern = "*/.claude/agents/*"
write_trust = "trusted"

[[path]]
pattern = "*/.claude/commands/*"
write_trust = "trusted"

[[path]]
pattern = "*/.git/hooks/*"
