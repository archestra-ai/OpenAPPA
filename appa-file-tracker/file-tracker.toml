# The file-tracker's built-in configuration. A deployment's own
# `file-tracker.toml` adds path rules and tools to these, and replaces the
# scalar settings and the sandbox.
#
#   store = "file-tracker.json"        # default: $XDG_STATE_HOME/appa/file-tracker.json
#   settle_wait_ms = 3000              # how long a call on a reserved file waits
#   reservation_timeout_secs = 300     # when an annotated, never-released call lets go
#
# A path rule labels every file its pattern matches (`*` matches any run of
# characters, `/` included). A pattern with a `/` is matched against the
# absolute, resolved path; one without, such as `*secrets*`, against the file's
# name, so a repository named `k8s-secrets` is not labeled whole. The label holds
# before any recorded write and under every later one: a read returns the
# meet of the recorded label and every matching rule. `write_trust` and
# `write_attention` are what a call that writes such a file requires.

# --- the requester's credentials are `self` data, and only a trusted session writes them ---
[[path]]
pattern = "*/.env*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.ssh/*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.aws/*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.azure/*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.kube/*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.gnupg/*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.docker/config.json"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.config/gh/*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.config/gcloud/*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.password-store/*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.netrc"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.git-credentials"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.npmrc"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.pypirc"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.databrickscfg"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.vault-token"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.claude.json"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*_history"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/id_*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*.pem"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*.key"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*.p12"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*.pfx"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*.jks"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*.keystore"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*auth.json"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*credentials*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*secrets*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*service*account*.json"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*token"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*token.json"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/Library/Keychains/*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "/etc/ssh/*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "/etc/*shadow*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "/etc/sudoers*"
audience = ["self"]
write_trust = "trusted"

# --- a container daemon reads every file, so a command that reaches it may read them all ---
# SafeBash lets a command reach a socket it declares in input_files, and the
# call carries the socket's label. Docker or Podman can mount any path into a
# container, so their sockets carry the strictest label the built-in rules give.
[[path]]
pattern = "*/docker.sock"
audience = ["self"]

[[path]]
pattern = "*/podman.sock"
audience = ["self"]

[[path]]
pattern = "*/containerd.sock"
audience = ["self"]

[[path]]
pattern = "/proc/*/environ"
audience = ["self"]

# --- what a later process reads as instructions or runs as code takes a trusted session ---
[[path]]
pattern = "*CLAUDE.md"
write_trust = "trusted"

[[path]]
pattern = "*AGENTS.md"
write_trust = "trusted"

[[path]]
pattern = "*/.claude/skills/*"
write_trust = "trusted"

[[path]]
pattern = "*/.claude/agents/*"
write_trust = "trusted"

[[path]]
pattern = "*/.claude/commands/*"
write_trust = "trusted"

# A repository's hooks, and its config, which can name programs git runs (core.hooksPath,
# core.fsmonitor): in a working tree's .git, a bare <name>.git, a submodule's .git/modules/*/
# and a worktree's config.worktree. A bare repository named otherwise is not guarded. A hooks
# directory is kept whole, so a directory output cannot add a hook either; husky's .husky/
# is the hooks directory core.hooksPath most often names.
[[path]]
pattern = "*.git/hooks"
write_trust = "trusted"

[[path]]
pattern = "*.git/hooks/*"
write_trust = "trusted"

[[path]]
pattern = "*.git/config"
write_trust = "trusted"

[[path]]
pattern = "*.git/modules/*/hooks"
write_trust = "trusted"

[[path]]
pattern = "*.git/modules/*/hooks/*"
write_trust = "trusted"

[[path]]
pattern = "*.git/modules/*/config"
write_trust = "trusted"

[[path]]
pattern = "config.worktree"
write_trust = "trusted"

[[path]]
pattern = "*/.husky*"
write_trust = "trusted"

[[path]]
pattern = "*/.bashrc"
write_trust = "trusted"

[[path]]
pattern = "*/.zshrc"
write_trust = "trusted"

[[path]]
pattern = "*/.profile"
write_trust = "trusted"

[[path]]
pattern = "*CLAUDE.local.md"
write_trust = "trusted"

[[path]]
pattern = "*/.bash_profile"
write_trust = "trusted"

[[path]]
pattern = "*/.zprofile"
write_trust = "trusted"

[[path]]
pattern = "*/Library/LaunchAgents/*"
write_trust = "trusted"

# --- the files that can turn the protection off ask the person running the session ---
[[path]]
pattern = "*/.claude/settings*"
write_attention = ["human-approval"]

[[path]]
pattern = "*/.claude/hooks/*"
write_attention = ["human-approval"]

[[path]]
pattern = "*.mcp.json"
write_attention = ["human-approval"]

[[path]]
pattern = "*/appa/appa.toml"
write_attention = ["human-approval"]

[[path]]
pattern = "*/appa/batteries/*"
write_attention = ["human-approval"]

[[path]]
pattern = "*/appa/file-tracker.*"
write_attention = ["human-approval"]

# --- the tools the plugin serves, by canonical tool id ---
[[tool]]
name = "host/claude-code/Read"
role = "read"
path = "file_path"

[[tool]]
name = "host/claude-code/Write"
role = "write"
path = "file_path"

[[tool]]
name = "host/claude-code/Edit"
role = "edit"
path = "file_path"

[[tool]]
name = "mcp/file-tracker/SafeBash"
role = "run"

# Claude Code's own Bash, when `clappa`'s preload adds the same three lists to it.
[[tool]]
name = "host/claude-code/Bash"
role = "run"

[[tool]]
name = "host/opencode/read"
role = "read"
path = "path"

[[tool]]
name = "host/opencode/write"
role = "write"
path = "path"

[[tool]]
name = "host/opencode/edit"
role = "edit"
path = "path"

[[tool]]
name = "host/opencode/appa_safebash"
role = "run"

# SafeBash runs each command in Anthropic's sandbox runtime, `srt` — the
# runtime Claude Code links into its Bash tool: Seatbelt on macOS, bubblewrap
# on Linux — with a network proxy that admits only the declared hosts. Each
# call starts its own `srt` with that call's files and hosts. Where `clappa`
# confines Claude Code's own Bash per call, Claude Code's sandbox runs it.
# A command reads the system directories (/usr, /etc, /lib, ...), every
# directory on its PATH outside the home and working directories, and the
# toolchain each `bin` among them belongs to; every other
# top-level directory is hidden. `readable` reopens the toolchains below, where
# they exist: package managers and language toolchains that keep their
# programs outside the system. A deployment's `readable` adds to this list.
# Each readable path is assumed to hold no credentials: a path rule hides no
# file under it. A path may start with `~/` or with `$NAME/`, the directory
# an environment variable names.
[sandbox]
command = ["srt"]
readable = [
  "/opt/homebrew",
  "/opt/local",
  "/home/linuxbrew/.linuxbrew",
  "~/.cargo/bin",
  "$CARGO_HOME/bin",
  "~/.rustup",
  "$RUSTUP_HOME",
  "~/.local/bin",
  "~/.local/share/mise",
  "~/.config/mise",
  "~/.local/share/uv",
  "~/.local/share/pnpm",
  "~/.asdf",
  "~/.nvm",
  "~/.volta",
  "~/.bun/bin",
  "~/.deno/bin",
  "~/.pyenv",
  "~/.rbenv",
  "~/.sdkman/candidates",
  "~/go/bin",
  "~/.nix-profile",
]
timeout_secs = 600
