# The file-tracker's built-in configuration. A deployment's own
# `file-tracker.toml` adds path rules and tools to these, and replaces the
# scalar settings and the sandbox.
#
#   store = "file-tracker.json"        # default: $XDG_STATE_HOME/appa/file-tracker.json
#   settle_wait_ms = 3000              # how long a call on a reserved file waits
#   reservation_timeout_secs = 300     # when an annotated, never-released call lets go
#
# A path rule labels every file whose absolute, resolved path its pattern
# matches (`*` matches any run of characters, `/` included). The label holds
# before any recorded write and under every later one: a read returns the
# meet of the recorded label and every matching rule. `write_trust` and
# `write_attention` are what a call that writes such a file requires.

# --- the requester's credentials are `self` data, and only a trusted session writes them ---
[[path]]
pattern = "*/.env*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.ssh/*"
audience = ["self"]
write_trust = "trusted"

[[path]]
pattern = "*/.aws/*"
audience = ["self"]
write_trust = "trusted"

[[path]]
