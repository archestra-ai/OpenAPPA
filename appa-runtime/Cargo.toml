[package]
name = "appa"
version.workspace = true
edition.workspace = true
publish = false
autobins = false

[lib]
name = "appa_runtime"

[[bin]]
name = "appa"
path = "src/bin/appa.rs"

[dependencies]
appa-adapter-claude-code = { path = "../appa-adapter-claude-code" }
appa-adapter-kagent = { path = "../appa-adapter-kagent" }
# The builtin-module ABI: one source of truth for the descriptor,
# statuses, and version shared with deployer modules.
appa-builtin = { path = "../appa-builtin" }
appa-engine = { workspace = true }
appa-eventlog = { workspace = true }
appa-policy = { workspace = true }
appa-runtime-api = { path = "../appa-runtime-api" }
# `query` decodes the statusline's one GET parameter (`/status`).
axum = { workspace = true, features = ["query"] }
# One job: rendering a runtime event's wall time as RFC 3339 in a diagnostic export.
# Already in the tree through rmcp and schemars, so this adds nothing to the build.
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive", "env"] }
# `join_all` runs one evidence batch's independent consults concurrently.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
libloading = "0.9"
libc = "0.2"
hmac = "0.12"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
rand = "0.10"
reqwest = { workspace = true }
# `server` carries the tool macros' schema derive; `transport-streamable-http-server`
# is the HTTP transport Claude Code's MCP client speaks.
rmcp = { version = "3", features = ["server", "macros", "transport-streamable-http-server", "elicitation"] }
# Must stay 1.x to match rmcp's `#[tool]` schema derive.
schemars = "1"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
tar = "0.4"
tempfile = "3"
tokio = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
# The report id: a v4 UUID the receiver stores one object under.
uuid = { version = "1", features = ["v4"] }
# Not rig-core's `rustls` feature: it pins reqwest to aws-lc-rs, which would put a
# second crypto provider beside the workspace's ring. TLS still comes from reqwest.
rig-core = { version = "0.42", default-features = false, features = ["reqwest"] }
rig-agent = { version = "0.42", default-features = false }
# Depended on only to name the crypto provider; see the workspace manifest.
rustls = { workspace = true }

[build-dependencies]
sha2 = { workspace = true }
tar = "0.4"

[dev-dependencies]
# The fail points the orchestration tests drive. A dev-dependency, so they are
# absent from the binary.
appa-eventlog = { workspace = true, features = ["fault-injection"] }
# `start_paused`: a test that must exhaust a retry table should not spend the
# table's backoff in real seconds.
tokio = { workspace = true, features = ["test-util"] }
jsonschema = { version = "0.53.0", default-features = false }
# The elicitation round trip is only real with a real client on the
# other end: these features exist for `tests/hitl_elicitation.rs` and
# never ship in the binary.
rmcp = { version = "3", features = ["client", "transport-streamable-http-client-reqwest"] }

[lints]
workspace = true
