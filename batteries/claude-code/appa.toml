# Optional Claude Code rules for Bash and Read.

[policy]
version = 1

# Classify each command before dispatch: both the labels on its output and the
# trust and audience the command may receive.
[[policy.dynamic_resolver]]
name = "claude-code.bash-requirements"
builtin = "claude-code"
returns = ["delta.trust", "delta.audience", "requires.trust", "requires.audience", "requires.attention"]

[[policy.tool]]
name = "Bash"
description = "Runs one shell command and returns its output."
uses = [{ resolver = "claude-code.bash-requirements" }]

# Classify only who may receive the returned file content. Read adds no trust
# restriction and the resolver does not block the read itself.
[[policy.dynamic_resolver]]
name = "claude-code.read-sensitivity"
returns = ["delta.audience"]

[[policy.tool]]
name = "Read"
description = "Reads a file and returns its contents."
uses = [{ resolver = "claude-code.read-sensitivity" }]
delta = {}

# Every tool this policy does not name — an MCP server's tools, for one — is
# not refused for being unnamed: the model reads the call as written and
# answers the trust, audience, and review marks it requires, and the session's
# label decides the call like any declared tool's. A requirement is a floor
# against the session: a fresh session meets any floor, and the answer gains
# force as the session absorbs suspicious or private content. Review marks are
# the root policy's vocabulary — a root registering `hitl` lets the model
# demand a person's sign-off.
[[policy.cast]]
name = "claude-code.undeclared-tool"
resolver = { may_cast = { trust = ["suspicious", "trusted"], audience = ["public"] } }

[externals.dynamic."claude-code.read-sensitivity"]
command = ["python3", "./read-sensitivity.py"]

[externals.casts."claude-code.undeclared-tool"]
builtin = "claude-code"
