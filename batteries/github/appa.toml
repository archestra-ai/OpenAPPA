[[policy.tool]]
name = "mcp/github/search_issues"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "mcp/github/issue_read"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "mcp/github/get_label"
delta = { trust = "suspicious" }

[[policy.tool]]
