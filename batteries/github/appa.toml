# GitHub battery: the GitHub MCP server's default toolsets.
#
# The default assumes public repositories. Issue, pull-request, and file
# text is written by whoever pushed it, so every read enters at the low
# rank of the trust chain, like a fetched web page. Every write publishes
# to a place anyone can read, so it needs trusted data that may be seen
# by everyone (audience contains `public`).
#
# For a private repository, add root rules that name it; root rules run
# first. Its reads become private, and its writes accept private data.
# A rule names one tool and matches one argument, so add one rule per
# tool you use against that repository — here the issue tools:
#
#   [[policy.tool]]
#   name = "mcp__github__issue_read(repo:my-private-repo)"
#   delta = { trust = "suspicious", audience = ["private"] }
#
#   [[policy.tool]]
#   name = "mcp__github__issue_write(repo:my-private-repo)"
#   delta = {}
#
#   [policy.tool.requires]
#   trust = "trusted"
#   audience = { contains = ["private"] }
#   #
# To cover a whole organisation instead, match `owner:my-org`.

[policy]
version = 2

# --- who am I: no outside content, nothing sent ---

[[policy.tool]]
name = "mcp__github__get_me"
delta = {}

[[policy.tool]]
name = "mcp__github__get_teams"
delta = {}

[[policy.tool]]
name = "mcp__github__get_team_members"
delta = {}

[[policy.tool]]
name = "mcp__github__search_users"
delta = {}

