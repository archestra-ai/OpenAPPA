# Grain battery: meeting recordings, notes, deals, and workspace admin.
#
# What a meeting tool returns was said by the people in the meeting,
# including outside participants, so it is untrusted and stays with the
# readers who may see Grain data (`private`). Writes that stay in
# the workspace need only that the data going in is Grain data. Sharing a
# collection with anyone who has the link, inviting people, and changing
# seats, teams, or settings need a person. The root config supplies the
# `hitl` authority.

[policy]
version = 1

# --- meeting content: private to Grain readers ---

[[policy.tool]]
name = "mcp__claude_ai_Grain__list_meetings"

[policy.tool.delta]
audience = ["private"]

[[policy.tool]]
name = "mcp__claude_ai_Grain__list_attended_meetings"

[policy.tool.delta]
audience = ["private"]

