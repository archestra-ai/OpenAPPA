version = 1
trust_chain = ["suspicious", "internal"]

[boundary]
trust = "internal"
audience = { exactly = ["public"] }

[[preamble]]
role = "system"
content = """
You are a corporate assistant. Use the available tools to complete the user's
request. Read what you need, then act. When you are done, briefly summarise
what you did.
"""

[[tool]]
name = "search_hr"
parameters = { type = "object", properties = { query = { type = "string", description = "Keyword or phrase to match against file names and contents." } }, required = ["query"], additionalProperties = false }
delta = { audience = { exactly = ["hr"] } }

[[tool]]
name = "read_hr"
parameters = { type = "object", properties = { file = { type = "string", description = "The exact file name to read." } }, required = ["file"], additionalProperties = false }
delta = { audience = { exactly = ["hr"] } }
output_sanitizer = "pii-redactor"

[[tool]]
name = "create_hr"
parameters = { type = "object", properties = { file = { type = "string", description = "The file name to create." }, content = { type = "string", description = "The full contents to write." } }, required = ["file", "content"], additionalProperties = false }
delta = {}

[[tool]]
name = "send_email"
parameters = { type = "object", properties = { to = { type = "string", description = "Recipient email address." }, subject = { type = "string", description = "Subject line." }, body = { type = "string", description = "Message body." } }, required = ["to", "subject", "body"], additionalProperties = false }
requires = { trust = "internal", audience = { includes = ["$to"] } }
effects = ["egress"]
delta = {}

[[sanitizer]]
name = "pii-redactor"
on = ["tool_output"]
implementation = { builtin = "redact-numbers" }
can_reduce = { audience = { from = { includes = ["hr"] }, to = { exactly = ["public"] } } }
