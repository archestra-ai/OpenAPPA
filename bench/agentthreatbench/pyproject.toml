[project]
name = "appa-agentthreatbench"
version = "0.1.0"
description = "Inspect AgentThreatBench harness for OpenAPPA"
requires-python = ">=3.12,<3.14"
dependencies = [
    "agent-framework-core==1.13.0",
    "anthropic==0.115.0",
    "appa-agent-python==0.1.0",
    "claude-agent-sdk==0.2.152",
    "inspect-ai==0.3.252",
    "inspect-evals @ git+https://github.com/UKGovernmentBEIS/inspect_evals.git@0c737b01627b772db84aa223f68775c31199fdc9",
    "openai==2.54.0",
]

[project.scripts]
appa-agentthreatbench = "appa_agentthreatbench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appa_agentthreatbench"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
appa-agent-python = { path = "../../appa-agent-python" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
