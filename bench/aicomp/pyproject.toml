[project]
name = "appa-aicomp"
version = "0.1.0"
description = "Kaggle AI Agent Security (aicomp_sdk) attacks replayed against OpenAPPA"
requires-python = ">=3.12,<3.14"
dependencies = [
    "appa-agent-python",
    "aicomp-sdk==3.1.2",
    "openai>=1.60",
    "pyyaml>=6",
]

[project.scripts]
appa-aicomp = "appa_aicomp.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appa_aicomp"]

[tool.uv.sources]
appa-agent-python = { path = "../../appa-agent-python", editable = true }
