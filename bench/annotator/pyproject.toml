[project]
name = "appa-bench-annotator"
version = "0.1.0"
description = "Measure an OpenAPPA Annotator: mine tool calls, ask them through appa runtime annotate, score the answers"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
annotator-mine = "appa_bench_annotator.mine:main"
annotator-score = "appa_bench_annotator.score:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appa_bench_annotator"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
