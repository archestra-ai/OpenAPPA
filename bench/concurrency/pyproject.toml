[project]
name = "appa-bench-concurrency"
version = "0.1.0"
description = "Live adaptive concurrency for OpenAPPA benchmark harnesses"
requires-python = ">=3.11"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appa_bench_concurrency"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
