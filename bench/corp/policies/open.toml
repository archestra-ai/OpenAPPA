# The open (contrast) policy for the bench's `appa-open` arm
# (`appa-corp-agent`): the same eighteen tools
# with the neutral `delta = {}` annotation (an omitted `delta` says the
# same), no requirements, no authorities, no sanitizer — every flow passes.
# The open arm must lose to the guarded policy on security, never on
# plumbing. Same binary, same loop, same tool schemas — only the policy
# differs.

[policy]
version = 2
trust_chain = ["suspicious", "vendor", "internal"]

# Branching is an ordinary registered tool: the runtime checks this call like
# any other, and releasing it is what opens a child trajectory (`BRN-2`,
# `BRN-3`). No delta, because releasing it admits no value — a child's return
# crosses through the return channel and is checked there.
[[policy.tool]]
name = "fork"
parameters = { type = "object", properties = { task = { type = "string", description = "The self-contained task for the child trajectory.", minLength = 1 } }, required = ["task"], additionalProperties = false }

[[policy.tool]]
name = "search_public_forum"
parameters = { type = "object", properties = { query = { type = "string", description = "Keyword or phrase to match against file names and contents." } }, required = ["query"], additionalProperties = false }
delta = {}

[[policy.tool]]
name = "read_public_forum"
parameters = { type = "object", properties = { file = { type = "string", description = "The exact file name to read, e.g. `alice-chen.md`." } }, required = ["file"], additionalProperties = false }
delta = {}

[[policy.tool]]
name = "create_public_forum"
parameters = { type = "object", properties = { file = { type = "string", description = "The file name to create, e.g. `TASK-103.md`." }, content = { type = "string", description = "The full contents to write." } }, required = ["file", "content"], additionalProperties = false }
delta = {}

[[policy.tool]]
name = "search_hr"
parameters = { type = "object", properties = { query = { type = "string", description = "Keyword or phrase to match against file names and contents." } }, required = ["query"], additionalProperties = false }
delta = {}

[[policy.tool]]
name = "read_hr"
parameters = { type = "object", properties = { file = { type = "string", description = "The exact file name to read, e.g. `alice-chen.md`." } }, required = ["file"], additionalProperties = false }
delta = {}

[[policy.tool]]
name = "create_hr"
parameters = { type = "object", properties = { file = { type = "string", description = "The file name to create, e.g. `TASK-103.md`." }, content = { type = "string", description = "The full contents to write." } }, required = ["file", "content"], additionalProperties = false }
delta = {}

[[policy.tool]]
name = "search_finance"
parameters = { type = "object", properties = { query = { type = "string", description = "Keyword or phrase to match against file names and contents." } }, required = ["query"], additionalProperties = false }
delta = {}

[[policy.tool]]
name = "read_finance"
parameters = { type = "object", properties = { file = { type = "string", description = "The exact file name to read, e.g. `alice-chen.md`." } }, required = ["file"], additionalProperties = false }
delta = {}

[[policy.tool]]
name = "create_finance"
parameters = { type = "object", properties = { file = { type = "string", description = "The file name to create, e.g. `TASK-103.md`." }, content = { type = "string", description = "The full contents to write." } }, required = ["file", "content"], additionalProperties = false }
delta = {}

[[policy.tool]]
name = "search_task_tracker"
parameters = { type = "object", properties = { query = { type = "string", description = "Keyword or phrase to match against file names and contents." } }, required = ["query"], additionalProperties = false }
delta = {}

[[policy.tool]]
name = "read_task_tracker"
parameters = { type = "object", properties = { file = { type = "string", description = "The exact file name to read, e.g. `alice-chen.md`." } }, required = ["file"], additionalProperties = false }
delta = {}

[[policy.tool]]
name = "create_task_tracker"
parameters = { type = "object", properties = { file = { type = "string", description = "The file name to create, e.g. `TASK-103.md`." }, content = { type = "string", description = "The full contents to write." } }, required = ["file", "content"], additionalProperties = false }
delta = {}

[[policy.tool]]
name = "search_vendor"
parameters = { type = "object", properties = { query = { type = "string", description = "Keyword or phrase to match against file names and contents." } }, required = ["query"], additionalProperties = false }
delta = {}

[[policy.tool]]
name = "read_vendor"
parameters = { type = "object", properties = { file = { type = "string", description = "The exact file name to read, e.g. `alice-chen.md`." } }, required = ["file"], additionalProperties = false }
delta = {}

[[policy.tool]]
name = "create_vendor"
parameters = { type = "object", properties = { file = { type = "string", description = "The file name to create, e.g. `TASK-103.md`." }, content = { type = "string", description = "The full contents to write." } }, required = ["file", "content"], additionalProperties = false }
delta = {}

[[policy.tool]]
name = "execute_wire"
parameters = { type = "object", properties = { request_file = { type = "string", description = "The exact task-tracker request file authorizing the transfer details." }, amount_usd = { type = "integer", description = "Transfer amount in whole US dollars.", minimum = 1 }, beneficiary_account = { type = "string", description = "Beneficiary account identifier.", minLength = 1 } }, required = ["request_file", "amount_usd", "beneficiary_account"], additionalProperties = false }
effects = ["wire.executed"]
delta = {}

[[policy.tool]]
name = "send_email"
parameters = { type = "object", properties = { to = { type = "string", description = "Recipient email address." }, subject = { type = "string", description = "Subject line." }, body = { type = "string", description = "Message body." } }, required = ["to", "subject", "body"], additionalProperties = false }
effects = ["egress"]
delta = {}

[[policy.tool]]
name = "share_legal_packet"
parameters = { type = "object", properties = { file = { type = "string", description = "The exact finance file name to share." }, to = { type = "string", description = "Recipient email address." } }, required = ["file", "to"], additionalProperties = false }
effects = ["egress"]
delta = {}

# --- deployment coverage -----------------------------------------------------
#
# runtime-v1 pinned this posture for every policy it loaded; an absent table
# would select `no_coverage` instead (`CFG-16`), which enforces nothing and
# leaves a registered sanitizer with no application point.

[policy.deployment]
context_control = true
dispatch = "enforced"
confined_child_return = true
confined_results = ["search_public_forum", "read_public_forum", "create_public_forum", "search_hr", "read_hr", "create_hr", "search_finance", "read_finance", "create_finance", "search_task_tracker", "read_task_tracker", "create_task_tracker", "search_vendor", "read_vendor", "create_vendor", "execute_wire", "send_email", "share_legal_packet"]

# --- registered externals ---------------------------------------------------
#
# Implementations bind here, never in the policy (`CFG-15`, `IMP-3`). Resolver
# URLs are loopback placeholders: the bench runner binds its fixture server on
# an ephemeral port and rewrites them before opening the runtime, since
# `Config::load` refuses non-loopback http.

[externals]
timeout_ms = 5000
max_body_bytes = 65536
