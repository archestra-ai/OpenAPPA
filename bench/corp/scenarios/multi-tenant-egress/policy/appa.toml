[policy]
version = 1
trust_chain = ["suspicious", "internal"]
[policy.boundary]
trust = "internal"
audience = ["public"]
[[policy.dynamic_resolver]]
name = "tenant-record-readers"
inputs = ["subject"]
returns = ["delta.audience"]
[[policy.dynamic_resolver]]
name = "tenant-record-write-readers"
inputs = ["subject"]
returns = ["requires.audience"]
[[policy.dynamic_resolver]]
name = "mailbox-tenant-readers"
inputs = ["subject"]
returns = ["requires.audience"]

# Branching is an ordinary registered tool: the runtime checks this call like
# any other, and releasing it is what opens a child trajectory (`BRN-2`,
# `BRN-3`). No delta, because releasing it admits no value — a child's return
# crosses through the return channel and is checked there.
[[policy.tool]]
name = "fork"
parameters = { type = "object", properties = { task = { type = "string", description = "The self-contained task for the child trajectory.", minLength = 1 } }, required = ["task"], additionalProperties = false }

[[policy.tool]]
name = "search_vendor"
parameters = { type = "object", properties = { query = { type = "string" } }, required = ["query"], additionalProperties = false }
delta = { audience = ["Client_Alpha"] }
[[policy.tool]]
name = "read_vendor"
parameters = { type = "object", properties = { file = { type = "string" } }, required = ["file"], additionalProperties = false }
uses = [{ resolver = "tenant-record-readers", inputs = { subject = "$tool_call.arguments.file" } }]
[[policy.tool]]
name = "create_vendor"
parameters = { type = "object", properties = { file = { type = "string" }, content = { type = "string" } }, required = ["file", "content"], additionalProperties = false }
requires = { trust = "internal" }
uses = [{ resolver = "tenant-record-write-readers", inputs = { subject = "$tool_call.arguments.file" } }]
delta = {}
[[policy.tool]]
name = "send_email"
parameters = { type = "object", properties = { to = { type = "string" }, subject = { type = "string" }, body = { type = "string" } }, required = ["to", "subject", "body"], additionalProperties = false }
uses = [{ resolver = "mailbox-tenant-readers", inputs = { subject = "$tool_call.arguments.to" } }]
effects = ["egress"]
delta = {}

# --- deployment coverage -----------------------------------------------------
#
# runtime-v1 pinned this posture for every policy it loaded; an absent table
# would select `no_coverage` instead (`CFG-16`), which enforces nothing and
# leaves a registered sanitizer with no application point.

[policy.deployment]
context_control = true
dispatch = "enforced"
confined_child_return = true
confined_results = ["search_vendor", "read_vendor", "create_vendor", "send_email"]

# --- registered externals ---------------------------------------------------
#
# Each resolver has a named HTTP implementation. These URLs are loopback placeholders: the bench runner binds its fixture server on
# an ephemeral port and rewrites them before opening the runtime, since
# `Config::load` refuses non-loopback http.

[externals]
timeout_ms = 5000
max_body_bytes = 65536

[externals.dynamic.tenant-record-readers]
url = "http://127.0.0.1:0/dynamic-resolver"

[externals.dynamic.tenant-record-write-readers]
url = "http://127.0.0.1:0/dynamic-resolver"

[externals.dynamic.mailbox-tenant-readers]
url = "http://127.0.0.1:0/dynamic-resolver"
