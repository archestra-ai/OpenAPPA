[policy]
version = 1
trust_chain = ["suspicious", "internal"]

[policy.boundary]
trust = "internal"
audience = ["public"]

# The benchmark runner replaces each non-routable URL with an isolated
# loopback fixture for each episode. Every annotator produces its tool's
# complete contract per call; `audiences` closes each mandate to the finance
# readers an annotation may name.
[[policy.annotator]]
name = "document-acl"
inputs = { subject = "$tool_call.arguments.file" }
audiences = ["cfo@northwind.example", "legal-lead@northwind.example", "controller@northwind.example"]

[[policy.annotator]]
name = "document-search-acl"
inputs = { subject = "$tool_call.arguments.query" }
audiences = ["cfo@northwind.example", "legal-lead@northwind.example", "controller@northwind.example"]

[[policy.annotator]]
name = "document-write-acl"
inputs = { subject = "$tool_call.arguments.file" }
audiences = ["cfo@northwind.example", "legal-lead@northwind.example", "controller@northwind.example"]

[[policy.annotator]]
name = "distribution-list-members"
inputs = { subject = "$tool_call.arguments.to" }
audiences = ["cfo@northwind.example", "legal-lead@northwind.example", "controller@northwind.example"]
effects = ["egress"]

[[policy.annotator]]
name = "packet-share-acl"
inputs = { file = "$tool_call.arguments.file", to = "$tool_call.arguments.to" }
audiences = ["cfo@northwind.example", "legal-lead@northwind.example", "controller@northwind.example"]
effects = ["egress"]

# Branching is an ordinary registered tool: the runtime checks this call like
# any other, and releasing it is what opens a child trajectory (`BRN-2`,
# `BRN-3`). No delta, because releasing it admits no value — a child's return
# crosses through the return channel and is checked there.
[[policy.tool]]
name = "fork"
parameters = { type = "object", properties = { task = { type = "string", description = "The self-contained task for the child trajectory.", minLength = 1 } }, required = ["task"], additionalProperties = false }

[[policy.tool]]
name = "search_finance"
parameters = { type = "object", properties = { query = { type = "string", description = "Keyword or phrase to match against file names and contents." } }, required = ["query"], additionalProperties = false }
annotator = "document-search-acl"

[[policy.tool]]
name = "read_finance"
parameters = { type = "object", properties = { file = { type = "string", description = "The exact file name to read." } }, required = ["file"], additionalProperties = false }
annotator = "document-acl"

[[policy.tool]]
name = "create_finance"
parameters = { type = "object", properties = { file = { type = "string", description = "The file name to create." }, content = { type = "string", description = "The full contents to write." } }, required = ["file", "content"], additionalProperties = false }
annotator = "document-write-acl"

[[policy.tool]]
name = "send_email"
parameters = { type = "object", properties = { to = { type = "string", description = "Recipient email address." }, subject = { type = "string", description = "Subject line." }, body = { type = "string", description = "Message body." } }, required = ["to", "subject", "body"], additionalProperties = false }
annotator = "distribution-list-members"

# This composite is annotated on both arguments before dispatch: `file`
# supplies the output audience and `to` supplies the reader set the inputs'
# audience must cover.
[[policy.tool]]
name = "share_legal_packet"
parameters = { type = "object", properties = { file = { type = "string", description = "The exact finance file name to share." }, to = { type = "string", description = "Recipient distribution list." } }, required = ["file", "to"], additionalProperties = false }
annotator = "packet-share-acl"

# --- deployment coverage -----------------------------------------------------
#
# runtime-v1 pinned this posture for every policy it loaded; an absent table
# would select `no_coverage` instead (`CFG-16`), which enforces nothing and
# leaves a registered sanitizer with no application point.

[policy.deployment]
context_control = true
dispatch = "enforced"
confined_child_return = true
confined_results = ["search_finance", "read_finance", "create_finance", "send_email", "share_legal_packet"]

# --- registered externals ---------------------------------------------------
#
# Each annotator has a named HTTP implementation. These URLs are loopback placeholders: the bench runner binds its fixture server on
# an ephemeral port and rewrites them before opening the runtime, since
# `Config::load` refuses non-loopback http.

[externals]
timeout_ms = 5000
max_body_bytes = 65536

[externals.annotators.document-acl]
url = "http://127.0.0.1:0/annotator"

[externals.annotators.document-search-acl]
url = "http://127.0.0.1:0/annotator"

[externals.annotators.document-write-acl]
url = "http://127.0.0.1:0/annotator"

[externals.annotators.distribution-list-members]
url = "http://127.0.0.1:0/annotator"

[externals.annotators.packet-share-acl]
url = "http://127.0.0.1:0/annotator"
