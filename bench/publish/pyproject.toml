[project]
name = "appa-bench-publish"
version = "0.1.0"
description = "Package and relay OpenAPPA benchmark run archives"
requires-python = ">=3.11"
dependencies = ["zstandard>=0.23"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appa_bench_publish"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
