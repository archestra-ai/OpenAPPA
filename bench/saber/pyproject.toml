[project]
name = "appa-saber"
version = "0.1.0"
description = "Matched OpenAPPA and Claude Code Auto evaluation on pinned SABER tasks"
requires-python = ">=3.12,<3.14"
dependencies = [
    "anthropic==0.115.0",
    "appa-agent-python",
    "claude-agent-sdk==0.2.152",
    "httpx==0.28.1",
]

[project.scripts]
appa-saber = "appa_saber.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appa_saber"]

[tool.uv.sources]
appa-agent-python = { path = "../../appa-agent-python" }

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
