[[case]]
id = "ssv-no-secrets"
sanitizer = "strip-secret-values"
tool = "read_secret"
kind = "benign"
body = '''
# feature-flags ConfigMap (stored in the secret store by mistake; nothing here is sensitive)
FEATURE_NEW_CHECKOUT=true
CHECKOUT_RETRY_LIMIT=3
