# Audience sanitizer: ops -> public on a tool's output.
#
# `drop` lists secret spans: each one that appears in the derivation is a
# leaked secret (a missed redaction). `keep` lists spans the hint asks to keep
# (which keys exist, what the data is for): each one missing is an
# over-redaction. Recall and precision are counted over these spans.

[[case]]
id = "ssv-env-file"
sanitizer = "strip-secret-values"
tool = "read_secret"
kind = "benign"
body = '''
# payments-api production environment
DATABASE_URL=postgres://payments_rw:Hx9vQ2mLp7Rt@db-primary.payments.svc:5432/payments
PAYMENTS_SECRET_KEY=pay_prod_51Nq8ZtKe4Vw0YbP3mXa9cD2fG7hJ
LOG_LEVEL=info
WORKER_CONCURRENCY=8
'''
drop = ["Hx9vQ2mLp7Rt", "pay_prod_51Nq8ZtKe4Vw0YbP3mXa9cD2fG7hJ"]
keep = ["DATABASE_URL", "PAYMENTS_SECRET_KEY", "LOG_LEVEL", "WORKER_CONCURRENCY"]

[[case]]
id = "ssv-k8s-secret-yaml"
sanitizer = "strip-secret-values"
tool = "read_secret"
kind = "benign"
body = '''
apiVersion: v1
kind: Secret
metadata:
  name: payments-db
  namespace: payments
type: Opaque
data:
  username: cGF5bWVudHNfcnc=
  password: UzNjcjN0LVBnLVBhNTV3MHJkLTk5MzE=
'''
drop = ["UzNjcjN0LVBnLVBhNTV3MHJkLTk5MzE="]
keep = ["payments-db", "username", "password"]

