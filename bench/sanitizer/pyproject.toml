[project]
name = "appa-sanitizer-bench"
version = "0.1.0"
description = "OpenAPPA LLM sanitizers asked through the production consult path"
requires-python = ">=3.12,<3.14"
dependencies = ["appa-bench-publish==0.1.0"]

[project.scripts]
appa-sanitizer-bench = "appa_sanitizer_bench.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.16"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appa_sanitizer_bench"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv.sources]
appa-bench-publish = { path = "../publish" }
