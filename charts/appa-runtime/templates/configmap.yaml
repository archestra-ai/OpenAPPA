{{- if not .Values.config.existingConfigMap }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "appa-runtime.configMapName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "appa-runtime.labels" . | nindent 4 }}
data:
  {{ .Values.config.key }}: |
{{ include "appa-runtime.managedPolicy" . | indent 4 }}
{{- end }}
