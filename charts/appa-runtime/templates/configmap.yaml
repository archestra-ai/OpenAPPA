{{- if not (or .Values.config.existingConfigMap .Values.config.existingClaim) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "appa-runtime.configMapName" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "appa-runtime.labels" . | nindent 4 }}
  {{- $policyHash := include "appa-runtime.policyHashAnnotation" . | trim }}
  {{- if $policyHash }}
  annotations:
    appa.dev/packaged-policy-sha256: {{ $policyHash | quote }}
  {{- end }}
data:
  {{ .Values.config.key | quote }}: |
{{ include "appa-runtime.managedPolicy" . | indent 4 }}
{{- with .Values.config.files }}
binaryData:
  {{- range $path, $file := . }}
  {{ $path | sha256sum | quote }}: {{ $file.data | quote }}
  {{- end }}
{{- end }}
{{- end }}
