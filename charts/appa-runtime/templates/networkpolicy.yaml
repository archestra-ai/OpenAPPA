{{- if .Values.networkPolicy.enabled }}
{{- if not .Values.networkPolicy.ingress }}
{{- fail "networkPolicy.ingress must name at least one peer when networkPolicy.enabled is true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "appa-runtime.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "appa-runtime.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "appa-runtime.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.ingress | nindent 8 }}
      ports:
        - protocol: TCP
          port: relay
    # Keep the chart's own connection test usable. This peer is limited
    # to pods carrying this release's Helm identity in the same namespace.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: {{ include "appa-runtime.name" . }}
              app.kubernetes.io/instance: {{ .Release.Name | quote }}
      ports:
        - protocol: TCP
          port: relay
{{- end }}
