apiVersion: v1
kind: Service
metadata:
  name: {{ include "appa-runtime.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "appa-runtime.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "appa-runtime.selectorLabels" . | nindent 4 }}
  ports:
    - name: runtime
      port: {{ .Values.service.port }}
      targetPort: runtime
      protocol: TCP
    {{- if .Values.appaGuide.enabled }}
    - name: guide-mcp
      port: {{ .Values.service.guidePort | default 18788 }}
      targetPort: guide-mcp
      protocol: TCP
    {{- end }}
