apiVersion: v1
kind: Service
metadata:
  name: {{ include "appa-runtime.fullname" . }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "appa-runtime.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "appa-runtime.selectorLabels" . | nindent 4 }}
  ports:
    - name: relay
      port: {{ .Values.service.port }}
      targetPort: relay
      protocol: TCP
