# Shared OpenAPPA runtime. One replica: the trajectory log is SQLite.

image:
  repository: europe-west1-docker.pkg.dev/friendly-path-465518-r6/appa-public/appa-runtime
  # Empty uses v<appVersion>.
  tag: ""
  pullPolicy: IfNotPresent
  digest: ""

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -v for the decision path at debug, -vv for the algebra at trace.
verbosity: ""

serviceAccount:
  create: true
  automount: false
  annotations: {}
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

service:
  type: ClusterIP
  port: 18787

# Enable this policy with at least one NetworkPolicyPeer to restrict which
# pods can reach the runtime Service.
networkPolicy:
  enabled: false
  ingress: []

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    memory: 512Mi

nodeSelector: {}
tolerations: []
affinity: {}

# Policy ConfigMap mounted at /etc/appa. Empty contents use the packaged
# appa-guide bootstrap policy. Set existingConfigMap to use a ConfigMap you manage.
config:
  existingConfigMap: ""
  key: appa.toml
  contents: ""

# Trajectory log and a writable batteries overlay. Off uses emptyDir.
# The skill refreshes the shared runtime's release battery layer only when this is on.
persistence:
  enabled: false
  storageClass: ""
  size: 8Gi
  accessMode: ReadWriteOnce
  existingClaim: ""
  # Keep the claim when the release is uninstalled.
  keep: true

# Extra environment for battery audience sources (APPA_PROVIDER_*).
env: {}
envFrom: []

# Optionally install the configuring kagent Agent with this runtime.
appaGuide:
  enabled: false
  name: appa-guide
  namespace: kagent
  modelConfig: default-model-config
  toolServer:
    name: kagent-tool-server
  skill:
    url: https://github.com/archestra-ai/OpenAPPA
    # Empty pins the skill to v<chart appVersion>.
    ref: ""
    path: integrations/appa-guide

test:
  image:
    repository: busybox
    tag: "1.37"
    digest: sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
    pullPolicy: IfNotPresent
