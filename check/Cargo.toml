[package]
name = "appa-check"
version = "0.1.0"
edition = "2024"
publish = false
description = "Stateless JSON policy check over appa-core: replay an episode, check one proposed tool call"

[dependencies]
appa-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints]
workspace = true
