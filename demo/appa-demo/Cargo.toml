[package]
name = "appa-demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "The chat-playground service: multi-turn sessions over the appa-agent loop, corp tools in-process, one SSE stream per turn"

# Standalone on purpose, like the sibling demo crates — out of the root
# workspace so the demo deps stay out of the workspace build.
[workspace]

[dependencies]
appa-runtime = { path = "../../appa-runtime" }
appa-engine = { path = "../../appa-engine" }
appa-agent = { path = "../../appa-agent" }
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }
tokio-util = "0.7"
tokio-stream = "0.1"
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
thiserror = "2"
# Unguessable session ids.
getrandom = "0.3"

[[bin]]
name = "appa-demo"
path = "src/main.rs"
