version = 1
trust_chain = ["suspicious", "trusted"]

# User turns enter at trusted with a public audience.
[boundary]
trust = "trusted"
audience = { exactly = ["public"] }

# --- CRM: customer records are confidential ---------------------------

[[tool]]
name  = "list_customers"
delta = { audience = { exactly = ["internal"] } }

[[tool]]
name  = "create_customer_data"
delta = {}

# --- GitHub: anyone can write an issue, so reading one is untrusted ---

[[tool]]
name  = "list_issues"
delta = { trust = "suspicious" }

# Filing an issue publishes to the open web: the flow must still be
# readable by everyone, and not derived from an untrusted source.
[[tool]]
name     = "create_issue"
requires = { trust = "trusted", audience = { includes = ["public"] } }
delta    = {}

# --- Email: a message leaves the org ----------------------------------

# The recipient can be anyone, so sending is publishing: still readable
# by everyone, not derived from an untrusted source.
[[tool]]
name     = "send_email"
requires = { trust = "trusted", audience = { includes = ["public"] } }
delta    = {}

# --- Finance: the books are confidential; moving money needs a human ---

[[tool]]
name  = "list_invoices"
delta = { audience = { exactly = ["internal"] } }

# Every transfer demands a human sign-off (an attention mark): the
# treasurer must rule on the exact call before it may dispatch.
[[tool]]
name     = "make_transfer"
requires = { trust = "trusted", attention = ["human-approval"] }
delta    = {}

# --- Meetings: what people said in a room stays in the room -----------

[[tool]]
name  = "list_recordings"
delta = { audience = { exactly = ["internal"] } }

[[authority]]
name = "treasurer"
hint = "That's you. Every transfer stops here until you approve it in the chat."

[authority.mandate]
attends = ["human-approval"]

# `hitl` is human elicitation — in this playground, the human is you: a
# transfer pauses until you approve or deny it in the chat. No answer
# within the window fails closed, and no transfer runs.
[authority.implementation]
builtin = "hitl"

# --- Sanitizers: a third way past a narrowing -------------------------
#
# A sanitizer is offered as a remedy plan wherever its transition applies.
# Take one and the raw result is withheld from the assistant: only the
# derivation is admitted, so the session keeps the label the raw would
# have cost it.
#
# `hosted` means this harness produces the derivation. Here it runs your
# own model, and the `hint` below is the instruction it runs under — so
# the hint is both what the assistant reads when choosing a plan and what
# the transform actually does. Edit it and the derivation changes.
# Nothing checks that the output honours it: registering a
# sanitizer is a trust decision you are making.

[[sanitizer]]
name = "strip-customer-data"
on   = ["tool_output"]
hint = "Summarise the records, removing every customer identity: company names, people's names, email addresses, and anything else naming who the customer is — identifiers such as recording or file names included. Keep the substance of what was said or owed."

[sanitizer.mandate]
audience = { from = { includes = ["internal"] }, to = { exactly = ["public"] } }

[sanitizer.implementation]
builtin = "hosted"
