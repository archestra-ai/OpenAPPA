[package]
name = "corporate-agent-demo"
version = "0.1.0"
edition = "2024"
publish = false
description = "A corporate assistant agent on the full appa-agent loop over mock internal systems, used to exercise OpenAPPA"
autobins = false

# Standalone on purpose, like the sibling OpenAPPA crates — and deliberately out
# of the root workspace, to keep the heavy demo deps (the LLM client) out of the
# workspace build. Test it separately from the root `cargo test --workspace`.
[workspace]

[dependencies]
appa-runtime = { path = "../../appa-runtime" }
appa-engine = { path = "../../appa-engine" }
# The full agent loop (fork/submit_result) behind the `appa-corp-agent` binary.
appa-agent = { path = "../../appa-agent" }
# The corp systems' semantics, executed in-process by `appa-corp-agent` — the
# same code the sibling MCP server wraps, so this agent and the FIDES demo act
# on identical systems.
corp-systems = { path = "../corp-systems" }
# The loopback shim `appa-corp-agent` serves its policy tools on (the runtime's
# tool backends are a closed set: builtin fixtures or HTTP).
axum = { version = "0.8", default-features = false, features = ["json", "tokio", "http1"] }
tokio-util = "0.7"
# Explicit features (not left to unification): the loop and tests need sockets
# and timeouts.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

[[bin]]
name = "appa-corp-agent"
path = "src/bin/appa_corp_agent.rs"
