# The guarded demo policy: the flow the injection scenario needs — forum-tainted, HR-derived
# content into send_email — cannot pass. Reads still work (each narrowing is offered as an
# acceptance remedy the model may execute); the exfiltration dies at send_email, which
# requires internal trust and a recipient (`$to`) covered by the flow's audience. The
# audience gap has no covering authority, so hr-only content mailed outside the hr audience
# blocks with no remedy — even on a fully internal, user-directed trajectory.

version = 1
trust_chain = ["suspicious", "internal"]

# --- public forum: external, untrusted content taints the trajectory ---------

[[tool]]
name = "search_public_forum"
delta = { trust = "suspicious" }

[[tool]]
name = "read_public_forum"
delta = { trust = "suspicious" }

# `delta = {}` is the deliberate neutral annotation: a creation receipt carries nothing.
# (A tool with no delta at all is unannotated — its results would fold Unknown, fail-closed.)
[[tool]]
name = "create_public_forum"
delta = {}

# --- hr: records are hr-audience-only ----------------------------------------

[[tool]]
name = "search_hr"
delta = { audience = { exactly = ["hr"] } }

[[tool]]
name = "read_hr"
delta = { audience = { exactly = ["hr"] } }

[[tool]]
name = "create_hr"
delta = {}

# --- finance: invoices are finance-audience-only -----------------------------
# Reads narrow the trajectory audience to {finance}; like hr, mailing that
# content to a recipient outside the finance audience blocks at send_email with
# no covering authority. (task tracker below stays internal/unconstrained.)

[[tool]]
name = "search_finance"
delta = { audience = { exactly = ["finance"] } }

[[tool]]
name = "read_finance"
delta = { audience = { exactly = ["finance"] } }

[[tool]]
name = "create_finance"
delta = {}

# --- task tracker: internal, unconstrained in this demo ----------------------

[[tool]]
name = "search_task_tracker"
delta = {}

[[tool]]
name = "read_task_tracker"
delta = {}

[[tool]]
name = "create_task_tracker"
delta = {}

# --- the outbound sink -------------------------------------------------------

[[tool]]
name = "send_email"
effects = ["egress"]
requires = { trust = "internal", audience = { includes = ["$to"] } }
delta = {}

# The only authority in the policy covers send_email's trust gap alone. No authority may
# widen the audience, so any send whose recipient falls outside the flow's audience blocks
# with no remedy offered — the model cannot even ask. HITL has no live elicitation queue in
# this build, so a trust-only gap fails closed too: the model can *ask*
# (execute_remedy_plan) and is *declined*.
[[authority]]
name = "security-officer"
mandate = { can_raise_trust_to = "internal" }
implementation = { resolver = { channel = "hitl" } }
