[package]
name = "ops-approver"
version = "0.1.0"
edition = "2024"
publish = false
description = "External approver for the kagent demo: rules on appa-proxy's pending approvals"

# Standalone on purpose, like the sibling OpenAPPA crates.
[workspace]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
serde_json = "1"
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "ansi"] }
