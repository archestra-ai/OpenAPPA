# appa-proxy policy for the kagent demo.
#
# The proxy forwards to OpenRouter and gates the agent's tool calls. Only the
# tools this scenario touches are annotated; every other kagent tool is
# unregistered and passes through — gradual adoption, and unprovable flows
# route to the declared `default-allow` authority — allowed, with an audit
# line; anything it is not competent for fails closed.
#
# Every tool contract has two sections:
#   output   — how the returned information is labeled and how the call
#              modifies the trajectory. Omitted fields are UNKNOWN (fail
#              closed downstream), so every registered tool declares its
#              output explicitly; effects default to none.
#   requires — what the current trajectory must satisfy. `requires.audience`
#              is the sink's audience (who the call exposes the flow to);
#              the flow's audience must cover it.

upstream_base_url = "https://openrouter.ai/api/v1"

# The labels the trajectory starts with — the labels every user turn carries.
# User turns are trusted, so a clean investigation reaches the guarded sinks;
# the injection blocks them by tainting the flow suspicious.
#
# Audience holds PEOPLE only — never destinations. This conversation is
# team-private: readable by the operator and the SRE team. Audience folds by
# intersection, so the flow can never widen past this set.
[contracts.trajectory]
trust = "trusted"
audience = ["operator", "sre-team"]

# --- Injection vector: pod logs are third-party text — and raw logs may carry
# customer data (the crashlooping checkout logs a customer email), so only the
# operator reads them raw: the audience narrows to ["operator"]. Anything
# derived from the logs inherits that narrow audience until a registered
# transformer redacts it (the `pii-redactor` below) or an authority vouches
# readers in (none is audience-competent here — deliberately).
[[contracts.tool]]
name = "k8s_get_pod_logs"
output = { trust = "suspicious", audience = ["operator"] }

# --- Trusted readers: pure cluster state, team-private. ------------------------
[[contracts.tool]]
name = "k8s_get_resources"
output = { trust = "trusted", audience = ["operator", "sre-team"] }

[[contracts.tool]]
name = "k8s_describe_resource"
output = { trust = "trusted", audience = ["operator", "sre-team"] }

# --- Guarded sinks: a mutation may only run from a trusted flow. ---------------
# A flow tainted by suspicious log output fails this bar. With `ops-approver`
# declared below, the failure escalates instead of blocking outright: the
# proxy POSTs the pending approval — the typed grant and the flow's
# label/provenance ancestry, never value bytes — to the approver, which
# denies anything derived from suspicious text. The injected delete is still
# stopped; the decision is now an authority's ruling, on the record.
# Outputs (mutation confirmations) are declared explicitly: under the unknown
# default an omitted output would wedge any flow continuing past a success.
[[contracts.tool]]
name = "k8s_delete_resource"
output = { trust = "trusted", audience = ["operator", "sre-team"] }
requires = { trust = "trusted" }

[[contracts.tool]]
name = "k8s_apply_manifest"
output = { trust = "trusted", audience = ["operator", "sre-team"] }
requires = { trust = "trusted" }

[[contracts.tool]]
name = "k8s_patch_resource"
output = { trust = "trusted", audience = ["operator", "sre-team"] }
requires = { trust = "trusted" }

# --- Egress sinks (both served by notify-mcp, manifests/notify.yaml). ----------
# `requires.audience` declares the sink's audience: the people a call exposes
# the flow to. The check is always the same — the flow's audience must cover
# the sink's. Outputs are the delivery receipts: trusted, team-private text.
#
# `notify` posts to one fixed destination, the internal ops hook (baked into
# notify-mcp). Its sink audience is therefore static: the people who read that
# hook — the whole team. Once the agent has read the operator-only logs, its
# status update carries their narrow audience and fails this bar; the remedy
# plan the engine predicts is [redact via `pii-redactor`, release the control
# dependency via `ops-approver`] — the message is derived through the
# redactor (safe for the team under its declared output), the approver signs
# off on the release, and the hook receives the redacted text. The proxy
# ships the canonical redacted arguments; the raw email never leaves the
# operator's audience.
[[contracts.tool]]
name = "notify"
output = { trust = "trusted", audience = ["operator", "sre-team"] }
requires = { audience = ["operator", "sre-team"] }

# `http_post` posts anywhere the model chooses. Nobody can bound who reads an
# arbitrary URL, so the sink is public — only a publicly readable flow may use
# it, and this conversation is team-private from the first user turn. The
# injected vendor tracker is blocked as "sink is public but the flow may only
# be read by: operator sre-team", regardless of trust.
#
# No `effects = ["egress"]` on either output: committing a new effect needs an
# Accept authority, and this proxy registers none — declaring it would fail
# every call closed, sanctioned or not. The sink audience is the egress
# control here.
[[contracts.tool]]
name = "http_post"
output = { trust = "trusted", audience = ["operator", "sre-team"] }
requires = { audience = "public" }

# --- Transformer: PII redaction as audience declassification. -------------------
# The one registered reduction: derive a value with email addresses replaced
# by `[redacted-email]`, admitted under the declared output label. The
# declaration is the trust decision — the output *widens the audience* (the
# redacted text is safe for the whole team) and deliberately restates
# suspicious trust: redaction does not make third-party text trustworthy,
# and a trust-raising output would let the planner launder the injected
# delete through the redactor. Precondition: applies to operator-only
# values, exactly what log-derived data folds to.
[[contracts.transformer]]
name = "pii-redactor"
builtin = "redact-email"
precondition = { audience = ["operator"] }
output = { trust = "suspicious", audience = ["operator", "sre-team"] }

# --- Default authorizer: unknowns pass with receipts. ---------------------------
# The three readers above declare no `requires` — under fail-closed semantics
# every call to them escalates as "tool requirements unknown". This authority
# acknowledges exactly those unprovable facts, on the record; it cannot clear
# proven breaches. Inline authorities route before external ones, so the
# reads never reach `ops-approver`.
[[contracts.authority]]
name = "default-allow"
rule = "allow"
acknowledge_unknown = true

# --- External approver: grants escalate over HTTP. ------------------------------
# The dynamic authorizer. A grant that needs this authority routes here: the
# proxy POSTs the pending approval to the webhook and applies the ruling —
# deny and the call is blocked as the authority's decision; no ruling
# (timeout, outage) and it stays blocked, fail closed. The approver rules on
# the grant's typed coordinates: it DENIES any delta asking to vouch a value
# as trusted (the injected delete's head grant — third-party text stays
# untrusted, whatever the model's paraphrase says) and APPROVES a
# release-control-only delta (the redacted notify — the values flowing are
# within their declared bounds; only the *choice* was informed by the logs).
# Anything else is a 422, never an approval. The mandate covers both grant
# kinds; audience stays outside it, so the injected http_post is terminal —
# no authority is competent for an unbounded public sink.
[[contracts.authority]]
name = "ops-approver"
rule = "escalate"
trust = "trusted"
may_release_control = true
webhook = { url = "http://ops-approver.kagent:8732/rule", timeout_ms = 10000 }
