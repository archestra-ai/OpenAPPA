[package]
name = "appa-edge"
version = "0.1.0"
edition = "2024"
publish = false
description = "Protocol-agnostic layer between adapters and appa-core: sessions, verdicts, external authority resolution"

[dependencies]
appa-core = { path = "../core" }
appa-contracts = { path = "../contracts" }
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
axum = "0.8"
toml = "0.8"

[lints]
workspace = true
