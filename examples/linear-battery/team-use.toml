# Fictional resource and reader IDs. Replace the mappings before deployment.
include = ["../../marketplace/batteries/linear/team-use.toml", "../../marketplace/batteries/github/appa.toml"]

[policy]
version = 2

[[policy.annotator]]
name = "linear.team-use"
audiences = ["alice@corp.example"]
ranks = ["suspicious", "trusted"]
marks = ["linear-review"]
effects = ["linear.changed", "linear.sensitive"]
hint = '''{"rules":{"get_issue":[{"match":{"id":"ENG-1"},"audience":["alice@corp.example"]}],"save_comment":[{"match":{"issueId":"ENG-1"},"audience":["alice@corp.example"],"production":true}],"save_issue":[{"match":{"id":"ENG-1"},"audience":["alice@corp.example"]}]}}'''

[[policy.authority]]
name = "linear-operator"
hint = "Review the exact Linear call, destination and content. This review cannot expand its audience."
[policy.authority.permits]
trust_below = "trusted"
attention = ["linear-review"]

[externals]
timeout_ms = 30000
review_timeout_ms = 600000
max_body_bytes = 1048576
[externals.authorities.linear-operator]
builtin = "hitl"
