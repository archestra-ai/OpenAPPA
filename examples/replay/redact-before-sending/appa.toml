# Private data may leave the company only through the redactor. Reading HR
# makes the trajectory private; an outside email needs `public`; the sanitizer
# is the declared way from one to the other.

[policy]
version = 2

[[policy.tool]]
name = "Read(path:/hr/*)"
parameters = { type = "object", properties = { path = { type = "string" } }, required = ["path"] }
delta = { audience = ["private"] }

[[policy.tool]]
name = "Read"
parameters = { type = "object", properties = { path = { type = "string" } }, required = ["path"] }
delta = {}

[[policy.tool]]
name = "Email"
parameters = { type = "object", properties = { to = { type = "string" }, body = { type = "string" } }, required = ["to", "body"] }
requires = { audience = { contains = ["public"] } }
delta = {}

# Rewrites the email's arguments before dispatch and moves the value from
# `private` to `public`.
[[policy.sanitizer]]
name = "redactor"
on = ["tool_input"]

[policy.sanitizer.permits]
audience = { from = ["private"], to = ["public"] }

[externals]
timeout_ms = 2000
max_body_bytes = 65536

[externals.sanitizers.redactor]
builtin = "redact-email"
