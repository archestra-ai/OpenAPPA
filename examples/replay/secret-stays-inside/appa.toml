# Reading the HR directory narrows the trajectory to the HR audience. From then
# on, an email may go only to a recipient inside that audience.

[policy]
version = 2

[[policy.tool]]
name = "Read(path:/hr/*)"
parameters = { type = "object", properties = { path = { type = "string" } }, required = ["path"] }
delta = { audience = ["hr"] }

[[policy.tool]]
name = "Read"
parameters = { type = "object", properties = { path = { type = "string" } }, required = ["path"] }
delta = {}

# `$to` is the call's own recipient: it must be inside the audience the
# trajectory may still reach.
[[policy.tool]]
name = "Email"
parameters = { type = "object", properties = { to = { type = "string" }, subject = { type = "string" }, body = { type = "string" } }, required = ["to"] }
requires = { audience = { contains = ["$to"] } }
delta = {}

[externals]
timeout_ms = 2000
max_body_bytes = 65536
