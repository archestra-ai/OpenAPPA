# Reading the HR directory restricts the trajectory to the organization, the
# built-in `internal` audience. From then on, nothing may leave the company: a
# sink that needs the `public` audience is blocked, and a sink that stays inside
# is still fine.
#
# No `[audience.internal]` source is declared, so `internal` is a symbol: labels
# compare against it, and no real address is ever inside it.

[policy]
version = 2

[[policy.tool]]
name = "Read(path:/hr/*)"
parameters = { type = "object", properties = { path = { type = "string" } }, required = ["path"] }
delta = { audience = ["internal"] }

[[policy.tool]]
name = "Read"
parameters = { type = "object", properties = { path = { type = "string" } }, required = ["path"] }
delta = {}

# An email leaves the company: the trajectory must still be public.
[[policy.tool]]
name = "Email"
parameters = { type = "object", properties = { to = { type = "string" }, subject = { type = "string" } }, required = ["to"] }
requires = { audience = { contains = ["public"] } }
delta = {}

# A channel post reaches the organization: the trajectory must still reach it.
[[policy.tool]]
name = "PostToChannel"
parameters = { type = "object", properties = { channel = { type = "string" }, text = { type = "string" } }, required = ["channel"] }
requires = { audience = { contains = ["internal"] } }
delta = {}

[externals]
timeout_ms = 2000
max_body_bytes = 65536
