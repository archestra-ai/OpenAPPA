# A file in /hr/ can go only to the HR email address.

[policy]
version = 2

[[policy.tool]]
name = "Read(path:/hr/*)"
delta = { audience = ["hr@archestra.ai"] }

[[policy.tool]]
name = "Read"
delta = {}

[[policy.tool]]
name = "Email"
parameters = { type = "object", properties = { to = { type = "string" } }, required = ["to"] }
requires = { audience = { contains = ["$to"] } }
delta = {}

[externals]
timeout_ms = 2000
max_body_bytes = 65536
