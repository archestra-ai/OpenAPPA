# Web content is written by someone outside the session. Once it is in the
# trajectory, a command may not run: a page could carry an instruction the
# model would follow.

[policy]
version = 2

[[policy.tool]]
name = "mcp/web/fetch"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "mcp/shell/bash"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
name = "mcp/files/write"
delta = {}

[externals]
timeout_ms = 2000
max_body_bytes = 65536
