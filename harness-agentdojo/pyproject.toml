[project]
name = "appa-dojo"
version = "0.1.0"
description = "AgentDojo evaluation harness for OpenAPPA"
requires-python = ">=3.11"
dependencies = [
    "agentdojo==0.1.35",
    "openai>=1",
]

[project.scripts]
appa-dojo = "appa_dojo.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/appa_dojo"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
