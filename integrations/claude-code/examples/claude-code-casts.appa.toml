# Example deployment for protecting a Claude Code session, with casts
# resolving what the policy leaves unannotated. Read
# `claude-code.appa.toml` first: this file is that policy plus the
# cast wiring.
#
# A tool with no `delta` key is unannotated: its results enter Unknown
# in both dimensions and never satisfy a sink's `requires` on their
# own. A `[[cast]]` resolves such a value whole — every dimension at
# once — either from a constant written here or from a classifier the
# deployment binds under `[externals.casts]`. Applicable casts run in
# registration order until one answers; a resolver that cannot answer
# is skipped, so a trailing constant is the declared fallback.
#
# `WebFetch` declares one pending dimension itself:
# `delta = { trust = "unknown" }`. The deployment lists it in
# `confined_results`, so the runtime keeps the raw page from the model
# until the classifier has read it, and delivers the bytes only after
# the agent accepts the label the classifier resolved.
#
# The sink is `mcp__github__issue_write`, which requires `trusted`
# content. A fetched page the classifier rates `suspicious`, and a
# GitHub read the fallback rates `suspicious`, never flow into an
# issue undeclared: the block names the value, and its remedy plans
# name what would clear it.
#
# GitHub tools this file does not name are blocked, which is the
# fail-closed default: name the ones your session needs.

[policy]
version = 1

# --- tools whose results stay inside the session's trust boundary ---

# Starting a subagent is this harness's spawn: the deployment controls the
# child's context (`[policy.deployment]` below), so the subagent runs as a
# child trajectory and its final message is checked where the parent
# receives it. A background subagent (`run_in_background = true`) reports
# its result outside the parent's tool result, where nothing can be
# checked, so the call is refused as invalid.
[[policy.tool]]
name = "Agent"
parameters = { type = "object", additionalProperties = true, properties = { run_in_background = { type = "boolean", const = false } } }
delta = {}

[[policy.tool]]
name = "AskUserQuestion"
delta = {}

[[policy.tool]]
name = "Artifact"
delta = {}

[[policy.tool]]
name = "Bash"
delta = {}

[[policy.tool]]
name = "BashOutput"
delta = {}

[[policy.tool]]
name = "CronCreate"
delta = {}

[[policy.tool]]
name = "CronDelete"
delta = {}

[[policy.tool]]
name = "CronList"
delta = {}

[[policy.tool]]
name = "Edit"
delta = {}

[[policy.tool]]
name = "EnterPlanMode"
delta = {}

[[policy.tool]]
name = "EnterWorktree"
delta = {}

[[policy.tool]]
name = "ExitPlanMode"
delta = {}

[[policy.tool]]
name = "ExitWorktree"
delta = {}

[[policy.tool]]
name = "Glob"
delta = {}

[[policy.tool]]
name = "Grep"
delta = {}

[[policy.tool]]
name = "KillShell"
delta = {}

[[policy.tool]]
name = "LSP"
delta = {}

[[policy.tool]]
name = "ListAgents"
delta = {}

[[policy.tool]]
name = "ListMcpResourcesTool"
delta = {}

[[policy.tool]]
name = "Monitor"
delta = {}

[[policy.tool]]
name = "NotebookEdit"
delta = {}

[[policy.tool]]
name = "PushNotification"
delta = {}

[[policy.tool]]
name = "Read"
delta = {}

[[policy.tool]]
name = "ReadMcpResourceDirTool"
delta = {}

[[policy.tool]]
name = "ReadMcpResourceTool"
delta = {}

[[policy.tool]]
name = "ReportFindings"
delta = {}

[[policy.tool]]
name = "ScheduleWakeup"
delta = {}

[[policy.tool]]
name = "SendMessage"
delta = {}

[[policy.tool]]
name = "SendUserFile"
delta = {}

[[policy.tool]]
name = "Skill"
delta = {}

[[policy.tool]]
name = "SlashCommand"
delta = {}

# `Task` is the earlier name of `Agent`: the same spawn, the same contract.
[[policy.tool]]
name = "Task"
parameters = { type = "object", additionalProperties = true, properties = { run_in_background = { type = "boolean", const = false } } }
delta = {}

[[policy.tool]]
name = "TaskCreate"
delta = {}

[[policy.tool]]
name = "TaskGet"
delta = {}

[[policy.tool]]
name = "TaskList"
delta = {}

[[policy.tool]]
name = "TaskOutput"
delta = {}

[[policy.tool]]
name = "TaskStop"
delta = {}

[[policy.tool]]
name = "TaskUpdate"
delta = {}

[[policy.tool]]
name = "TodoWrite"
delta = {}

[[policy.tool]]
name = "ToolSearch"
delta = {}

[[policy.tool]]
name = "Workflow"
delta = {}

[[policy.tool]]
name = "Write"
delta = {}

# --- tools that bring outside content into the session ---

# Search results are authored outside the session.
[[policy.tool]]
name = "WebSearch"
delta = { trust = "suspicious" }

# A fetched page is pending-cast: its trust is decided per value by the
# `page-classifier` below, never assumed. The `web` tag matches the
# classifier's `tags`; `confined_results` below holds the raw result
# until the cast has answered.
[[policy.tool]]
name = "WebFetch"
tags = ["web"]
delta = { trust = "unknown" }

# --- GitHub, through the GitHub MCP server ---

[[policy.tool]]
name = "mcp__github__get_me"
delta = {}

# Reading an issue is unannotated on purpose: no `delta` key, so the
# text enters Unknown in both dimensions. The `github-content` constant
# below resolves it the first time a sink asks.
[[policy.tool]]
name = "mcp__github__issue_read"
tags = ["github"]

# The sink. Only `trusted` content may become an issue; a value still
# Unknown here is listed as unestablished, and a value cast to
# `suspicious` is blocked with the authority plans that could cover it.
[[policy.tool]]
name = "mcp__github__issue_write"
delta = {}
requires = { trust = "trusted" }

# The deployment controls what a subagent starts from, and withholds a
# `WebFetch` result from the model until its pending cast resolves.
[policy.deployment]
context_control = true
confined_results = ["WebFetch"]

# --- casts ---

# A classifier the deployment binds. `may_cast` is the ceiling: an
# answer outside these ranks or wider than this audience is refused and
# the value stays withheld.
[[policy.cast]]
name = "page-classifier"
tags = ["web"]

[policy.cast.resolver.may_cast]
trust = ["suspicious", "trusted"]
audience = ["public"]

# A constant needs no binding. Registered last: a constant shadows every
# cast after it that shares its tags, and the loader refuses the dead
# registration.
[[policy.cast]]
name = "github-content"
tags = ["github"]

[policy.cast.constant]
trust = "suspicious"
audience = ["public"]

[externals]
timeout_ms = 5000
max_body_bytes = 65536

# The classifier's binding: an endpoint, a command, or a model builtin
# (`claude-code`, `llm`), always under `may_cast`. The constant cast has
# no entry at all.
[externals.casts.page-classifier]
url = "https://classify.example.com/label"
