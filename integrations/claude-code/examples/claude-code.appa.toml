# Example deployment for protecting a Claude Code session.
#
# Every built-in tool of the harness is named. A tool the policy does not name
# reaches the bounded Claude fallback at the end of this file, so a newly
# installed MCP tool still gets a per-call contract until `/appa-guide init`
# gives it an exact one. A named tool without a `delta` key restricts nothing,
# the same statement as `delta = {}`: the result's label is the combination of
# its sources, unchanged.
#
# Tools that bring outside content into the session — the web tools —
# carry `delta = { trust = "suspicious" }` instead: their results
# enter at the low rank of the default trust chain
# (suspicious < trusted), so a `requires = { trust = "trusted" }` sink
# never receives them undeclared.
#
# The built-in tool set varies by Claude Code version; regenerate the
# list from a live session when it drifts.

[policy]
version = 1

# --- tools whose results stay inside the session's trust boundary ---

# Starting a subagent is this harness's spawn: the deployment controls the
# child's context (`[policy.deployment]` below), so the subagent runs as a
# child trajectory and its final message is checked where the parent
# receives it. A background subagent (`run_in_background = true`) reports
# its result outside the parent's tool result, where nothing can be
# checked, so the call is refused as invalid.
[[policy.tool]]
name = "Agent"
parameters = { type = "object", additionalProperties = true, properties = { run_in_background = { type = "boolean", const = false } } }
delta = {}

[[policy.tool]]
name = "AskUserQuestion"
delta = {}

[[policy.tool]]
name = "Artifact"
delta = {}

[[policy.tool]]
name = "Bash"
delta = {}

[[policy.tool]]
name = "BashOutput"
delta = {}

[[policy.tool]]
name = "CronCreate"
delta = {}

[[policy.tool]]
name = "CronDelete"
delta = {}

[[policy.tool]]
name = "CronList"
delta = {}

[[policy.tool]]
name = "Edit"
delta = {}

[[policy.tool]]
name = "EnterPlanMode"
delta = {}

[[policy.tool]]
name = "EnterWorktree"
delta = {}

[[policy.tool]]
name = "ExitPlanMode"
delta = {}

[[policy.tool]]
name = "ExitWorktree"
delta = {}

[[policy.tool]]
name = "Glob"
delta = {}

[[policy.tool]]
name = "Grep"
delta = {}

[[policy.tool]]
name = "KillShell"
delta = {}

[[policy.tool]]
name = "LSP"
delta = {}

[[policy.tool]]
name = "ListAgents"
delta = {}

[[policy.tool]]
name = "ListMcpResourcesTool"
delta = {}

[[policy.tool]]
name = "Monitor"
delta = {}

[[policy.tool]]
name = "NotebookEdit"
delta = {}

[[policy.tool]]
name = "PushNotification"
delta = {}

[[policy.tool]]
name = "Read"
delta = {}

[[policy.tool]]
name = "ReadMcpResourceDirTool"
delta = {}

[[policy.tool]]
name = "ReadMcpResourceTool"
delta = {}

[[policy.tool]]
name = "ReportFindings"
delta = {}

[[policy.tool]]
name = "ScheduleWakeup"
delta = {}

[[policy.tool]]
name = "SendMessage"
delta = {}

[[policy.tool]]
name = "SendUserFile"
delta = {}

[[policy.tool]]
name = "Skill"
delta = {}

[[policy.tool]]
name = "SlashCommand"
delta = {}

# `Task` is the earlier name of `Agent`: the same spawn, the same contract.
[[policy.tool]]
name = "Task"
parameters = { type = "object", additionalProperties = true, properties = { run_in_background = { type = "boolean", const = false } } }
delta = {}

[[policy.tool]]
name = "TaskCreate"
delta = {}

[[policy.tool]]
name = "TaskGet"
delta = {}

[[policy.tool]]
name = "TaskList"
delta = {}

[[policy.tool]]
name = "TaskOutput"
delta = {}

[[policy.tool]]
name = "TaskStop"
delta = {}

[[policy.tool]]
name = "TaskUpdate"
delta = {}

[[policy.tool]]
name = "TodoWrite"
delta = {}

[[policy.tool]]
name = "ToolSearch"
delta = {}

[[policy.tool]]
name = "Workflow"
delta = {}

[[policy.tool]]
name = "Write"
delta = {}

# --- tools that bring outside content into the session ---

# Web pages and search results are authored outside the session.
[[policy.tool]]
name = "WebFetch"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "WebSearch"
delta = { trust = "suspicious" }

# Compatibility net for tools installed after this policy was generated. Exact
# declarations always win over the wildcard, including declarations supplied by
# connector batteries. The mandate is deliberately closed to this deployment's
# two trust ranks, its one private audience, HITL, and no effects.
[[policy.annotator]]
name = "claude-code.undeclared-tool"
builtin = "claude-code"
ranks = ["suspicious", "trusted"]
audiences = ["private"]
marks = ["hitl"]
effects = []

[[policy.tool]]
name = "*"
annotator = "claude-code.undeclared-tool"

# The deployment controls what a subagent starts from: the harness gives
# every subagent exactly the prompt the parent's spawn call carried, and
# nothing else of the parent's context. That is what lets the runtime
# check the subagent's return as a branch of the parent.
[policy.deployment]
context_control = true

# Batteries can require fresh `hitl` attention before a tool runs. This
# authority asks the person running the Claude Code session and can satisfy
# that requirement for one tool call.
[[policy.authority]]
name = "hitl"
hint = "Ask the person running this session."

[policy.authority.permits]
attention = ["hitl"]

[externals]
timeout_ms = 5000
review_timeout_ms = 600000
max_body_bytes = 65536

[externals.authorities.hitl]
builtin = "hitl"
