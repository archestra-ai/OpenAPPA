# Example deployment for protecting a Claude Code session.
#
# The stable built-in tools of the harness are named. Bash and Read deliberately
# reach the bounded Claude fallback at the end of this file unless the optional
# Claude Code battery supplies their exact annotators. Any other tool the policy
# does not name gets the same per-call fallback until `/appa-guide init` gives it
# an exact contract. A named tool without a `delta` key restricts nothing, the
# same statement as `delta = {}`: the result's label is the combination of its
# sources, unchanged.
#
# Tools that bring outside content into the session — the web tools —
# carry `delta = { trust = "suspicious" }` instead: their results
# enter at the low rank of the default trust chain
# (suspicious < trusted), so a `requires = { trust = "trusted" }` sink
# never receives them undeclared.
#
# Who may see a value is the built-in audience chain `self` ⊆ `internal`
# ⊆ `public`: `self` is the person running this session, `internal` their
# organization, `public` the unrestricted state every session starts in.
# Reading the requester's own credentials narrows the session to `self`;
# the tools that publish or transmit beyond this machine require `public`,
# so a narrowed session cannot reach them. The chain works without a
# directory: `self` and `internal` are symbolic, and only a rule naming an
# individual recipient needs a source to check them (see the end of this
# file).
#
# The built-in tool set varies by Claude Code version; regenerate the
# list from a live session when it drifts.

[policy]
version = 2

# --- the requester's credentials on this machine: `self` data ---

# Order matters: the first matching contract wins, so these argument-selected
# rules come before the plain tool rules and the `*` fallback below. Reading a
# credential with Read narrows the session to `self`. A Bash command that names
# one is refused outright — one contract judges one call, and a compound
# command could read and send in the same call. `blocked` is a mark no
# authority grants, so the refusal has no remedy. This is known-path blocking,
# not containment: `env`, an interpreter, or an unlisted path still reach a
# secret without naming it.

[[policy.tool]]
name = "Read(file_path:*/.claude.json)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "Read(file_path:*/.claude/*settings.json)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "Read(file_path:*.credentials.json)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "Read(file_path:*/.ssh/*)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "Read(file_path:*/.aws/credentials)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "Read(file_path:*/.netrc)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "Read(file_path:*/.config/gh/hosts.yml)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "Bash(command:*/.claude.json*)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "Bash(command:*.credentials.json*)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "Bash(command:*/.ssh/*)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "Bash(command:*/.aws/credentials*)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "Bash(command:*/.netrc*)"
requires = { attention = ["blocked"] }
delta = {}

[[policy.tool]]
name = "Bash(command:*/.config/gh/hosts.yml*)"
requires = { attention = ["blocked"] }
delta = {}

# --- tools whose results stay inside the session's trust boundary ---

# Starting a subagent is this harness's spawn: the deployment controls the
# child's context (`[policy.deployment]` below), so the subagent runs as a
# child trajectory. The spawn is held until the session declares what the
# subagent's final message may carry — as it is, floored at a label, or
# through a registered sanitizer such as `attest-schema` below — and that
# message is checked when the subagent stops: one that may not cross keeps
# the subagent running, with the reason or the exact text to return, until
# it stops with one that may.
[[policy.tool]]
name = "Agent"
delta = {}

[[policy.tool]]
name = "AskUserQuestion"
delta = {}

# Publishes a page on claude.ai: a public sink.
[[policy.tool]]
name = "Artifact"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "BashOutput"
delta = {}

[[policy.tool]]
name = "CronCreate"
delta = {}

[[policy.tool]]
name = "CronDelete"
delta = {}

[[policy.tool]]
name = "CronList"
delta = {}

[[policy.tool]]
name = "Edit"
delta = {}

[[policy.tool]]
name = "EnterPlanMode"
delta = {}

[[policy.tool]]
name = "EnterWorktree"
delta = {}

[[policy.tool]]
name = "ExitPlanMode"
delta = {}

[[policy.tool]]
name = "ExitWorktree"
delta = {}

[[policy.tool]]
name = "Glob"
delta = {}

[[policy.tool]]
name = "Grep"
delta = {}

[[policy.tool]]
name = "KillShell"
delta = {}

[[policy.tool]]
name = "LSP"
delta = {}

[[policy.tool]]
name = "ListAgents"
delta = {}

[[policy.tool]]
name = "ListMcpResourcesTool"
delta = {}

[[policy.tool]]
name = "Monitor"
delta = {}

[[policy.tool]]
name = "NotebookEdit"
delta = {}

[[policy.tool]]
name = "PushNotification"
delta = {}

[[policy.tool]]
name = "ReadMcpResourceDirTool"
delta = {}

[[policy.tool]]
name = "ReadMcpResourceTool"
delta = {}

[[policy.tool]]
name = "ReportFindings"
delta = {}

[[policy.tool]]
name = "ScheduleWakeup"
delta = {}

[[policy.tool]]
name = "SendMessage"
delta = {}

[[policy.tool]]
name = "SendUserFile"
delta = {}

[[policy.tool]]
name = "Skill"
delta = {}

[[policy.tool]]
name = "SlashCommand"
delta = {}

# `Task` is the earlier name of `Agent`: the same spawn, the same contract.
[[policy.tool]]
name = "Task"
delta = {}

[[policy.tool]]
name = "TaskCreate"
delta = {}

[[policy.tool]]
name = "TaskGet"
delta = {}

[[policy.tool]]
name = "TaskList"
delta = {}

[[policy.tool]]
name = "TaskOutput"
delta = {}

[[policy.tool]]
name = "TaskStop"
delta = {}

[[policy.tool]]
name = "TaskUpdate"
delta = {}

[[policy.tool]]
name = "TodoWrite"
delta = {}

[[policy.tool]]
name = "ToolSearch"
delta = {}

[[policy.tool]]
name = "Workflow"
delta = {}

[[policy.tool]]
name = "Write"
delta = {}

# --- tools that bring outside content into the session ---

# Web pages and search results are authored outside the session, and the URL
# or query itself leaves it: a public sink and an untrusted source at once.
[[policy.tool]]
name = "WebFetch"
requires = { audience = { contains = ["public"] } }
delta = { trust = "suspicious" }

[[policy.tool]]
name = "WebSearch"
requires = { audience = { contains = ["public"] } }
delta = { trust = "suspicious" }

# Compatibility net for tools installed after this policy was generated. Exact
# declarations always win over the wildcard, including declarations supplied by
# connector batteries. The mandate is deliberately closed to this deployment's
# two trust ranks, HITL, and no effects. An annotation names literal readers
# only, never `self` or `internal`, and this policy names no literal reader, so
# the annotator narrows trust and requires approval but leaves the audience
# alone: a tool whose result is the requester's or the organization's data gets
# a static rule above instead.
# APPA-UNIX-FALLBACK-BEGIN
[[policy.annotator]]
name = "claude-code.undeclared-tool"
builtin = "claude-code"
ranks = ["suspicious", "trusted"]
audiences = []
marks = ["hitl"]
effects = []

[[policy.tool]]
name = "*"
annotator = "claude-code.undeclared-tool"
# APPA-UNIX-FALLBACK-END

# The reserved builtin sanitizer of a structured subagent return. The
# session declares a JSON schema of bounded fields when it starts the
# subagent; a final message that matches it crosses at the session's own
# trust instead of the rank the subagent's reads left it at. It runs in
# the runtime itself and needs no externals entry.
[[policy.sanitizer]]
name = "attest-schema"
on = ["tool_output"]

[policy.sanitizer.permits]
trust = { from = "suspicious", to = "trusted" }

# The deployment controls what a subagent starts from: the harness gives
# every subagent exactly the prompt the parent's spawn call carried, and
# nothing else of the parent's context. That is what lets the runtime
# check the subagent's return as a branch of the parent.
[policy.deployment]
context_control = true

# Batteries can require fresh `hitl` attention before a tool runs. This
# authority asks the person running the Claude Code session and can satisfy
# that requirement for one tool call.
[[policy.authority]]
name = "hitl"
hint = "Ask the person running this session."

[policy.authority.permits]
attention = ["hitl"]

[externals]
timeout_ms = 5000
review_timeout_ms = 600000
max_body_bytes = 65536

[externals.authorities.hitl]
builtin = "hitl"

# Who `self` and `internal` are, read from a directory when a decision needs
# actual membership: a rule naming an individual recipient
# (`requires = { audience = { contains = ["$to"] } }`) checked against a
# narrowed session. Without a source the chain still decides symbolically and
# such a call is refused as unanswerable. To add one, copy the GitHub battery
# beside this file, put the mapping under `[policy]`, and bind the source here:
#
#   [policy.audience.self]
#   from = ["github:viewer"]
#
#   [policy.audience.internal]
#   from = ["github:org/<your-org>/members"]
#
#   [externals.audience.github]
#   command = ["python3", "batteries/github/audience-source.py"]
#   token_env = "APPA_PROVIDER_GITHUB_TOKEN"
