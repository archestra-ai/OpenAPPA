# Example deployment for protecting a Claude Code session.
#
# Every built-in tool of the harness is named: a tool the policy does
# not name is blocked. Almost every tool here is named without a
# `delta` key on purpose: its results are admitted as fully unknown
# (fail-closed, `UNK-5`) until a reviewed rule gives the tool a real
# annotation — run `/appa-tool-sync` to generate those. Write
# `delta = {}` only as a deliberate decision that a tool's result is
# exactly the combination of its sources, unchanged; this starting
# policy makes no such claim for you.
#
# The web tools are unannotated like the rest: unknown already fails
# closed at every declared sink. A generated rule typically gives them
# `delta = { trust = "suspicious" }` — a definite low rank on the
# default trust chain (suspicious < trusted) — once reviewed.
#
# The only entries carrying more than a name are the `Agent` and `Task`
# argument pins (`run_in_background = false`): structural, not label
# rules — the runtime refuses to serve this deployment without them,
# because a background subagent returns where no hook can check it.
#
# The built-in tool set varies by Claude Code version; regenerate the
# list from a live session when it drifts.

[policy]
version = 1

# --- tools whose results stay inside the session's trust boundary ---

# Starting a subagent is this harness's spawn: the deployment controls the
# child's context (`[policy.deployment]` below), so the subagent runs as a
# child trajectory and its final message is checked where the parent
# receives it. A background subagent (`run_in_background = true`) reports
# its result outside the parent's tool result, where nothing can be
# checked, so the call is refused as invalid.
[[policy.tool]]
name = "Agent"
parameters = { type = "object", additionalProperties = true, properties = { run_in_background = { type = "boolean", const = false } } }

[[policy.tool]]
name = "AskUserQuestion"

[[policy.tool]]
name = "Artifact"

[[policy.tool]]
name = "Bash"

[[policy.tool]]
name = "BashOutput"

[[policy.tool]]
name = "CronCreate"

[[policy.tool]]
name = "CronDelete"

[[policy.tool]]
name = "CronList"

[[policy.tool]]
name = "Edit"

[[policy.tool]]
name = "EnterPlanMode"

[[policy.tool]]
name = "EnterWorktree"

[[policy.tool]]
name = "ExitPlanMode"

[[policy.tool]]
name = "ExitWorktree"

[[policy.tool]]
name = "Glob"

[[policy.tool]]
name = "Grep"

[[policy.tool]]
name = "KillShell"

[[policy.tool]]
name = "LSP"

[[policy.tool]]
name = "ListAgents"

[[policy.tool]]
name = "ListMcpResourcesTool"

[[policy.tool]]
name = "Monitor"

[[policy.tool]]
name = "NotebookEdit"

[[policy.tool]]
name = "PushNotification"

[[policy.tool]]
name = "Read"

[[policy.tool]]
name = "ReadMcpResourceDirTool"

[[policy.tool]]
name = "ReadMcpResourceTool"

[[policy.tool]]
name = "ReportFindings"

[[policy.tool]]
name = "ScheduleWakeup"

[[policy.tool]]
name = "SendMessage"

[[policy.tool]]
name = "SendUserFile"

[[policy.tool]]
name = "Skill"

[[policy.tool]]
name = "SlashCommand"

# `Task` is the earlier name of `Agent`: the same spawn, the same contract.
[[policy.tool]]
name = "Task"
parameters = { type = "object", additionalProperties = true, properties = { run_in_background = { type = "boolean", const = false } } }

[[policy.tool]]
name = "TaskCreate"

[[policy.tool]]
name = "TaskGet"

[[policy.tool]]
name = "TaskList"

[[policy.tool]]
name = "TaskOutput"

[[policy.tool]]
name = "TaskStop"

[[policy.tool]]
name = "TaskUpdate"

[[policy.tool]]
name = "TodoWrite"

[[policy.tool]]
name = "ToolSearch"

[[policy.tool]]
name = "Workflow"

[[policy.tool]]
name = "Write"

# --- tools that bring outside content into the session ---

# Web pages and search results are authored outside the session.
[[policy.tool]]
name = "WebFetch"

[[policy.tool]]
name = "WebSearch"

# The deployment controls what a subagent starts from: the harness gives
# every subagent exactly the prompt the parent's spawn call carried, and
# nothing else of the parent's context. That is what lets the runtime
# check the subagent's return as a branch of the parent.
[policy.deployment]
context_control = true

[externals]
timeout_ms = 5000
max_body_bytes = 65536
