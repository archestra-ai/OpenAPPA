# --- tools that bring outside content into the session ---

# Web pages and search results are authored outside the session.
[[policy.tool]]
name = "WebFetch"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "WebSearch"
delta = { trust = "suspicious" }

[externals]
timeout_ms = 5000
max_body_bytes = 65536
