# Default deployment for protecting a Claude Code session.
#
# Claude Code tool contracts and their resolvers live in the included battery.
# Root contracts can override any battery contract because root rules run first.

include = ["../../../batteries/claude-code/appa.toml"]

[policy]
version = 1

# The harness gives a subagent exactly the prompt on the spawn call and none of
# the parent's other context. This lets the runtime check the child's return.
[policy.deployment]
context_control = true

[externals]
timeout_ms = 5000
review_timeout_ms = 600000
max_body_bytes = 65536
