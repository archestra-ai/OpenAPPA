# Example deployment for protecting a Claude Code session.
#
# The stable built-in tools of the harness are named. Bash and Read deliberately
# reach the bounded Claude fallback at the end of this file unless the optional
# Claude Code battery supplies their exact annotators. Any other tool the policy
# does not name gets the same per-call fallback until `/appa-guide init` gives it
# an exact contract. A named tool without a `delta` key restricts nothing, the
# same statement as `delta = {}`: the result's label is the combination of its
# sources, unchanged.
#
# Tools that bring outside content into the session — the web tools —
# carry `delta = { trust = "suspicious" }` instead: their results
# enter at the low rank of the default trust chain
# (suspicious < trusted), so a `requires = { trust = "trusted" }` sink
# never receives them undeclared.
#
# The built-in tool set varies by Claude Code version; regenerate the
# list from a live session when it drifts.

[policy]
version = 2

# --- tools whose results stay inside the session's trust boundary ---

# Starting a subagent is this harness's spawn: the deployment controls the
# child's context (`[policy.deployment]` below), so the subagent runs as a
# child trajectory. The spawn is held until the session declares what the
# subagent's final message may carry — as it is, floored at a label, or
# through a registered sanitizer such as `attest-schema` below — and that
# message is checked when the subagent stops: one that may not cross keeps
# the subagent running, with the reason or the exact text to return, until
# it stops with one that may.
[[policy.tool]]
name = "Agent"
delta = {}

[[policy.tool]]
name = "AskUserQuestion"
delta = {}

[[policy.tool]]
name = "Artifact"
delta = {}

[[policy.tool]]
name = "BashOutput"
delta = {}

[[policy.tool]]
name = "CronCreate"
delta = {}

[[policy.tool]]
name = "CronDelete"
delta = {}

[[policy.tool]]
name = "CronList"
delta = {}

[[policy.tool]]
name = "Edit"
delta = {}

[[policy.tool]]
name = "EnterPlanMode"
delta = {}

[[policy.tool]]
name = "EnterWorktree"
delta = {}

[[policy.tool]]
name = "ExitPlanMode"
delta = {}

[[policy.tool]]
name = "ExitWorktree"
delta = {}

[[policy.tool]]
name = "Glob"
delta = {}

[[policy.tool]]
name = "Grep"
delta = {}

[[policy.tool]]
name = "KillShell"
delta = {}

[[policy.tool]]
name = "LSP"
delta = {}

[[policy.tool]]
name = "ListAgents"
delta = {}

[[policy.tool]]
name = "ListMcpResourcesTool"
delta = {}

[[policy.tool]]
name = "Monitor"
delta = {}

[[policy.tool]]
name = "NotebookEdit"
delta = {}

[[policy.tool]]
name = "PushNotification"
delta = {}

[[policy.tool]]
name = "ReadMcpResourceDirTool"
delta = {}

[[policy.tool]]
name = "ReadMcpResourceTool"
delta = {}

[[policy.tool]]
name = "ReportFindings"
delta = {}

[[policy.tool]]
name = "ScheduleWakeup"
delta = {}

[[policy.tool]]
name = "SendMessage"
delta = {}

[[policy.tool]]
name = "SendUserFile"
delta = {}

[[policy.tool]]
name = "Skill"
delta = {}

[[policy.tool]]
name = "SlashCommand"
delta = {}

# `Task` is the earlier name of `Agent`: the same spawn, the same contract.
[[policy.tool]]
name = "Task"
delta = {}

[[policy.tool]]
name = "TaskCreate"
delta = {}

[[policy.tool]]
name = "TaskGet"
delta = {}

[[policy.tool]]
name = "TaskList"
delta = {}

[[policy.tool]]
name = "TaskOutput"
delta = {}

[[policy.tool]]
name = "TaskStop"
delta = {}

[[policy.tool]]
name = "TaskUpdate"
delta = {}

[[policy.tool]]
name = "TodoWrite"
delta = {}

[[policy.tool]]
name = "ToolSearch"
delta = {}

[[policy.tool]]
name = "Workflow"
delta = {}

[[policy.tool]]
name = "Write"
delta = {}

# --- tools that bring outside content into the session ---

# Web pages and search results are authored outside the session.
[[policy.tool]]
name = "WebFetch"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "WebSearch"
delta = { trust = "suspicious" }

# Compatibility net for tools installed after this policy was generated. Exact
# declarations always win over the wildcard, including declarations supplied by
# connector batteries. The mandate is deliberately closed to this deployment's
# two trust ranks, its one private audience, HITL, and no effects.
# APPA-UNIX-FALLBACK-BEGIN
[[policy.annotator]]
name = "claude-code.undeclared-tool"
builtin = "claude-code"
ranks = ["suspicious", "trusted"]
audiences = ["private"]
marks = ["hitl"]
effects = []

[[policy.tool]]
name = "*"
annotator = "claude-code.undeclared-tool"
# APPA-UNIX-FALLBACK-END

# The reserved builtin sanitizer of a structured subagent return. The
# session declares a JSON schema of bounded fields when it starts the
# subagent; a final message that matches it crosses at the session's own
# trust instead of the rank the subagent's reads left it at. It runs in
# the runtime itself and needs no externals entry.
[[policy.sanitizer]]
name = "attest-schema"
on = ["tool_output"]

[policy.sanitizer.permits]
trust = { from = "suspicious", to = "trusted" }

# The deployment controls what a subagent starts from: the harness gives
# every subagent exactly the prompt the parent's spawn call carried, and
# nothing else of the parent's context. That is what lets the runtime
# check the subagent's return as a branch of the parent.
[policy.deployment]
context_control = true

# Batteries can require fresh `hitl` attention before a tool runs. This
# authority asks the person running the Claude Code session and can satisfy
# that requirement for one tool call.
[[policy.authority]]
name = "hitl"
hint = "Ask the person running this session."

[policy.authority.permits]
attention = ["hitl"]

[externals]
timeout_ms = 5000
review_timeout_ms = 600000
max_body_bytes = 65536

[externals.authorities.hitl]
builtin = "hitl"
