[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "appa-kagent-adk"
version = "0.1.0"
description = "OpenAPPA on kagent: the AppaPluginKagent ADK plugin and the replacement runtime entrypoint"
readme = "README.md"
# The lane A base (kagent-adk 0.3.0) floors python at 3.10; the
# release-candidate line floors it at 3.11. The package keeps the lower
# floor so one wheel serves both lanes.
requires-python = ">=3.10"
# One plugin codebase serves both locked ADK majors: google-adk 1.31.1
# on the stable lane and 2.8.0 on the release-candidate line. The image
# build pins its kagent base image by tag (the Dockerfile's
# KAGENT_APP_IMAGE), and that base venv fixes the google-adk version.
# CI runs the tests twice (.github/workflows/ci.yml). The locked lane
# resolves google-adk 2.8.0 from uv.lock. The kagent v0.9.12 lane pins
# kagent-adk at the v0.9.12 tag with google-adk 1.31.1.
dependencies = [
  "google-adk>=1.28.1,<3",
  "httpx>=0.25.0",
]

[project.scripts]
appa-kagent-adk = "appa_kagent_adk.entrypoint:main"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=1",
  "ruff>=0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src/appa_kagent_adk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.uv]
# uv keys a path dependency's built wheel on pyproject.toml alone, so a
# `uv run --with <this dir>` would reuse a stale build after a source
# edit. Key it on the sources too.
cache-keys = [{ file = "pyproject.toml" }, { file = "src/**/*.py" }]
