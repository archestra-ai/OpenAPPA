server {
    listen 18789;
    # appa-runtime binds loopback only, in this pod, and its /mcp (rmcp)
    # validates the Host header — so the relay presents a loopback Host.
    location / {
        proxy_pass http://127.0.0.1:18787;
        proxy_set_header Host 127.0.0.1:18787;
        proxy_http_version 1.1;
        proxy_buffering off;   # stream SSE for /mcp
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }
}
