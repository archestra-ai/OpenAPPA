{{- if .Values.guide.enabled }}
# The appa-guide agent: packaging around the canonical composable skill at
# integrations/appa-guide (SKILL.md router plus host reference files).
# This agent guarantees the kagent side's prerequisites: the kagent tool
# server's k8s tools, the shared runtime as its own gate, and the model.
# The fleet policy puts cluster and Helm writes behind human-approval, so
# each mutation raises kagent's Approve/Reject card.
apiVersion: kagent.dev/v1alpha2
kind: Agent
metadata:
  name: appa-guide
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "appa-demo.labels" . | nindent 4 }}
spec:
  type: Declarative
  description: Configure and operate OpenAPPA for this cluster. Say init or adjust.
  skills:
    gitRefs:
      - url: {{ .Values.guide.skill.git.url | quote }}
        ref: {{ .Values.guide.skill.git.ref | default (printf "v%s" .Chart.AppVersion) | quote }}
        path: {{ .Values.guide.skill.git.path | quote }}
        name: {{ .Values.guide.skill.name | quote }}
  declarative:
    systemMessage: |
      You configure OpenAPPA for this kagent cluster. When the operator says
      init or adjust, or asks to manage runtimes, demo agents, protected
      agents, tools, batteries, or policy, your first tool call must be skills
      with command appa-guide. Invoke it exactly once and follow it exactly.
      Your second tool call must be read_file for
      /skills/appa-guide/references/kagent.md with offset 1 and limit 0. Follow
      the complete result. On init, complete
      all read-only inspection and present the proposal without asking whether
      to continue. Inventory Agents across all namespaces with output json. This demo and its
      shared runtime are installed in {{ .Release.Namespace }}. Find the runtime
      with one k8s_get_resources call for wide pods in that namespace. The tool
      has no label-selector argument. Fetch the appa-runtime-* candidate by exact
      name and verify metadata.labels.app=appa-runtime; never construct its pod
      name from the Helm release.
      Inventory every RemoteMCPServer across all
      namespaces with a wide list, then fetch each by exact name and namespace.
      Run every inspection call sequentially, never in parallel. Do not respond or
      promise next steps until the full init checklist and comparison are complete.
      If no change is needed, send one final summary. Do not call the policy
      updated or tell the operator to start a new chat.
      When feedback offers human-approval, immediately call
      execute_remedy_plan with its exact offer id to open the confirmation
      card, then wait for the ruling. Never summarize instead of opening it.
      For every appa-guide-* call, copy pod_name and namespace from the same
      fetched Pod YAML. Never combine values from different resources.
      Work only through
      your k8s tools and read_file. Do not
      change the policy until the operator approves the proposal in
      chat; applying then raises the kagent Approve card. After a
      successful reload, tell the operator to start a new chat with a
      gated agent to use the updated policy.
    modelConfig: {{ .Values.modelConfig.name | quote }}
    tools:
      - type: McpServer
        mcpServer:
          name: {{ .Values.guide.toolServer | quote }}
          kind: RemoteMCPServer
          toolNames:
            - k8s_get_resources
            - k8s_get_resource_yaml
            - k8s_get_events
            - k8s_get_pod_logs
            - k8s_apply_manifest
            - k8s_patch_resource
            - k8s_delete_resource
            - k8s_execute_command
            - helm_list_releases
            - helm_get_release
            - helm_upgrade
            - helm_uninstall
    deployment:
      env:
        # The image is a drop-in replacement for the stock kagent one and
        # runs ungated until this reads true. The guide agent applies the
        # policy ConfigMap through k8s_apply_manifest, which the demo
        # policy puts behind human-approval, so it must be gated.
        - name: APPA_ENABLED
          value: "true"
        - name: APPA_RUNTIME_URL
          value: {{ include "appa-demo.runtimeUrl" . | quote }}
        - name: APPA_KAGENT_OPENAI_REASONING_EFFORT
          value: {{ .Values.runtime.reasoningEffort | quote }}
{{- end }}
