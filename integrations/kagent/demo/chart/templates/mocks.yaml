# Deterministic implementations used only by the demo policy template.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appa-demo-mocks
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "appa-demo.labels" . | nindent 4 }}
    app: appa-demo-mocks
spec:
  replicas: 1
  selector:
    matchLabels: { app: appa-demo-mocks }
  template:
    metadata:
      labels: { app: appa-demo-mocks }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mocks
          image: {{ include "appa-demo.image" (dict "image" .Values.mocks.image "root" .) }}
          imagePullPolicy: {{ .Values.mocks.image.pullPolicy }}
          args: ["--approval-window", {{ .Values.mocks.approvalWindowSeconds | quote }}]
          env:
            - { name: PYTHONDONTWRITEBYTECODE, value: "1" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { name: mocks, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /healthz, port: mocks }
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: appa-demo-mocks
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "appa-demo.labels" . | nindent 4 }}
spec:
  selector: { app: appa-demo-mocks }
  ports:
    - { name: mocks, port: 8081, targetPort: mocks }
