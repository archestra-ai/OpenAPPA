# The agents' model. The Secret is named after this ModelConfig on purpose:
# the kagent dashboard's Edit flow writes the key to exactly that name, so
# an install without a key is completed from the UI.
apiVersion: kagent.dev/v1alpha2
kind: ModelConfig
metadata:
  name: {{ .Values.modelConfig.name | quote }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "appa-demo.labels" . | nindent 4 }}
spec:
  provider: OpenAI
  model: {{ .Values.openai.model | quote }}
  apiKeySecret: {{ include "appa-demo.secretName" . | quote }}
  apiKeySecretKey: OPENAI_API_KEY
  {{- if .Values.openai.baseUrl }}
  # kagent hands this to the OpenAI client as base_url.
  openAI:
    baseUrl: {{ .Values.openai.baseUrl | quote }}
  {{- end }}
