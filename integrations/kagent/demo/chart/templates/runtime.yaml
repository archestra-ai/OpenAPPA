# The shared appa-runtime pod: the runtime serves agents directly while
# the mock externals answer the policy's URL bindings over pod loopback.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: appa-runtime
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "appa-demo.labels" . | nindent 4 }}
    app: appa-runtime
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: appa-runtime }
  template:
    metadata:
      labels:
        app: appa-runtime
      annotations:
        checksum/policy: {{ include "appa-demo.policy" . | sha256sum | quote }}
    spec:
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
      {{- if and .Values.runtime.persistence.enabled .Values.runtime.persistence.migrateOwnership }}
      initContainers:
        - name: migrate-data-ownership
          image: {{ include "appa-demo.image" (dict "image" .Values.runtime.image "root" .) }}
          imagePullPolicy: {{ .Values.runtime.image.pullPolicy }}
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
              add: [CHOWN, FOWNER]
          command: ["/bin/sh", "-ec", "chown -R 65532:65532 /var/lib/appa && chmod -R u+rwX /var/lib/appa"]
          volumeMounts:
            - { name: data, mountPath: /var/lib/appa }
      {{- end }}
      containers:
        - name: runtime
          image: {{ include "appa-demo.image" (dict "image" .Values.runtime.image "root" .) }}
          imagePullPolicy: {{ .Values.runtime.image.pullPolicy }}
          command:
            - /usr/local/bin/appa
            - runtime
            - --adapter
            - kagent
            - --config
            - /etc/appa/demo.appa.toml
            - --db
            - /var/lib/appa/appa.db
            - --listen
            - 0.0.0.0:18787
            - --mcp-allowed-host
            - {{ printf "appa-runtime.%s.svc.cluster.local:18787" .Release.Namespace | quote }}
            {{- if .Values.runtime.persistence.enabled }}
            - --batteries-dir
            - /var/lib/appa/batteries
            - --batteries-dir
            - /var/lib/appa/release-batteries
            {{- end }}
            - --batteries-dir
            - /opt/appa/batteries
            {{- if .Values.runtime.verbosity }}
            - {{ .Values.runtime.verbosity }}
            {{- end }}
          env:
            - name: APPA_CONFIG
              value: "/etc/appa/demo.appa.toml"
            - name: APPA_BATTERIES_DIR
              {{- if .Values.runtime.persistence.enabled }}
              value: /var/lib/appa/batteries:/var/lib/appa/release-batteries:/opt/appa/batteries
              {{- else }}
              value: /opt/appa/batteries
              {{- end }}
            - name: APPA_GUIDE_RUNTIME_URL
              value: http://127.0.0.1:18787
            - name: APPA_LLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "appa-demo.secretName" . | quote }}
                  key: OPENAI_API_KEY
          ports:
            - { name: runtime, containerPort: 18787 }
          startupProbe:
            httpGet: { path: /health, port: runtime }
            failureThreshold: 30
            periodSeconds: 2
          readinessProbe:
            httpGet: { path: /health, port: runtime }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: runtime }
            periodSeconds: 20
          volumeMounts:
            - { name: policy, mountPath: /etc/appa, readOnly: true }
            - { name: data, mountPath: /var/lib/appa }
            - { name: runtime-identity, mountPath: /var/run/appa/identity, readOnly: true }
        - name: mocks
          image: {{ include "appa-demo.image" (dict "image" .Values.mocks.image "root" .) }}
          imagePullPolicy: {{ .Values.mocks.image.pullPolicy }}
          args: ["--approval-window", {{ .Values.mocks.approvalWindowSeconds | quote }}]
          ports:
            - { name: mocks, containerPort: 8081 }
          readinessProbe:
            httpGet: { path: /healthz, port: mocks }
            periodSeconds: 5
      volumes:
        - name: policy
          configMap: { name: appa-runtime-policy }
        - name: data
          {{- if .Values.runtime.persistence.enabled }}
          persistentVolumeClaim: { claimName: {{ .Values.runtime.persistence.existingClaim | default "appa-runtime-data" | quote }} }
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: runtime-identity
          downwardAPI:
            items:
              - { path: pod-name, fieldRef: { fieldPath: metadata.name } }
              - { path: namespace, fieldRef: { fieldPath: metadata.namespace } }
---
apiVersion: v1
kind: Service
metadata:
  name: appa-runtime
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "appa-demo.labels" . | nindent 4 }}
spec:
  selector: { app: appa-runtime }
  ports:
    - { name: runtime, port: 18787, targetPort: runtime }
---
# The mocks' side channel (the change board's /pending and /decide), for a
# board member — or the e2e matrices — outside the pod.
apiVersion: v1
kind: Service
metadata:
  name: appa-demo-mocks
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "appa-demo.labels" . | nindent 4 }}
spec:
  selector: { app: appa-runtime }
  ports:
    - { name: mocks, port: 8081, targetPort: mocks }
{{- if and .Values.runtime.persistence.enabled (not .Values.runtime.persistence.existingClaim) }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: appa-runtime-data
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "appa-demo.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.runtime.persistence.size }}
  {{- if .Values.runtime.persistence.storageClass }}
  storageClassName: {{ .Values.runtime.persistence.storageClass | quote }}
  {{- end }}
{{- end }}
