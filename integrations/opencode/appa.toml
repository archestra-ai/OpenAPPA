# Starting policy for AppenCode, not a general-purpose coding policy.
# Undeclared tools, Code Mode and native subagents are refused.
[policy]
version = 2

[[policy.tool]]
name = "host/opencode/appa_subagent"

[[policy.tool]]
name = "host/opencode/appa_collect"

[[policy.tool]]
name = "host/opencode/appa_cancel"

# --- files carry labels: the file-tracker reads and writes them ---

# The file-tracker is both the Annotator and the recorder of every file tool.
# As a recorder it keeps, on each file a released call wrote, the label that
# call published: the session's label, met with what the call forwards and
# brings back. As an Annotator it returns that label when a later call, in
# this session or another, reads the file. Its built-in path rules classify
# credentials (`.env*`, `~/.ssh/*`, ...) as `self` and require a trusted
# session to write instructions and hooks, before any call touches them. The
# person running the session adds rules in `~/.config/appa/file-tracker.toml`,
# which AppenCode's sandbox reads too. The plugin's root policy binds the
# file-tracker to `appa file-tracker`. Those path rules decide which writes need
# a trusted session: a write to an ordinary file needs none, because nothing
# later obeys or runs it before a person reads it.
[[policy.annotator]]
name = "file-tracker"

[[policy.tool]]
name = "host/opencode/read"
annotator = "file-tracker"
recorder = "file-tracker"

[[policy.tool]]
name = "host/opencode/write"
annotator = "file-tracker"
recorder = "file-tracker"

[[policy.tool]]
name = "host/opencode/edit"
annotator = "file-tracker"
recorder = "file-tracker"

# A shell command declares the files it reads and writes and the hosts it
# reaches. AppenCode runs appa_safebash with `appa file-tracker run`, which
# confines it to exactly those in Anthropic's sandbox runtime `srt`, as
# `clappa` confines Claude Code's Bash. A command the person types
# at the prompt (`!`) runs confined to the project, with no host and no file
# whose label restricts its audience. OpenCode's native shell and grep, which
# read files out of the file-tracker's sight, are not available.
#
# A call that names a host sends what the session holds to it, so the data
# must be public; what comes back was written by strangers, so it is
# `suspicious`. A host rule in the root policy is read first and can say
# otherwise for a host the deployment knows.
#
# A package install reaches its registry, which serves public packages and is
# told only which ones the command fetches: a call whose hosts are all one
# registry's runs as a call without hosts does. A selector matches a list when
# every entry matches one of its `|` alternatives. `upload.pypi.org`, where
# packages are published, is not one of them and takes the rule for any host.
# A command that names a host can install or fetch code it chooses, so it
# requires a trusted session; one that names none runs only what is already on
# this machine, and the file-tracker's path rules gate what it writes.
[[policy.tool]]
name = "host/opencode/appa_safebash(network_hosts:registry.npmjs.org)"
annotator = "file-tracker"
recorder = "file-tracker"
requires = { trust = "trusted" }

[[policy.tool]]
name = "host/opencode/appa_safebash(network_hosts:registry.yarnpkg.com)"
annotator = "file-tracker"
recorder = "file-tracker"
requires = { trust = "trusted" }

[[policy.tool]]
name = "host/opencode/appa_safebash(network_hosts:*.golang.org)"
annotator = "file-tracker"
recorder = "file-tracker"
requires = { trust = "trusted" }

[[policy.tool]]
name = "host/opencode/appa_safebash(network_hosts:*.crates.io)"
annotator = "file-tracker"
recorder = "file-tracker"
requires = { trust = "trusted" }

[[policy.tool]]
name = "host/opencode/appa_safebash(network_hosts:pypi.org|files.pythonhosted.org)"
annotator = "file-tracker"
recorder = "file-tracker"
requires = { trust = "trusted" }

[[policy.tool]]
name = "host/opencode/appa_safebash(network_hosts:*)"
annotator = "file-tracker"
recorder = "file-tracker"
requires = { trust = "trusted", audience = { contains = ["public"] } }
delta = { trust = "suspicious" }

[[policy.tool]]
name = "host/opencode/appa_safebash"
annotator = "file-tracker"
recorder = "file-tracker"

[[policy.tool]]
name = "host/opencode/webfetch"
requires = { audience = { contains = ["public"] } }
delta = { trust = "suspicious" }

[[policy.tool]]
name = "host/opencode/websearch"
delta = { trust = "suspicious" }

[externals.annotators.file-tracker]
command = ["appa", "file-tracker", "annotate"]

[externals.recorders.file-tracker]
command = ["appa", "file-tracker", "record"]

[policy.deployment]
context_control = true

[externals]
timeout_ms = 2000
max_body_bytes = 65536
