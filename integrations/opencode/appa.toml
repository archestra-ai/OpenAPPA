# Starting policy for AppenCode, not a general-purpose coding policy.
# Undeclared tools, Code Mode and native subagents are refused.
[policy]
version = 2

[[policy.tool]]
name = "host/opencode/appa_subagent"

[[policy.tool]]
name = "host/opencode/read(path:*/private/*)"
delta = { audience = ["internal"] }

[[policy.tool]]
name = "host/opencode/read"

[[policy.tool]]
name = "host/opencode/webfetch"
requires = { audience = { contains = ["public"] } }
delta = { trust = "suspicious" }

[[policy.tool]]
name = "host/opencode/websearch"
requires = { audience = { contains = ["public"] } }
delta = { trust = "suspicious" }

[[policy.tool]]
name = "host/opencode/write"
requires = { trust = "trusted" }

[[policy.tool]]
name = "host/opencode/edit"
requires = { trust = "trusted" }

# A command gate is not a filesystem or network sandbox. Permit only pwd here.
[[policy.tool]]
name = "host/opencode/shell(command:pwd)"
requires = { trust = "trusted", audience = { contains = ["public"] } }

[policy.deployment]
context_control = true

[externals]
timeout_ms = 2000
max_body_bytes = 65536
