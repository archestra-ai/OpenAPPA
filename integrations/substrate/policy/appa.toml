# The policy the egress enforcement point runs. The GitHub battery labels
# each repository read by who may read that repository, and lets a write
# into a repository carry only what that repository's readers may already
# see. Rules for other MCP servers go below the include.
include = ["batteries/github/appa.toml"]

[policy]
version = 2

[externals]
timeout_ms = 10000
max_body_bytes = 1048576

