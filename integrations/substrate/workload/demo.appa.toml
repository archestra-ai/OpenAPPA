# The demo actor's policy. The actor runs Claude Code with one MCP server,
# an Archestra MCP gateway named `archestra`, which serves Grain and GitHub
# tools under one hostname. Substrate's EgressPolicy can only allow or deny
# that hostname, so it cannot tell a meeting read from a public comment.
# This policy can: a Grain read narrows the session to `internal`, and a
# GitHub comment requires data that `public` may read.
#
# Claude Code spells a gateway tool `mcp__archestra__<server>__<tool>`; the
# Claude Code adapter splits at the first `__`, so the canonical id is
# `mcp/archestra/<server>__<tool>`.
#
# The policy offers no sanitizer and no authority for the comment: the
# refusal is final. A tool without a rule is refused, so the gateway's
# other tools stay closed.

[policy]
version = 2

# --- internal reads: meeting metadata only the organization may see ---

[[policy.tool]]
name = "mcp/archestra/grain__list_meetings"
delta = { audience = ["internal"] }

[[policy.tool]]
name = "mcp/archestra/grain__fetch_meeting"
delta = { audience = ["internal"] }

# --- the public sink: anyone can read a comment on a public issue ---

[[policy.tool]]
name = "mcp/archestra/github_copilot__add_issue_comment"
requires = { audience = { contains = ["public"] } }
delta = {}

# --- the runtime's own tools ---

[[policy.tool]]
name = "mcp/appa/read_peer_message"
delta = {}

[[policy.tool]]
name = "mcp/appa/yell"
requires = { audience = { contains = ["public"] } }
delta = {}

[externals]
timeout_ms = 5000
max_body_bytes = 65536
