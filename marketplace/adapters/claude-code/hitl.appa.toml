# `Task` is the earlier name of `Agent`: the same spawn, the same contract.
[[policy.tool]]
name = "host/claude-code/Task"
delta = {}

[[policy.tool]]
name = "host/claude-code/TaskCreate"
delta = {}

[[policy.tool]]
name = "host/claude-code/TaskGet"
delta = {}

[[policy.tool]]
name = "host/claude-code/TaskList"
delta = {}

[[policy.tool]]
name = "host/claude-code/TaskOutput"
delta = {}

[[policy.tool]]
name = "host/claude-code/TaskStop"
delta = {}

[[policy.tool]]
name = "host/claude-code/TaskUpdate"
delta = {}

[[policy.tool]]
name = "host/claude-code/TodoWrite"
delta = {}

[[policy.tool]]
name = "host/claude-code/ToolSearch"
