[[policy.tool]]
name = "host/claude-code/ReadMcpResourceDirTool"
delta = {}

[[policy.tool]]
name = "host/claude-code/ReadMcpResourceTool"
delta = {}

[[policy.tool]]
name = "host/claude-code/ReportFindings"
delta = {}

[[policy.tool]]
name = "host/claude-code/ScheduleWakeup"
delta = {}

[[policy.tool]]
name = "host/claude-code/SendMessage"
