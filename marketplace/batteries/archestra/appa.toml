# Archestra battery: the tools of Archestra's built-in MCP server.
#
# Every tool the server lists has a rule here, except the ones Archestra
# rules itself: `yell` (`mcp/appa/yell`), `run_tool` (ruled as the tool it
# runs), `execute_remedy_plan`, `get_remedy_plans`, `list_peer_messages`,
# `read_peer_message`, `preview_app_tool` (ruled as the app tool it runs) and
# the app-runtime tools no agent lists.
#
# Archestra's configuration, rosters, runs and files are the organization's,
# so a read of them adds `internal`. A read that returns text strangers can
# write, such as synced mail and tickets, a server's logs or a run's tool
# results, also adds `suspicious`. A write that changes what other people's
# agents run or read, or that removes or controls a shared resource,
# requires `trusted` data, so an injected instruction cannot choose it. A
# write that other members read also needs data the organization may read:
# `internal`.
#
# A share names who may read: the organization is `internal`, a team is
# `@archestra:team/<team>`, a member is `@archestra:user/<user>`. A tool
# that takes a list of teams names one collection per team, and OpenAPPA
# reads at most 100 teams per call. An update that sends a team list
# replaces who the resource is shared with, so `(team_ids:*)` checks a sent
# list even without a visibility. Every rule of such a tool declares its
# lists as arrays of strings, so a malformed list is refused rather than
# read as no list.
#
# The Archestra proxy adds two string-array arguments before evaluation,
# since no selector reads an array of objects: `initialGrantPrincipals`
# names each principal of a sent `initialGrants` as `<type>:<id>`, and
# `transferModes` names each transferred credential `value` or `link`. A
# create that sends grants requires `internal`, which holds every principal
# a grant can name.
#
# The root config maps `internal` onto the `archestra` audience source,
# which resolves each collection through Archestra's own API. The README
# shows the wiring.

[policy]
version = 2

# --- discovery and the session's own surfaces: listing tools and files,
# loading a skill, asking the user, the todo list and the agent's own name ---

