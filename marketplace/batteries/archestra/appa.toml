# --- agent runs: a run and its workspace are one container the
# organization may read, since admins can open any run. What enters it,
# a run's message or a workspace file, must be sharable with `internal`;
# what leaves it, a run's result or a workspace file, adds `internal`.
# This holds on every host: a host without the LLM Proxy's proof starts
# and reads a run as a plain tool call, with no crossing of its own. A
# cancel returns only the run's state. A list names the organization's
# agents, requesters, and channels ---

[[policy.tool]]
