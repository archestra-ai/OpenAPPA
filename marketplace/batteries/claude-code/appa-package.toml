schema = 1
name = "claude-code"
description = "Claude Code tool rules: Read, Write and Edit labeled per file by the file-tracker, shell commands only as SafeBash, the coding battery's web rules bound to WebFetch and WebSearch, and rules for the built-in tools only Claude Code offers."

[battery]
policy = "appa.toml"
hosts = ["claude-code"]
namespaces = ["claude-code", "file-tracker"]
helpers = []
benefit = "Keeps a label on every file Claude Code reads or writes, across sessions, confines shell commands to the files and hosts they declare, and covers the session, plan, task and messaging tools only Claude Code offers."

[battery.targets.single-user]
policy = "appa.toml"

[battery.targets.multi-user]
policy = "appa.toml"
