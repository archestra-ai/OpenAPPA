schema = 1
name = "claude-code"
description = "Static Claude Code tool rules: credential paths and commands narrow to self, writes into them require a trusted session, and Bash results remain confined for sanitization. The Unix default root supplies the Bash Annotator."

[battery]
policy = "appa.toml"
hosts = ["claude-code"]
namespaces = ["claude-code"]
helpers = ["repository.py"]
