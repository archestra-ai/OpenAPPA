# --- Write and Edit: the requester's secrets and the harness are sinks ---

# Writing into a credential path, or into a file a later process reads as
# instructions or runs as code (CLAUDE.md, skills, agents, commands, git hooks,
# shell startup files, launch agents), requires a `trusted` session: content
# that arrived at `suspicious`, from a web page or an unvetted command, lands
# there only when the person running the session approves the exact call. The
# files that can turn the protection off ask that person every time: the
# harness's settings and hooks, its MCP server list, and the deployment's
# policy. A selector matches the path as written and is case-sensitive, so
# a write through a symlink or an alias reads under its written name. Every
# other path takes the session's label as it is.
[[policy.tool]]
name = "host/claude-code/Write(file_path:*/.claude/settings*)"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Write(file_path:.claude/settings*)"
requires = { attention = ["hitl"] }
delta = {}

