# Optional Claude Code rules for Bash and Read.
#
# Order matters: the first matching rule wins, so the argument-selected
# credential rules come before the bare `Bash` and `Read` rules. A name written
# with a selector is declared, and a call no selector matches is refused rather
# than sent to a root's `*` fallback, so the bare rules at the end of each
# group are what keep ordinary commands and reads running.

[policy]
version = 2

# --- Bash: commands naming requester credentials require token-exposed ---

# We have no good sanitizer for tokens at the moment. A command naming a
# credential path requires the `token-exposed` mark. Because no authority
# permits `token-exposed` today and no token sanitizer yet covers it, the call
# is refused before secrets reach the model. In the future, a token sanitizer
# can permit `token-exposed` by redacting or masking values.
[[policy.tool]]
name = "host/claude-code/Bash(command:*.env*)"
requires = { attention = ["token-exposed"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*.claude.json*)"
requires = { attention = ["token-exposed"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*.credentials.json*)"
requires = { attention = ["token-exposed"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*.ssh/*)"
requires = { attention = ["token-exposed"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*.aws/credentials*)"
requires = { attention = ["token-exposed"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*.netrc*)"
requires = { attention = ["token-exposed"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*.config/gh/hosts.yml*)"
requires = { attention = ["token-exposed"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*id_rsa*)"
requires = { attention = ["token-exposed"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*id_ed25519*)"
requires = { attention = ["token-exposed"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*/proc/*environ*)"
requires = { attention = ["token-exposed"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*/Library/Keychains/*)"
requires = { attention = ["token-exposed"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*.docker/config.json*)"
requires = { attention = ["token-exposed"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*.git-credentials*)"
requires = { attention = ["token-exposed"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*.kube/*)"
requires = { attention = ["token-exposed"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*.npmrc*)"
requires = { attention = ["token-exposed"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Bash(command:*.pypirc*)"
requires = { attention = ["token-exposed"] }
delta = {}

# The default model Annotator generates every other command's complete contract
# before dispatch: its output trust rank and required trust and review marks.
# To customize the `hint` without modifying this battery, declare an Annotator
# with the same name in the root config. `audiences = []` closes the mandate to
# `public`: an annotation names literal readers only, never `self` or `internal`,
# so static rules control who may see command output.
[[policy.annotator]]
name = "claude-code.bash-requirements"
builtin = "claude-code"
audiences = []
hint = "Treat network or otherwise unvetted output as suspicious. Classify trust and audience requirements from the command's visible behavior and destination."

[[policy.tool]]
name = "host/claude-code/Bash"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-requirements"

# --- Read: the requester's own secrets are `self` data ---

# Reading a credential file, a private key, or a system secret location
# narrows the session to `self`. A selector matches the argument as written,
# absolute (`*/.ssh/*`) or relative (`.ssh/*`), not the resolved path or its
# case, so a symlink or an alias (`~`, `..`) to one of these reads under its
# written name. Hidden names are listed one by one: a selector for every
# dot-prefixed path would also match `./src/main.rs`. Every other path keeps
# the session's label. No rule blocks a read or lowers its trust.
[[policy.tool]]
name = "host/claude-code/Read(file_path:*/.env*)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "host/claude-code/Read(file_path:.env*)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "host/claude-code/Read(file_path:*/.ssh/*)"
delta = { audience = ["self"] }

[[policy.tool]]
