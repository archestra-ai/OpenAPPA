# Claude Code rules: the map that binds the `coding` battery's canonical tools
# to Claude Code's own, then the built-in tools only Claude Code offers. The
# built-in tool set varies by Claude Code version; regenerate the list from a
# live session when it drifts. Include the `coding` battery beside this one.

# Claude Code spells each argument as the canonical tools do. Bash and
# PowerShell results stay confined so the `coding` battery's `redact-secrets`
# sanitizer can mask them.
[aliases.tool.coding]
shell = [{ name = "host/claude-code/Bash", args = { command = "command" }, confined = true }]
powershell = [{ name = "host/claude-code/PowerShell", args = { command = "command" }, confined = true }]
read_file = [{ name = "host/claude-code/Read", args = { file_path = "file_path" } }]
search_files = [{ name = "host/claude-code/Grep", args = { path = "path" } }]
write_file = [{ name = "host/claude-code/Write", args = { file_path = "file_path" } }]
edit_file = [{ name = "host/claude-code/Edit", args = { file_path = "file_path" } }]
fetch_url = [{ name = "host/claude-code/WebFetch", args = { url = "url" } }]
web_search = [{ name = "host/claude-code/WebSearch" }]


[policy]
version = 2

# Monitor runs a shell command, or opens a WebSocket, and its output reaches
# the model as later notifications that no tool result carries. Its Annotator
# labels the call before it runs, as the `coding` battery's shell Annotator does.
[[policy.annotator]]
name = "claude-code.monitor-requirements"
builtin = "claude-code"

[[policy.tool]]
name = "host/claude-code/Monitor"
description = "Runs a shell command or opens a WebSocket and streams each output line to the agent."
annotator = "claude-code.monitor-requirements"

# --- tools whose results stay inside the session's trust boundary ---

[[policy.tool]]
name = "host/claude-code/AskUserQuestion"
delta = {}

