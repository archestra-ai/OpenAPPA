# The Databricks CLI prints the login's own credential on request, and its
# profile file holds tokens; `configure` writes one there. The CLI takes its
# global flags anywhere (`databricks --profile dev auth token`), so the
# verb is matched after `databricks` with anything between. A selector is a
# substring of the command line, so a spelling these miss (the command
# inside `$(...)`, a heredoc, an alias) reaches the Unix root's Bash
# Annotator; without it, the call remains fail-closed.
[[policy.tool]]
name = "host/claude-code/Bash(command:*.databrickscfg*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*databricks*auth token*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*databricks*auth env*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*databricks*secrets get-secret*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*databricks*configure*)"
delta = { audience = ["self"] }
tags = ["credentials"]

# The Unix root policy declares the Bash publishing selectors, their
# repository input, and the general Bash Annotator. Off Unix, those calls
# have no matching declaration and remain fail-closed.

# The stock `redact-secrets` sanitizer masks private-key blocks, tokens of
# well-known shapes, the AWS secret access key, the value of any assignment
# whose key names a secret, and long high-entropy runs. It carries no tags, so
# it is offered for every withheld Bash result the session cannot read as it
# is, whether a static `credentials` rule or the Annotator narrowed it: an
# Annotator's answer cannot tag a call, so a tagged sanitizer would never reach
# a command the static rules do not name. Without tags it is also offered for a
# subagent's return.
[[policy.sanitizer]]
name = "redact-secrets"
on = ["tool_output"]

[policy.sanitizer.permits]
audience = { from = ["self"], to = ["public"] }

# The battery withholds its own tool's result so the sanitizer can run on it.
[policy.deployment]
confined_results = ["host/claude-code/Bash"]

[externals.sanitizers.redact-secrets]
builtin = "redact-secrets"

# --- Read: the requester's own secrets are `self` data ---

