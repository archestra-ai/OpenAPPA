# Optional Claude Code rules for Bash, Read, Grep, Write and Edit.
#
# Order matters: the first matching rule wins, so the argument-selected
# credential rules come before each tool's bare rule. A name written
# with a selector is declared, and a call no selector matches is refused rather
# than sent to a root's `*` fallback, so the bare rules at the end of each
# group are what keep ordinary commands, reads, searches and writes running.

[policy]
version = 2

# --- Bash: commands naming requester credentials are `self` data, masked ---

# A command naming a credential path narrows the session to `self`, the
# requester. The battery withholds the command's result (`confined_results`
# below) and the `redact-secrets` sanitizer masks every token before the
# output reaches the model and returns the value to `public`: the session
# keeps its label and the masked text is what the model reads. The `credentials`
# tag records why a rule is here; the sanitizer is not scoped to it.
[[policy.tool]]
name = "host/claude-code/Bash(command:*.env*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.claude.json*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.credentials.json*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.ssh/*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.aws/credentials*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.netrc*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.config/gh/hosts.yml*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*id_rsa*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*id_ed25519*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*/proc/*environ*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*/Library/Keychains/*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.docker/config.json*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.git-credentials*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.kube/*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.npmrc*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.pypirc*)"
delta = { audience = ["self"] }
tags = ["credentials"]

# The Databricks CLI prints the login's own credential on request, and its
# profile file holds tokens; `configure` writes one there. The CLI takes its
# global flags anywhere (`databricks --profile dev auth token`), so the
# verb is matched after `databricks` with anything between. A selector is a
# substring of the command line, so a spelling these miss (the command
# inside `$(...)`, a heredoc, an alias) is classified by the Bash annotator
# below like any other command; nothing here promises full recall.
[[policy.tool]]
name = "host/claude-code/Bash(command:*.databrickscfg*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*databricks*auth token*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*databricks*auth env*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*databricks*secrets get-secret*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*databricks*configure*)"
delta = { audience = ["self"] }
tags = ["credentials"]

# --- Bash: a push or a GitHub CLI call reaches the repository's readers ---

# Who reads what a `git push` or a `gh` call puts on GitHub is the repository's
# own visibility, which the command line does not say. Before the Annotator is
# asked, `repository.py` establishes it: every repository the command's `git
# push` and `gh` calls name, else the checkout's own in the directory the
# harness would run the command in, asked of the GitHub CLI's login; several
# answer the most widely readable. The Annotator reads the finding under
# `repository` and requires the readers it implies; a repository it could not
# establish, or a call it cannot follow, reads as `null` with a reason, and
# the Annotator treats an unestablished destination as public.
[[policy.annotator]]
name = "claude-code.bash-repository-requirements"
builtin = "claude-code"
inputs = { call = "$tool_call", repository = "$input.claude-code.repository" }
hint = "`repository` is the deployment's own finding: the GitHub repository the command reaches, with its `visibility`, or `null` with a `reason`. A push, pull request, issue, release, or comment into a public repository, or into one not established, requires audience public; into a private or internal one requires audience internal. A read keeps the session's audience."

[[policy.tool]]
name = "host/claude-code/Bash(command:*git push*)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh pr *)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh issue *)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh release *)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh api *)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh repo *)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[externals.inputs."claude-code.repository"]
command = ["python3", "repository.py"]

# The stock `redact-secrets` sanitizer masks private-key blocks, tokens of
# well-known shapes, the AWS secret access key, the value of any assignment
# whose key names a secret, and long high-entropy runs. It carries no tags, so
# it is offered for every withheld Bash result the session cannot read as it
# is, whether a static `credentials` rule or the Annotator narrowed it: an
# Annotator's answer cannot tag a call, so a tagged sanitizer would never reach
# a command the static rules do not name. Without tags it is also offered for a
# subagent's return.
[[policy.sanitizer]]
name = "redact-secrets"
on = ["tool_output"]

[policy.sanitizer.permits]
audience = { from = ["self"], to = ["public"] }

# The battery withholds its own tool's result so the sanitizer can run on it.
[policy.deployment]
confined_results = ["host/claude-code/Bash"]

[externals.sanitizers.redact-secrets]
builtin = "redact-secrets"

# The default model Annotator generates every other command's complete contract
# before dispatch: its output label, required trust, review marks, and effects.
# How it classifies — the runtime's label guide: trust by who wrote the
# returned text, audience by the visible destination, with worked examples —
# is the same for every model Annotator.
# A `hint` carries what only this deployment knows: which hosts are its own,
# which paths hold whose data. To add one without modifying this battery,
# declare an Annotator with the same name in the root config. `audiences` is
# left omitted, so an annotation may narrow command output to `self` or
# `internal`, or require a reader the policy names — the same vocabulary a
# static rule writes.
[[policy.annotator]]
name = "claude-code.bash-requirements"
builtin = "claude-code"

[[policy.tool]]
name = "host/claude-code/Bash"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-requirements"

# --- Read: the requester's own secrets are `self` data ---

# Reading a credential file, a private key, or a system secret location
# narrows the session to `self`. A selector matches the argument as written,
# absolute (`*/.ssh/*`) or relative (`.ssh/*`), not the resolved path or its
# case, so a symlink or an alias (`~`, `..`) to one of these reads under its
# written name. Hidden names are listed one by one: a selector for every
# dot-prefixed path would also match `./src/main.rs`. Every other path keeps
# the session's label. No rule blocks a read or lowers its trust.
[[policy.tool]]
name = "host/claude-code/Read(file_path:*/.env*)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "host/claude-code/Read(file_path:.env*)"
