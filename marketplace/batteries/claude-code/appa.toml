# --- Grep: the content of the requester's secrets is `self` data ---

# Grep returns matching lines when asked for content, and which files match
# otherwise, so a search inside a credential path is a read of it: the same
# paths as the Read rules narrow the session to `self`. A search over a
# directory that happens to hold one of these files is not matched; only the
# path as written is.
[[policy.tool]]
