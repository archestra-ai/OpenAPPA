delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*databricks*configure*)"
delta = { audience = ["self"] }
tags = ["credentials"]

# --- Bash: publishing selectors, then every other command ---

# A command no credential selector above names is labeled per call. The GitHub
# battery's context provider, when installed, tells the repository Annotator
# which repository a command reaches and who wrote what it reads.
[[policy.annotator]]
name = "claude-code.bash-repository-requirements"
builtin = "claude-code"
hint = "`context.github` is the deployment's finding about the repository and pull request or issue the command reaches. A push, pull request, issue, release, or comment into a public repository, or one it does not establish, requires audience public; into a private or internal one, internal. A read keeps the session's audience."

[[policy.tool]]
name = "host/claude-code/Bash(command:*git push*)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

# Options between `git` and `push`, such as `git -C sub push`.
[[policy.tool]]
name = "host/claude-code/Bash(command:*git -* push*)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh pr *)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh issue *)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh release *)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh api *)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh repo *)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

# How a model Annotator classifies — trust by who wrote the returned text,
# audience by the visible destination — is the runtime's. Add a `hint` with
# what only this deployment knows: which hosts are its own and which paths hold
# whose data. The mandate leaves `audiences` omitted, so it may name readers.
[[policy.annotator]]
name = "claude-code.bash-requirements"
builtin = "claude-code"

[[policy.tool]]
name = "host/claude-code/Bash"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-requirements"

# Monitor runs a shell command, or opens a WebSocket, and its output reaches
# the model as later notifications that no tool result carries. Its Annotator
# labels the call before it runs.
[[policy.tool]]
name = "host/claude-code/Monitor"
description = "Runs a shell command or opens a WebSocket and streams each output line to the agent."
annotator = "claude-code.bash-requirements"


# --- PowerShell: the Bash rules, spelled for Windows ---

