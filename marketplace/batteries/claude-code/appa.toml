# Claude Code rules: the map that binds the `coding` battery's canonical web
# tools to Claude Code's own, Claude Code's file tools routed through the
# file-tracker, and the built-in tools only Claude Code offers. The built-in
# tool set varies by Claude Code version; regenerate the list from a live
# session when it drifts. Include the `coding` battery beside this one.

[aliases.tool.coding]
fetch_url = [{ name = "host/claude-code/WebFetch", args = { url = "url" } }]
web_search = [{ name = "host/claude-code/WebSearch" }]


[policy]
version = 2

# --- files carry labels: the file-tracker reads and writes them ---

# The file-tracker is both the Annotator and the recorder of every file tool.
# As a recorder it receives the label each released call published (the
# session's label, met with what the call forwards and brings back) and keeps
# it on the files the call wrote. As an Annotator it returns that label when a
# later call, in this session or another, reads the file. Its built-in path
# rules classify credentials (`.env*`, `~/.ssh/*`, ...) as `self`, and require
# a trusted session to write instructions, hooks and shell profiles, before
# any call touches them. The person running the session adds rules in
# `~/.config/appa/file-tracker.toml`. The plugin's root policy binds the
# file-tracker to `appa file-tracker`.
[[policy.annotator]]
name = "file-tracker"

[[policy.tool]]
name = "host/claude-code/Read"
annotator = "file-tracker"
recorder = "file-tracker"

[[policy.tool]]
name = "host/claude-code/Write"
annotator = "file-tracker"
recorder = "file-tracker"

[[policy.tool]]
name = "host/claude-code/Edit"
annotator = "file-tracker"
recorder = "file-tracker"

# A shell command runs only as SafeBash, which the file-tracker serves over
# MCP: the command declares the files it reads and writes and the hosts it
# reaches, and a sandbox confines it to exactly those: bubblewrap on Linux for
# a command that declares no host, Anthropic's sandbox runtime `srt` otherwise.
[[policy.tool]]
name = "mcp/file-tracker/SafeBash"
annotator = "file-tracker"
recorder = "file-tracker"

# --- unmediated execution and content reads: no file label reaches them ---

# These tools run commands, or read or write file content, out of the
# file-tracker's sight. `clappa` starts Claude Code with them disabled; these
# rules refuse them at the hook too, so a session started some other way
# cannot run them either.
[[policy.tool]]
name = "host/claude-code/Bash"
requires = { attention = ["blocked"] }

[[policy.tool]]
name = "host/claude-code/PowerShell"
requires = { attention = ["blocked"] }

[[policy.tool]]
name = "host/claude-code/Monitor"
requires = { attention = ["blocked"] }

[[policy.tool]]
name = "host/claude-code/Grep"
requires = { attention = ["blocked"] }

[[policy.tool]]
name = "host/claude-code/NotebookEdit"
requires = { attention = ["blocked"] }

# --- tools whose results stay inside the session's trust boundary ---

[[policy.tool]]
name = "host/claude-code/AskUserQuestion"
