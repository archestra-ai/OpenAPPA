# --- Write and Edit: the requester's secrets and the harness are sinks ---

# Writing into a credential path requires a `trusted` session: content that
# arrived at `suspicious`, from a web page or an unvetted command, reaches a
# file the next process trusts only when the person running the session
# approves the exact call. The harness's own settings, where the protecting
# hooks are registered, and the deployment's policy ask that person every
# time. Every other path takes the session's label as it is.
[[policy.tool]]
name = "host/claude-code/Write(file_path:*/.claude/settings*)"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Write(file_path:.claude/settings*)"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Write(file_path:*/appa/appa.toml)"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Write(file_path:*/appa/batteries/*)"
requires = { attention = ["hitl"] }
delta = {}

[[policy.tool]]
name = "host/claude-code/Write(file_path:*/.env*)"
requires = { trust = "trusted" }
delta = {}

[[policy.tool]]
