# --- tools that bring outside content into the session ---

# An inbox message and a resource of any MCP server arrive without the label
# of whoever wrote them. GitHub notifications carry comments anyone can write.
[[policy.tool]]
name = "host/claude-code/FetchInboxMessage"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "host/claude-code/ReadMcpResourceTool"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "host/claude-code/ReadNotifications"
delta = { trust = "suspicious" }

# A claude.ai design-system project is shared with this user's organization.
[[policy.tool]]
name = "host/claude-code/DesignSync"
requires = { audience = { contains = ["internal"] } }
delta = {}

# A routine runs in a cloud session this policy does not protect, so its
# prompt may reach anyone. Run titles and logs quote what that session read
# from repositories, issues and web pages.
[[policy.tool]]
name = "host/claude-code/RemoteTrigger(action:list_runs)"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "host/claude-code/RemoteTrigger(action:get_run_log)"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "host/claude-code/RemoteTrigger(action:list)"
delta = {}

[[policy.tool]]
name = "host/claude-code/RemoteTrigger(action:get)"
delta = {}

[[policy.tool]]
name = "host/claude-code/RemoteTrigger"
requires = { audience = { contains = ["public"] } }
delta = {}

# A name may belong to any session, including one APPA does not protect, so a
# send is a public sink. A root whose runtime verifies protected peers precedes
# this rule with its exceptions for their addresses.
[[policy.tool]]
name = "host/claude-code/SendMessage"
requires = { audience = { contains = ["public"] } }
delta = {}
