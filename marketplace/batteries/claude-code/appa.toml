# Claude Code rules: the maps that bind the `coding` and `file-tracker`
# batteries' canonical tools to Claude Code's own, then the built-in tools only
# Claude Code offers. The built-in tool set varies by Claude Code version;
# regenerate the list from a live session when it drifts. Include the `coding`
# battery beside this one, and the `file-tracker` battery before both to keep a
# label on every file.

# Claude Code spells each argument as the canonical tools do. Bash and
# PowerShell results stay confined so a sanitizer the root declares can run
# on them. A root that binds `coding.strip-instructions` confines WebFetch
# itself. WebSearch stays unconfined: Claude Code's replacement of its result
# is not verified live.
[aliases.tool.coding]
shell = [{ name = "host/claude-code/Bash", args = { command = "command" }, confined = true }]
powershell = [{ name = "host/claude-code/PowerShell", args = { command = "command" }, confined = true }]
read_file = [{ name = "host/claude-code/Read", args = { file_path = "file_path" } }]
search_files = [{ name = "host/claude-code/Grep", args = { path = "path" } }]
write_file = [{ name = "host/claude-code/Write", args = { file_path = "file_path" } }]
edit_file = [{ name = "host/claude-code/Edit", args = { file_path = "file_path" } }]
fetch_url = [{ name = "host/claude-code/WebFetch", args = { url = "url" } }]
web_search = [{ name = "host/claude-code/WebSearch" }]

# The `file-tracker` battery's tools, where a deployment includes it. Its rules
# come first, so they decide the calls of every tool this map binds; Claude
# Code's Bash names the files and hosts a command reaches only under `clappa`.
# Without the battery, this map binds nothing and the `coding` rules decide.
[aliases.tool.file-tracker]
shell = [{ name = "host/claude-code/Bash", args = { network_hosts = "network_hosts" } }]
read = [{ name = "host/claude-code/Read" }]
write = [{ name = "host/claude-code/Write" }]
edit = [{ name = "host/claude-code/Edit" }]
unmediated = [
  { name = "host/claude-code/PowerShell" },
  { name = "host/claude-code/Monitor" },
  { name = "host/claude-code/Grep" },
  { name = "host/claude-code/NotebookEdit" },
]

[policy]
version = 2

# Monitor runs a shell command, or opens a WebSocket, and its output reaches
# the model as later notifications that no tool result carries. Its Annotator
# labels the call before it runs, as the `coding` battery's shell Annotator does.
[[policy.annotator]]
name = "claude-code.monitor-requirements"
builtin = "claude-code"

[[policy.tool]]
name = "host/claude-code/Monitor"
description = "Runs a shell command or opens a WebSocket and streams each output line to the agent."
annotator = "claude-code.monitor-requirements"

# --- tools whose results stay inside the session's trust boundary ---

[[policy.tool]]
name = "host/claude-code/AskUserQuestion"
delta = {}

