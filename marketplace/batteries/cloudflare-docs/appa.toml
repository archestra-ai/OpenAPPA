# Cloudflare documentation battery: Cloudflare's hosted documentation MCP
# server (`https://docs.mcp.cloudflare.com/mcp`), the `docs-ai-search` app of
# `cloudflare/mcp-server-cloudflare` at tag `docs-ai-search@0.4.13`.
#
# The server needs no credential and reaches no account. It lists two tools.
# `search_cloudflare_documentation` runs a semantic search over
# developers.cloudflare.com and returns page chunks with their URLs.
# `migrate_pages_to_workers_guide` fetches one fixed public page.
#
# Both results are pages of the public Cloudflare developer documentation:
# public data that anyone can read, written outside the trajectory, so both
# reads enter `suspicious` and leave the audience alone. The search sends the
# agent's `query` to Cloudflare's documentation index, which serves the public
# web, so the query must be sharable with `public`. The guide tool sends no
# argument, so it carries nothing out and needs no bound.
#
# The battery has no write, no effect, and no review mark.

[policy]
version = 2

[[policy.tool]]
name = "mcp/cloudflare-docs/search_cloudflare_documentation"
delta = { trust = "suspicious" }
requires = { audience = { contains = ["public"] } }

[[policy.tool]]
name = "mcp/cloudflare-docs/migrate_pages_to_workers_guide"
delta = { trust = "suspicious" }
