requires = { audience = { contains = ["internal"] } }

# --- scanning a URL: Cloudflare fetches it and publishes the scan ---

[[policy.tool]]
name = "mcp/cloudflare-radar/create_url_scan"
delta = {}
requires = { trust = "trusted", audience = { contains = ["public"] }, attention = ["cloudflare-radar-review"] }
effects = ["cloudflare-radar.sensitive"]
