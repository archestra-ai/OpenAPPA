# Cloudflare Radar battery: Cloudflare's hosted Radar MCP server
# (`https://radar.mcp.cloudflare.com/mcp`), the `radar` app of
# `cloudflare/mcp-server-cloudflare` at tag
# `cloudflare-radar-mcp-server@0.2.5`.
#
# The server lists 66 tools. 61 read Cloudflare Radar, the public Internet
# measurement dataset: traffic, outages, BGP, DNS, attacks, bots, certificate
# transparency, rankings. Radar publishes those results on
# radar.cloudflare.com and returns the same numbers to every caller, so each
# read returns `public` data. The data is measured outside the trajectory, so
# it enters `suspicious`. The arguments are filters - an ASN, a prefix, a date
# range, a location - sent to the account's own authenticated Cloudflare API,
# which only reads. No new reader sees them, so these reads need no audience
# bound.
#
# The other five tools are URL Scanner, which is account scoped: the token's
# account owns the scans. Four read them - `search_url_scans`, `get_url_scan`,
# `get_url_scan_screenshot` and `get_url_scan_har` - and return pages that
# third parties published, so they enter `suspicious` restricted to
# `internal`.
#
# `create_url_scan` is the one write. Cloudflare fetches the `url` the agent
# supplies, and the scan stays visible to everyone unless the call sets
# `visibility` to `Unlisted`. The URL therefore leaves for the public
# Internet: the call needs trusted data that `public` may see and the
# `cloudflare-radar-review` mark, and it records
# `cloudflare-radar.sensitive`. The root config supplies an authority
# permitting that mark.

[policy]
version = 2

# --- Radar: the public Internet measurement dataset ---

[[policy.tool]]
name = "mcp/cloudflare-radar/list_autonomous_systems"
delta = { trust = "suspicious" }

