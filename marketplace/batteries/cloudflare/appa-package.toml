schema = 1
name = "cloudflare"
description = "Rules for Cloudflare's documentation and Workers Observability MCP servers, one namespace bound to both: public documentation reads, internal logs, telemetry and Worker reads. No writes."

[battery]
policy = "appa.toml"
hosts = ["claude-code", "kagent"]
namespaces = ["cloudflare"]
helpers = []
benefit = "Rules for Cloudflare's documentation and Workers Observability servers: APPA keeps Worker logs, telemetry, and code internal and treats their text as suspicious. It covers no write tool."
setup = [
  "Bind each Cloudflare server you run: `appa battery install cloudflare --server <docs-server> --server <observability-server>`.",
  "If you run only one of the two servers, bind only that one.",
]
