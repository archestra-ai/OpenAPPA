# Rules for the tools every coding agent offers, written once for canonical
# tools: `shell`, `powershell`, `read_file`, `search_files`, `write_file`,
# `edit_file`, `fetch_url` and `web_search` under `tool/coding/`. A client
# battery's `[aliases.tool.coding]` map binds each canonical tool to the
# client's own tool and argument names; a rule no map binds is inactive.
#
# Order matters: the first matching rule wins, so the argument-selected
# credential rules come before each tool's bare rule. A name written
# with a selector is declared, and a call no selector matches is refused rather
# than sent to a root's `*` fallback, so the bare rules at the end of each
# group are what keep ordinary commands, reads, searches and writes running.


[policy]
version = 2

# --- shell: commands naming requester credentials are `self` data, masked ---

# A command naming a credential path narrows the session to `self`, the
# requester. A client's map entry withholds the command's result (`confined = true`)
# and the `redact-secrets` sanitizer masks every token before the
# output reaches the model and returns the value to `public`: the session
# keeps its label and the masked text is what the model reads. The `credentials`
# tag records why a rule is here; the sanitizer is not scoped to it.
[[policy.tool]]
name = "tool/coding/shell(command:*.env*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "tool/coding/shell(command:*.claude.json*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "tool/coding/shell(command:*.credentials.json*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "tool/coding/shell(command:*.ssh/*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "tool/coding/shell(command:*.aws/*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "tool/coding/shell(command:*.netrc*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "tool/coding/shell(command:*.config/gh/*)"
