# The stock `redact-secrets` sanitizer masks private-key blocks, tokens of
# well-known shapes, the AWS secret access key, the value of any assignment
# whose key names a secret, and long high-entropy runs. It carries no tags, so
# it is offered for every withheld Bash result the session cannot read as it
# is, whether a static `credentials` rule or the Annotator narrowed it: an
# Annotator's answer cannot tag a call, so a tagged sanitizer would never reach
# a command the static rules do not name. Without tags it is also offered for a
# subagent's return.
[[policy.sanitizer]]
name = "redact-secrets"
on = ["tool_output"]

[policy.sanitizer.permits]
audience = { from = ["self"], to = ["public"] }

[externals.sanitizers.redact-secrets]
builtin = "redact-secrets"

# --- read_file: the requester's own secrets are `self` data ---

# Reading a credential file, a private key, or a system secret location
# narrows the session to `self`. A selector matches the argument as written,
# absolute (`*/.ssh/*`) or relative (`.ssh/*`), not the resolved path or its
# case, so a symlink or an alias (`~`, `..`) to one of these reads under its
# written name. Hidden names are listed one by one: a selector for every
# dot-prefixed path would also match `./src/main.rs`. Every other path keeps
# the session's label. No rule blocks a read or lowers its trust.
[[policy.tool]]
name = "tool/coding/read_file(file_path:*/.env*)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "tool/coding/read_file(file_path:.env*)"
delta = { audience = ["self"] }

[[policy.tool]]
name = "tool/coding/read_file(file_path:*/.ssh/*)"
