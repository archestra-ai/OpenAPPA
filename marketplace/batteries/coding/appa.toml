annotator = "claude-code.bash-repository-requirements"

# How a model Annotator classifies — trust by who wrote the returned text,
# audience by the visible destination — is the runtime's. What only this
# deployment knows — which hosts are its own and which paths hold whose data —
# belongs in the root's `[policy.deployment] hint`. The mandate leaves `audiences` omitted, so it may name readers.
[[policy.annotator]]
name = "claude-code.bash-requirements"
builtin = "claude-code"

[[policy.tool]]
name = "tool/coding/shell"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-requirements"


# --- powershell: the shell rules, spelled for Windows ---

# Claude Code on Windows offers PowerShell beside Bash, with the same `command`
# argument and result. PowerShell takes either path separator, so each
# directory rule is written for both; `\\` is one literal backslash in a
# selector. The Windows homes of the GitHub CLI and gcloud configs, the
# CredentialManager module's `Get-StoredCredential` and SecretManagement's
# `Get-Secret` are named here too, and `/proc/*/environ` for a WSL command. A
# selector matches case-sensitively, so another spelling reaches the Annotator.
[[policy.tool]]
name = 'tool/coding/powershell(command:* .env)'
delta = { audience = ["self"] }
