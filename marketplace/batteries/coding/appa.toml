# Rules for the tools every coding agent offers, written once for canonical
# tools: `shell`, `powershell`, `read_file`, `search_files`, `write_file`,
# `edit_file`, `fetch_url` and `web_search` under `tool/coding/`. A client
# battery's `[aliases.tool.coding]` map binds each canonical tool to the
# client's own tool and argument names; a rule no map binds is inactive.
#
# Order matters: the first matching rule wins, so the argument-selected
# credential rules come before each tool's bare rule. A name written
# with a selector is declared, and a call no selector matches is refused rather
# than sent to a root's `*` fallback, so the bare rules at the end of each
# group are what keep ordinary commands, reads, searches and writes running.


[policy]
version = 2

# --- shell: commands naming requester credentials are `self` data ---

# A command naming a credential path narrows the session to `self`, the
# requester. The `credentials` tag scopes `coding.strip-secrets` to these
# rules: a client's map withholds the result (`confined = true`), and the
# sanitizer at the end of this file returns the masked output at `internal`.
#
# A dotenv file is matched as a path, not a substring: `.env` after a space,
# `/` or `=`, and at the end of the command, before a space, or before
# `.<suffix>` (`.env.local`, also `.env.example`); also a double-quoted
# `".env"`, `".env.local"` or `"$DIR/.env"`, and `source .env;`. `os.environ`,
# `process.env.X` and `.envrc` reach the Annotator below.
[[policy.tool]]
name = "tool/coding/shell(command:* .env)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "tool/coding/shell(command:* .env *)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "tool/coding/shell(command:* .env.*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "tool/coding/shell(command:*/.env)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "tool/coding/shell(command:*/.env *)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "tool/coding/shell(command:*/.env.*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
