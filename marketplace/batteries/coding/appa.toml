# The Databricks CLI prints the login's own credential on request, and its
# profile file holds tokens; `configure` writes one there. The CLI takes its
# global flags anywhere (`databricks --profile dev auth token`), so the
# verb is matched after `databricks` with anything between. A selector is a
# substring of the command line, so a spelling these miss (the command
# inside `$(...)`, a heredoc, an alias) reaches the Bash Annotator below.
[[policy.tool]]
name = "tool/coding/shell(command:*.databrickscfg*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "tool/coding/shell(command:*databricks*auth token*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "tool/coding/shell(command:*databricks*auth env*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
