# Google sees the search query; strangers write the results.
[[policy.tool]]
name = "tool/coding/fetch_url(url:https://www.google.com/search?*)"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "tool/coding/fetch_url(url:https://google.com/search?*)"
delta = { trust = "suspicious" }

# Web pages are authored outside the session, and the URL leaves it for any
# host: a public sink and an untrusted source at once.
[[policy.tool]]
name = "tool/coding/fetch_url"
requires = { audience = { contains = ["public"] } }
delta = { trust = "suspicious" }

# The search provider sees the query, as Google does above; strangers write
# the results.
[[policy.tool]]
name = "tool/coding/web_search"
delta = { trust = "suspicious" }
