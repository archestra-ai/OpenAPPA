schema = 1
name = "databricks"
description = "Rules for Databricks' managed MCP servers: Genie One's five tools and Databricks SQL's execute_sql, with internal reads, each SQL statement classified before it runs, and the databricks audience source."

[battery]
policy = "appa.toml"
hosts = ["claude-code"]
namespaces = ["databricks"]
helpers = ["check.py", "check-multi-user.py", "audience-source.py", "audience-source-multi-user.py", "databricks_audience.py", "service_principal.py"]
benefit = "APPA asks Databricks, through the Databricks CLI, who the workspace users are, who is in each group, and who can use a Genie space. With this, APPA lets workspace data flow only to workspace members."
setup = [
  "Bind both managed servers: `appa battery install databricks --server <genie-server> --server <sql-server>`.",
  "Install the Databricks CLI where the APPA runtime runs: https://docs.databricks.com/aws/en/dev-tools/cli/install",
  "Make a personal access token: in the workspace, click your username, then Settings, Developer, Access tokens, Manage, Generate new token.",
  "Set `DATABRICKS_HOST` to the workspace URL. The CLI must still be installed.",
  "The login or token must read SCIM users and groups, and the permissions of each Genie space your rules name.",
]

[battery.readiness]
command = ["python3", "check.py"]
required_executables = ["python3", "databricks"]

[[battery.readiness.cli_alternatives]]
executable = "databricks"
credential = "APPA_PROVIDER_DATABRICKS_TOKEN"
login_hint = "databricks auth login --host <workspace-url>"

[battery.targets.single-user]
policy = "single-user.toml"

[battery.targets.multi-user]
policy = "multi-user.toml"
readiness = ["python3", "check-multi-user.py"]
setup = [
  "Bind both managed servers: `appa battery install databricks --server <genie-server> --server <sql-server>`.",
  "Install the Databricks CLI where the APPA runtime runs: https://docs.databricks.com/aws/en/dev-tools/cli/install",
  "Create a service principal in the workspace and an OAuth secret for it: https://docs.databricks.com/aws/en/dev-tools/auth/oauth-m2m",
  "Set `APPA_PROVIDER_DATABRICKS_HOST` to the workspace URL, and `APPA_PROVIDER_DATABRICKS_CLIENT_ID` and `APPA_PROVIDER_DATABRICKS_CLIENT_SECRET` to the service principal's client id and secret. No CLI profile or personal login is used.",
  "The service principal must read SCIM users and groups, and the permissions of each Genie space your rules name.",
]
