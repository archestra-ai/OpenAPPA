schema = 1
name = "databricks"
description = "Rules for Databricks' managed MCP servers: Genie One's five tools and Databricks SQL's execute_sql, with internal reads, each SQL statement classified before it runs, and the databricks audience source."

[battery]
policy = "appa.toml"
hosts = ["claude-code"]
namespaces = ["databricks"]
helpers = ["audience-source.py", "databricks_token.py"]
setup = "Bind both managed servers: appa battery install databricks --server <genie-server> --server <sql-server>. Falls back to your Databricks CLI login (databricks auth login) when the variables are unset; the token needs to read SCIM users and groups and Genie space permissions."
