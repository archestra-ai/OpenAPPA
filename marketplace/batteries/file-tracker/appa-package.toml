policy = "appa.toml"
hosts = ["claude-code"]
namespaces = ["file-tracker"]
helpers = []
benefit = "Keeps a label on every file the agent reads or writes, across sessions, and confines shell commands to the files and hosts they declare."

[battery.targets.single-user]
