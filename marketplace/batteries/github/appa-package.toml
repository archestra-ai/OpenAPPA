schema = 1
name = "github"
description = "Rules for the GitHub MCP server with its default tool sets: profile, repositories, issues, pull requests, and user search; repository visibility decides who may see each read and write, plus the github audience source."

[battery]
policy = "appa.toml"
hosts = ["claude-code", "kagent", "archestra"]
namespaces = ["github"]
helpers = ["audience-source.py", "repository-visibility.py", "github_token.py"]
setup = "Falls back to your gh login (gh auth login) when the variable is unset; a token needs the repo and read:org scopes."
