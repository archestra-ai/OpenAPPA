# GitHub battery, base policy: the GitHub MCP server's default toolsets
# with no helper and no lookup. A deployment composes a target policy
# (`single-user.toml` or `multi-user.toml`) over it, whose rules for one
# repository's reads and writes run first and ask GitHub for the
# repository's visibility. Composed alone, a read of one repository
# enters `suspicious` and stays with the viewer (`self`), and a write
# into one needs trusted data everyone may see. The parent issue
# `sub_issue_write` returns is labelled as a read of that issue is.

[policy]
version = 2

# --- who am I: the viewer's own profile, nothing a stranger wrote ---

[[policy.tool]]
name = "mcp/github/get_me"
delta = {}

# --- rosters and user search: profiles other people wrote, from every organization the token sees ---

[[policy.tool]]
name = "mcp/github/get_teams"
delta = { trust = "suspicious", audience = ["self"] }
tags = ["github"]

[[policy.tool]]
name = "mcp/github/get_team_members"
delta = { trust = "suspicious", audience = ["self"] }
tags = ["github"]

[[policy.tool]]
name = "mcp/github/search_users"
delta = { trust = "suspicious", audience = ["self"] }
tags = ["github"]

