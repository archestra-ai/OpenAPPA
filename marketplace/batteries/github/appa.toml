# GitHub battery, base policy: the GitHub MCP server's default toolsets
# with no helper and no lookup. A deployment composes a target policy
# (`single-user.toml` or `multi-user.toml`) over it, whose rules for one
# repository's reads and writes run first and ask GitHub for the
# repository's visibility. Composed alone, a read of one repository
# enters `suspicious` and stays with the viewer (`self`), and a write
# into one needs trusted data everyone may see. The parent issue
# `sub_issue_write` returns is labelled as a read of that issue is.

[policy]
version = 2

# --- who am I: the viewer's own profile, nothing a stranger wrote ---

[[policy.tool]]
name = "mcp/github/get_me"
delta = {}

# --- rosters and user search: profiles other people wrote, from every organization the token sees ---

[[policy.tool]]
name = "mcp/github/get_teams"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/get_team_members"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/search_users"
delta = { trust = "suspicious", audience = ["self"] }

# --- reads of one repository: a target policy asks its visibility; alone, they stay with the viewer ---

[[policy.tool]]
name = "mcp/github/get_file_contents"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/list_branches"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/list_commits"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/get_commit"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/list_tags"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/get_tag"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/list_releases"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/get_latest_release"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/get_release_by_tag"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/list_repository_collaborators"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/list_issues"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/issue_read"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/get_label"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/list_pull_requests"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/pull_request_read"
delta = { trust = "suspicious", audience = ["self"] }

# --- reads across repositories: content other people wrote, from every repository the token sees ---

[[policy.tool]]
name = "mcp/github/search_repositories"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/search_code"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/search_commits"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
name = "mcp/github/run_secret_scanning"
delta = { trust = "suspicious", audience = ["self"] }

[[policy.tool]]
