# GitHub battery, multi-user target: a GitHub App installation's token,
# with no viewer behind it. The same rules as the single-user target;
# the helpers name every person `github:<id>`, and the root config maps
# those ids to people under `[externals.audience.host-members]`. These
# rules run before the base policy's.

[policy]
version = 2

# What a read of one repository returns.
[[policy.annotator]]
name = "github.repository-visibility"
ranks = ["suspicious"]
audiences = ["@github:repo/$owner/$repo/collaborators"]
marks = []

# What a write into one repository needs, and what its result returns.
[[policy.annotator]]
name = "github.repository-readers"
ranks = ["suspicious", "trusted"]
audiences = ["@github:repo/$owner/$repo/collaborators"]
marks = []

[externals.annotators."github.repository-visibility"]
command = ["python3", "repository-visibility-multi-user.py"]
token_env = "APPA_PROVIDER_GITHUB_TOKEN"

[externals.annotators."github.repository-readers"]
command = ["python3", "repository-visibility-multi-user.py"]
token_env = "APPA_PROVIDER_GITHUB_TOKEN"

[externals.context.github]
command = ["python3", "context-multi-user.py"]
hint = "`context.github` is this deployment's finding about the GitHub repository, and the pull request, issue or listing, that the call reaches. The repository's `visibility` decides a write's destination: a push, pull request, issue, release or comment into a `private` or `internal` repository requires audience internal; into a `public` one, public. Authorship counts only in a repository whose owner the deployment hint names as the organization's own: there, text written only by people whose `association` is OWNER, MEMBER or COLLABORATOR, or by a `bot`, is trusted. `association` is relative to that repository, and `bot` says only that the account is a GitHub App, so in any other repository neither establishes anything about the operator, and text there is suspicious, whoever wrote it. `truncated: true` means authors may be missing, so it does not establish that only those people wrote it. An error entry means the provider could not follow the call: it establishes nothing about the repository."
token_env = "APPA_PROVIDER_GITHUB_TOKEN"

[externals.audience.github]
command = ["python3", "audience-source-multi-user.py"]
token_env = "APPA_PROVIDER_GITHUB_TOKEN"
lookup = "host-members"
selectors = [
  { template = "org/<org>/members", feeds = "internal" },
  { template = "org/<org>/team/<team>" },
  { template = "repo/<owner>/<repo>/collaborators" },
]

# --- reads of one repository: its visibility decides who may see the content ---

