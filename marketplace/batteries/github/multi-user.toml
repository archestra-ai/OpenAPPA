# GitHub battery, multi-user target: a GitHub App installation's token,
# with no viewer behind it. The same rules as the single-user target;
# the helpers name every person `github:<id>`, and the root config maps
# those ids to people under `[externals.audience.host-members]`. These
# rules run before the base policy's.

[policy]
version = 2

# What a read of one repository returns.
[[policy.annotator]]
name = "github.repository-visibility"
ranks = ["suspicious"]
audiences = ["@github:repo/$owner/$repo/collaborators"]
marks = []

# What a write into one repository needs, and what its result returns.
[[policy.annotator]]
name = "github.repository-readers"
ranks = ["suspicious", "trusted"]
audiences = ["@github:repo/$owner/$repo/collaborators"]
marks = []

[externals.annotators."github.repository-visibility"]
command = ["python3", "repository-visibility-multi-user.py"]
token_env = "APPA_PROVIDER_GITHUB_TOKEN"

[externals.annotators."github.repository-readers"]
command = ["python3", "repository-visibility-multi-user.py"]
token_env = "APPA_PROVIDER_GITHUB_TOKEN"

[externals.context.github]
command = ["python3", "context-multi-user.py"]
token_env = "APPA_PROVIDER_GITHUB_TOKEN"

[externals.audience.github]
command = ["python3", "audience-source-multi-user.py"]
token_env = "APPA_PROVIDER_GITHUB_TOKEN"
lookup = "host-members"
selectors = [
  { template = "org/<org>/members", feeds = "internal" },
  { template = "org/<org>/team/<team>" },
  { template = "repo/<owner>/<repo>/collaborators" },
]

# --- reads of one repository: its visibility decides who may see the content ---

[[policy.tool]]
name = "mcp/github/get_file_contents"
annotator = "github.repository-visibility"

[[policy.tool]]
name = "mcp/github/list_branches"
