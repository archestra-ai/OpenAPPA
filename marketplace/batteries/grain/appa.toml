# Grain battery: meeting recordings, notes, deals, and workspace admin.
#
# Trust follows who can write the text. What a meeting tool returns was
# said by the people in the meeting, including outside participants, so
# meeting content enters `suspicious` and stays with the organization's
# members (`internal`). Workspace users, teams, and settings are written
# by members and keep the session's trust.
#
# Clips, stories, collections, and tags are read back as meeting content,
# at `suspicious`, so writing them needs no trusted data: a session that
# read a transcript can still cut a clip from it. A smart topic is read
# back with the settings, so creating one needs trusted data. Sharing a
# collection with anyone who has the link, inviting people, and changing
# seats, teams, or settings need a person. The root config supplies the
# authority that permits the `human-approval` mark.

[policy]
version = 2

# --- meeting content: outside participants, internal ---

[[policy.tool]]
name = "mcp/claude_ai_Grain/list_meetings"
delta = { trust = "suspicious", audience = ["internal"] }
tags = ["grain"]

