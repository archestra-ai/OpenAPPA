name = "mcp/claude_ai_Grain/fetch_meeting_transcript"
delta = { audience = ["internal"] }

[[policy.tool]]
name = "mcp/claude_ai_Grain/fetch_meeting_notes"
delta = { audience = ["internal"] }

[[policy.tool]]
name = "mcp/claude_ai_Grain/fetch_meeting_action_items"
delta = { audience = ["internal"] }

