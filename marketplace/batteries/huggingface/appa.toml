# Hugging Face battery: the hosted Hugging Face MCP server (hf-mcp-server).
#
# Model cards, dataset files, Space code, and search results are written
# by whoever pushed them, so every read enters at the low rank of the
# trust chain, like a fetched web page. Who may see it, and who must be
# allowed to see what a write puts there, is each repository's own
# visibility. No tool names a repository in a top-level argument — ids
# sit inside `repo_ids`, inside `hf://` URIs, inside an operations list —
# so a selector placeholder cannot reach them; the two annotators bound
# below read every repository a call names and ask the Hub. A public
# repository's content is `public` and its writes need trusted data
# everyone may see; a gated repository's files, a private repository, and
# any listing the token sees private names in stay with the viewer
# (`self`). A private organization repository listed in a resource group
# the token can see is read by that group's members, the collection
# `@huggingface:org/<org>/resource-group/<group>/members`, once a root
# config admits it (the README shows the redeclaration); writes into a
# private organization repository need data everyone may see, since the
# organization's admins read every repository.
#
# Searches send the token, and the Hub then lists the viewer's private
# repositories among the public ones, so their results stay with the
# viewer; a root rule can treat a search of public repositories as
# public by its query, since root rules run first:
#
#   [[policy.tool]]
#   name = "mcp/huggingface/hub_repo_search(author:acme)"
#   delta = { trust = "suspicious" }
#
# Jobs, the sandbox, and a Space invoked with the viewer's token run
# code outside this policy's sight: trusted input that stays with the
# viewer, and a person permitting `huggingface-review`.
#
# The battery also binds `audience-source.py`, the `huggingface` audience
# source, and declares the selectors it serves. The root config maps
# `self` onto its viewer — the README shows the wiring.

[policy]
version = 2

# What a read of the repositories a call names returns.
[[policy.annotator]]
name = "huggingface.repo-visibility"
ranks = ["suspicious"]
audiences = ["self"]
marks = []

# What a write into the repository a call names needs.
[[policy.annotator]]
name = "huggingface.repo-readers"
ranks = ["trusted"]
audiences = ["self"]
marks = []

[externals.annotators."huggingface.repo-visibility"]
command = ["python3", "repo-visibility.py"]
token_env = "APPA_PROVIDER_HUGGINGFACE_TOKEN"

[externals.annotators."huggingface.repo-readers"]
command = ["python3", "repo-visibility.py"]
token_env = "APPA_PROVIDER_HUGGINGFACE_TOKEN"

[externals.audience.huggingface]
command = ["python3", "audience-source.py"]
token_env = "APPA_PROVIDER_HUGGINGFACE_TOKEN"
selectors = [
  { template = "viewer", feeds = "self" },
  { template = "org/<org>/resource-group/<group>/members" },
]

# --- who am I: the viewer's own account, read by the viewer ---

[[policy.tool]]
name = "mcp/huggingface/hf_whoami"
delta = { audience = ["self"] }

# --- search: the token lists the viewer's private repositories too ---

[[policy.tool]]
name = "mcp/huggingface/hub_repo_search"
delta = { trust = "suspicious", audience = ["self"] }

# --- reads of named repositories: each one's visibility decides who may see the content ---

[[policy.tool]]
name = "mcp/huggingface/hub_repo_details"
annotator = "huggingface.repo-visibility"

[[policy.tool]]
name = "mcp/huggingface/hf_fs"
annotator = "huggingface.repo-visibility"

# --- writes into a named repository: its visibility decides who must be allowed to see the data ---

[[policy.tool]]
name = "mcp/huggingface/hf_fs_write"
annotator = "huggingface.repo-readers"

[[policy.tool]]
name = "mcp/huggingface/create_repo"
annotator = "huggingface.repo-readers"

# --- code run with the viewer's token, outside this policy's sight: trusted input, a person reviews ---

# Invoking a Space posts the parameters to its code with the viewer's token forwarded.
[[policy.tool]]
name = "mcp/huggingface/dynamic_space(operation:invoke)"
delta = { trust = "suspicious", audience = ["self"] }
requires = { trust = "trusted", audience = { contains = ["self"] }, attention = ["huggingface-review"] }

[[policy.tool]]
name = "mcp/huggingface/hf_jobs"
delta = { trust = "suspicious", audience = ["self"] }
requires = { trust = "trusted", audience = { contains = ["self"] }, attention = ["huggingface-review"] }

[[policy.tool]]
name = "mcp/huggingface/hf_sandbox"
delta = { trust = "suspicious", audience = ["self"] }
requires = { trust = "trusted", audience = { contains = ["self"] }, attention = ["huggingface-review"] }

[[policy.tool]]
name = "mcp/huggingface/hf_sandbox_exec"
delta = { trust = "suspicious", audience = ["self"] }
requires = { trust = "trusted", audience = { contains = ["self"] }, attention = ["huggingface-review"] }

[[policy.tool]]
name = "mcp/huggingface/hf_sandbox_fs"
delta = { trust = "suspicious", audience = ["self"] }
requires = { trust = "trusted", audience = { contains = ["self"] }, attention = ["huggingface-review"] }

# --- Space discovery and schemas: a token-bearing search lists the viewer's private Spaces ---

[[policy.tool]]
name = "mcp/huggingface/dynamic_space"
delta = { trust = "suspicious", audience = ["self"] }
