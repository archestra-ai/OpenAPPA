# Hugging Face battery, single-user target: one person's token. The two
# annotators read every repository a call names and ask the Hub who
# reads it. A public repository's content is `public` and its writes
# need trusted data everyone may see; a gated repository's files, a
# private repository, and any listing the token sees private names in
# stay with the viewer (`self`). A private organization repository
# listed in a resource group the token can see is read by that group's
# members, the collection
# `@huggingface:org/<org>/resource-group/<group>/members`, once a root
# config admits it (the README shows the redeclaration); writes into a
# private organization repository need data everyone may see, since the
# organization's admins read every repository. A write into the viewer's
# own private repository needs data the viewer may see.
#
# The target also binds `audience-source.py`, the `huggingface` audience
# source, and declares the selectors it serves. The root config maps
# `self` onto its viewer — the README shows the wiring. These rules run
# before the base policy's.

[policy]
version = 2

# What a read of the repositories a call names returns.
[[policy.annotator]]
name = "huggingface.repo-visibility"
ranks = ["suspicious"]
audiences = ["self"]
marks = []

# What a write into the repository a call names needs.
[[policy.annotator]]
name = "huggingface.repo-readers"
ranks = ["trusted"]
audiences = ["self"]
marks = []

[externals.annotators."huggingface.repo-visibility"]
command = ["python3", "repo-visibility.py"]
token_env = "APPA_PROVIDER_HUGGINGFACE_TOKEN"

[externals.annotators."huggingface.repo-readers"]
command = ["python3", "repo-visibility.py"]
token_env = "APPA_PROVIDER_HUGGINGFACE_TOKEN"

[externals.audience.huggingface]
command = ["python3", "audience-source.py"]
token_env = "APPA_PROVIDER_HUGGINGFACE_TOKEN"
selectors = [
  { template = "viewer", feeds = "self" },
  { template = "org/<org>/resource-group/<group>/members" },
]

# --- reads of named repositories: each one's visibility decides who may see the content ---

[[policy.tool]]
name = "mcp/huggingface/hub_repo_details"
annotator = "huggingface.repo-visibility"

[[policy.tool]]
name = "mcp/huggingface/hf_fs"
annotator = "huggingface.repo-visibility"

# --- writes into a named repository: its visibility decides who must be allowed to see the data ---

[[policy.tool]]
name = "mcp/huggingface/hf_fs_write"
annotator = "huggingface.repo-readers"

[[policy.tool]]
name = "mcp/huggingface/create_repo"
annotator = "huggingface.repo-readers"
