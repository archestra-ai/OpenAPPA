# Linear MCP policy. A tool that names an issue, a team, a project, or a
# document by id is labelled with that resource's readers as Linear reports
# them: every full member for a public team, the team's members for a
# private one, plus the people an issue is shared with. The `linear`
# audience source bound below answers who is in each collection. Tools
# that name no resource, or name one by a free-text query, stay `internal`:
# map it in the root config to readers authorized for everything this
# connection can list. Every mutation requires review.
#
# Trust follows who can write the text. Issues, comments, documents, and
# projects are written by workspace members, so reads keep the session's
# trust. Text an installed integration posts (a synced ticket, a
# customer request) is trusted the same way: a member installed it, even
# when an outsider wrote the words it relays. Linear's public
# documentation and images fetched from arbitrary URLs are written
# outside the workspace, so those two reads enter `suspicious`.

[policy]
version = 2

[externals.audience.linear]
command = ["python3", "audience-source.py"]
token_env = "APPA_PROVIDER_LINEAR_TOKEN"
selectors = [
  { template = "viewer", feeds = "self" },
  { template = "full-members", feeds = "internal" },
  { template = "team/<key>/members" },
  { template = "team/<key>/readers" },
  { template = "issue/<id>/readers" },
  { template = "project/<id>/readers" },
  { template = "document/<id>/readers" },
]

# Reads of one resource: read by that resource's readers.
# Reads without a resource id: restricted to internal readers.

[[policy.tool]]
name = "mcp/linear/extract_images"
delta = { trust = "suspicious", audience = ["internal"] }
# Fetches arbitrary image URLs: input must be public and reviewed.
requires = { audience = { contains = ["public"] }, attention = ["linear-review"] }

