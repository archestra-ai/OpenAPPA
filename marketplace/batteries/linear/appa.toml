# Linear MCP policy. Internal must name readers authorized for all resources
# available through this connection. Override individual resources in the root policy.
# Every mutation requires review; no provider credentials or helper processes.

[policy]
version = 2

# Reads: outside content, restricted to internal readers.

[[policy.tool]]
name = "mcp/linear/extract_images"
delta = { trust = "suspicious", audience = ["internal"] }
# Fetches arbitrary image URLs: input must be public and reviewed.
requires = { audience = { contains = ["public"] }, attention = ["linear-review"] }

