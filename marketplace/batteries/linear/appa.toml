# Linear battery, base policy: Linear MCP tools with no helper and no
# lookup. A deployment composes a target policy (`single-user.toml` or
# `multi-user.toml`) over it, whose rules for a tool that names an issue,
# a team, a project, or a document by id run first and label it with
# that resource's readers as Linear reports them. Composed alone, such a
# read stays with the viewer (`self`) and a write into such a resource
# needs trusted data everyone may see. Tools that name no resource, or
# name one by a free-text query, stay `internal`: map it in the root
# config to readers authorized for everything this connection can list.
# Every mutation requires review.
#
# Trust follows who can write the text. Issues, comments, documents, and
# projects are written by workspace members, so reads keep the session's
# trust. Text an installed integration posts (a synced ticket, a
# customer request) is trusted the same way: a member installed it, even
# when an outsider wrote the words it relays. Linear's public
# documentation and images fetched from arbitrary URLs are written
# outside the workspace, so those two reads enter `suspicious`.

[policy]
version = 2

# Reads of one resource: a target policy labels them with its readers;
# alone, they stay with the viewer.
# Reads without a resource id: restricted to internal readers.

[[policy.tool]]
name = "mcp/linear/extract_images"
delta = { trust = "suspicious", audience = ["internal"] }
tags = ["linear"]
# Fetches arbitrary image URLs: input must be public and reviewed.
requires = { audience = { contains = ["public"] }, attention = ["linear-review"] }

