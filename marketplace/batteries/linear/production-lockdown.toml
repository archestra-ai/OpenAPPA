# Generated from schema-lock.json and operations.json by build.py.
# Override this annotator in the root config with explicit resource rules.
[policy]
version = 2

[[policy.annotator]]
name = "linear.production-lockdown"
hint = '{"rules":{}}'
ranks = ["suspicious", "trusted"]
marks = ["linear-review"]
effects = ["linear.changed", "linear.sensitive"]

[externals.annotators."linear.production-lockdown"]
command = ["python3", "annotate.py"]

