[[policy.tool]]
name = "list_comments"
server = "linear"
description = "List comments on a Linear issue, project, initiative, document, project milestone, or project/initiative status update. Provide exactly one of `issueId`, `projectId`, `initiativeId`, `documentId`, `milestoneId`, or `statusUpdateId`. For issues, projects, and initiatives this returns both top-level discussion threads and inline description comments. Inline (anchored) comments carry a non-null `quotedText` set to the snippet of description text they reference. Returned comments include `author` and nullable `onBehalfOf`; when set, `onBehalfOf` identifies the user the agent author acted for."
tags = ["linear", "linear-read"]
parameters = { type = "object", additionalProperties = true }
annotator = "linear.read-only"

[[policy.tool]]
name = "list_cycles"
server = "linear"
