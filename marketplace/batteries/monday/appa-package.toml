schema = 1
name = "monday"
description = "Rules for the monday Platform MCP server's 99 tools: internal reads, reviewed internal writes and sensitive changes, public documentation queries, and viewer-only returned credentials."

[battery]
policy = "appa.toml"
hosts = ["claude-code", "kagent"]
namespaces = ["monday"]
helpers = ["audience-source.py"]
benefit = "APPA asks monday.com for the confirmed email of a notification's recipient. With this, APPA sends a notification only with data that recipient may see."
setup = [
  "Connect the MCP server https://mcp.monday.com/mcp with OAuth or a monday API token. The install adds policy, not a connection.",
  "In monday.com, click your profile picture, then Developers, then API token, then Show. Copy your personal API token.",
  "Set `APPA_PROVIDER_MONDAY_TOKEN` to the token. An app token needs the `users:read` scope.",
  "In your root config, map `internal` to the people who may see all the connection reaches, and `self` to the token owner.",
]

[battery.readiness]
required_executables = ["python3"]
