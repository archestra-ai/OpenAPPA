# monday battery: the hosted Platform MCP server (https://mcp.monday.com/mcp),
# version 1.0.0, authenticated 99-tool inventory captured on 2026-09-22.
#
# Like Notion, monday has no complete resource-reader API in this tool set.
# Workspace reads are internal, and the root maps internal to the people who
# may see everything the connection can reach. Per-board ACLs are not inferred.
#
# Trust follows who can write the text. Boards, items, updates, and docs are
# written by account members, so reads keep the session's trust. Items a form
# or an integration creates are trusted the same way: a member published the
# form or installed the integration, even when an outsider wrote the words.
# Meeting notes and transcripts carry what outside participants said, and the
# knowledge endpoint answers from monday's own documentation, so those reads
# enter `suspicious`.
#
# Like Linear and PostHog, many writes return provider-owned content as well as
# confirmations: keep those results internal and review the exact write.
# Ordinary changes
# record monday.changed; structural, automation,
# execution, sharing and destructive operations record monday.sensitive.
# The root supplies an authority permitting monday-review.
#
# Leave ordinary parameters to the server. Only an operation that changes the
# security contract needs an argument selector, placed before its fallback.

[policy]
version = 2

# Notifications name one recipient. Resolve that user through the monday Users
# API so the call's input must be sharable with the actual recipient.
[externals.audience.monday]
command = ["python3", "audience-source.py"]
token_env = "APPA_PROVIDER_MONDAY_TOKEN"
selectors = [{ template = "user/<id>" }]

# --- reads: account content and provider schemas, internal readers ---
