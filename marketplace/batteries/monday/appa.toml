# monday battery: the monday-hosted Platform MCP server
# (`https://mcp.monday.com/mcp`), version 1.0.0.
#
# Four reads return account and people metadata, plus board, item, and update
# content authored by monday users. Results enter suspicious, restricted to
# internal, and input must be sharable with internal. The discovered tools
# do not report complete effective readers; map internal to people authorized
# to see everything the connection can reach. No audience helper is bound here.
#
# Item creation requires trusted public input because the destination's
# readers are unknown. Restricted read content cannot flow into this write.

[policy]
version = 2

# --- reads: account and board content, restricted to internal readers ---

[[policy.tool]]
name = "mcp/monday/get_user_context"
parameters = { type = "object", properties = {}, additionalProperties = false }
delta = { trust = "suspicious", audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/monday/get_board_info"
parameters = { type = "object", properties = { boardId = { type = "number" }, filters = { type = "object", properties = { views = { type = "object", properties = { ids = { type = "array", items = { type = "string" } }, names = { type = "array", items = { type = "string" } }, only = { type = "boolean" } }, additionalProperties = false }, columns = { type = "object", properties = { ids = { type = "array", items = { type = "string" } }, only = { type = "boolean" } }, additionalProperties = false } }, additionalProperties = false } }, required = ["boardId"], additionalProperties = false }
delta = { trust = "suspicious", audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/monday/get_board_items_page"
parameters = { type = "object", properties = { boardId = { type = "number" }, itemIds = { type = "array", items = { type = "number" }, maxItems = 99 }, limit = { type = "number", minimum = 1, maximum = 500 }, cursor = { type = "string" }, includeColumns = { type = "boolean" }, includeGroup = { type = "boolean" } }, required = ["boardId"], additionalProperties = false }
delta = { trust = "suspicious", audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/monday/get_updates"
parameters = { type = "object", properties = { objectId = { type = "string" }, objectType = { type = "string", const = "Item" }, limit = { type = "number", minimum = 1, maximum = 100 }, page = { type = "number", minimum = 1 }, includeReplies = { type = "boolean", const = false }, includeAssets = { type = "boolean", const = false } }, required = ["objectId", "objectType"], additionalProperties = false }
delta = { trust = "suspicious", audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

# --- writes: item creation from trusted public input ---
# The observed response contains the supplied name, generated identifiers,
# the requested board ID, and a generic message. This response assumption is
# manually verified; the runtime does not enforce an output whitelist.
# Reverify or remove this contract if the provider response changes.

[[policy.tool]]
name = "mcp/monday/create_item"
parameters = { type = "object", properties = { boardId = { type = "number" }, name = { type = "string", minLength = 1, maxLength = 255 }, columnValues = { type = "string", const = "{}" } }, required = ["boardId", "name", "columnValues"], additionalProperties = false }
delta = { audience = ["public"] }
requires = { trust = "trusted", audience = { contains = ["public"] } }
effects = ["monday.changed"]

# --- unsupported tools: blocked, with no authority override ---
# All 91 other names in the 2026-09-22 discovery have exact blocks, including
# create_update, whose response reads the existing item's name. These blocks
# take precedence over a deployment's reviewable `name = "*"` fallback;
# future names outside this inventory can still match that fallback.

[[policy.tool]]
name = "mcp/monday/all_monday_api"
requires = { attention = ["blocked"] }

