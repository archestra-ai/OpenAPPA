# Notion battery: the hosted Notion MCP server (`https://mcp.notion.com/mcp`).
#
# Notion exposes no page permissions to a policy: no tool reports who can
# see a page, a database, or a teamspace, and the connection acts with
# the full permissions of the person who authorized it. So every read is
# `internal`, the coarsest honest label: map it in the root config to the
# people who may see everything this connection can reach, and narrow a
# page or database in a root rule by argument. Page and database content
# was written by whoever edits the workspace and by connected sources
# (Slack, mail, calendar, drive), so reads enter `suspicious`.
#
# Writes that stay in the workspace need trusted data that `internal` may
# see and record `notion.changed`; what they return confirms the write and
# changes no label. Moving pages, changing or trashing a
# data source, turning a page into an agent Skill, and driving custom
# Agent sessions need the `notion-review` mark and record
# `notion.sensitive`. Creating an attachment from a URL makes Notion fetch
# that URL, so its input must be public and reviewed. The root config
# supplies an authority permitting `notion-review`.

[policy]
version = 2

# --- reads: outside content, restricted to internal readers ---

[[policy.tool]]
name = "mcp/notion/notion-get-async-task"
delta = { trust = "suspicious", audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/notion/notion-search"
delta = { trust = "suspicious", audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

