tags = ["pagerduty"]

[[policy.tool]]
name = "mcp/pagerduty/manage_teams"
delta = { trust = "suspicious", audience = ["internal"] }
requires = { trust = "trusted", audience = { contains = ["internal"] }, attention = ["pagerduty-review"] }
effects = ["pagerduty.sensitive"]
tags = ["pagerduty"]

[[policy.tool]]
name = "mcp/pagerduty/manage_event_orchestrations"
delta = { trust = "suspicious", audience = ["internal"] }
requires = { trust = "trusted", audience = { contains = ["internal"] }, attention = ["pagerduty-review"] }
