  "mcp/posthog/experiment-get-all",
  "mcp/posthog/experiment-get",
  "mcp/posthog/experiment-results-get",
  "mcp/posthog/surveys-get-all",
  "mcp/posthog/survey-get",
  "mcp/posthog/surveys-global-stats",
  "mcp/posthog/survey-stats",
  "mcp/posthog/docs-search",
  "mcp/posthog/insight-create-from-query",
  "mcp/posthog/insight-update",
  "mcp/posthog/dashboard-create",
  "mcp/posthog/dashboard-update",
  "mcp/posthog/add-insight-to-dashboard",
  "mcp/posthog/survey-create",
  "mcp/posthog/survey-update",
  "mcp/posthog/create-feature-flag",
  "mcp/posthog/update-feature-flag",
  "mcp/posthog/delete-feature-flag",
