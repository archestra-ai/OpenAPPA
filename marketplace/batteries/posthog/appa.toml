# PostHog battery: PostHog's official MCP server (`@posthog/agent-toolkit`,
# hosted at mcp.posthog.com/mcp, also runnable from the PostHog/mcp
# repository).
#
# The server builds its tool list from one registry,
# `schema/tool-definitions.json`, which holds 44 entries. The hosted
# endpoint accepts `?features=<list>` to expose one subset (`flags`,
# `insights`, `dashboards`, `experiments`, `surveys`, `error-tracking`,
# `events`, `llm-analytics`, `workspace`, `docs`) and exposes every tool
# when the parameter is absent, so the rules below name all 44 entries.
# The server also drops a tool the personal API key lacks the scope for.
#
# What PostHog returns — analytics events and their properties, error
# tracking issues and stack traces, survey responses, experiment results,
# LLM analytics — was produced by the customer's own end users, so every
# read enters `suspicious`, restricted to the project's members
# (`internal`). The query tools are read-only: `query-run` accepts only a
# trends, funnel, or HogQL node (`InsightQuerySchema`) and posts it to
# `/api/environments/<id>/query/`, which reads.
#
# `docs-search` sends its `query` to Inkeep and returns public PostHog
# documentation, so its input must be sharable with `public`.
#
# Every write needs trusted data that `internal` may see and the
# `posthog-review` mark. Feature flags gate production behaviour, so
# creating or changing one records `posthog.sensitive`; so does every
# experiment write, because an experiment owns a feature flag
# (`feature_flag_key`) and `launch` starts serving its variants. Deleting
# anything records `posthog.sensitive` too. Insight, dashboard, and
# survey writes record `posthog.changed`. The root config supplies an
# authority permitting `posthog-review`.

[policy]
version = 2

# --- reads: end-user data, restricted to internal readers ---

[[policy.tool]]
name = "mcp/posthog/organizations-get"
delta = { trust = "suspicious", audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }
tags = ["posthog"]

