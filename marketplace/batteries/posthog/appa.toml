  "mcp/posthog/insight-query",
  "mcp/posthog/insights-get-all",
  "mcp/posthog/insight-get",
  "mcp/posthog/dashboards-get-all",
  "mcp/posthog/dashboard-get",
  "mcp/posthog/list-errors",
  "mcp/posthog/error-details",
  "mcp/posthog/get-llm-total-costs-for-project",
  "mcp/posthog/feature-flag-get-all",
