# Sentry battery: the Sentry MCP server (`@sentry/mcp-server`, hosted at
# mcp.sentry.dev or run locally).
#
# The server lists nine tools. Seven read or change Sentry directly; the
# other two are a catalog: `search_sentry_tools` finds a tool by name, and
# `execute_sentry_tool` runs any of the 55 catalog tools by its `name`
# argument. The rules below name each catalog tool through that argument,
# `execute_sentry_tool(name:<tool>)`, so the inner tool decides what the
# call is; a `name` outside the catalog needs a person.
#
# What Sentry returns — issues, events, stack traces, breadcrumbs, user
# reports, replays, comments — was produced by the monitored applications
# and their users, so every read enters `suspicious`, restricted to the
# organization's members (`internal`). Every write needs trusted data that
# `internal` may see and the `sentry-review` mark; changing a project,
# team, DSN, or monitor records `sentry.sensitive`, the rest
# `sentry.changed`. The root config supplies an authority permitting
# `sentry-review`. Sentry exposes no per-project readers to a policy, so
# map `internal` to the people who may see everything this token can list.
#
# Documentation tools fetch public pages from docs.sentry.io, so their
# input must be public. `search_events`, `search_issues`,
# `search_issue_events`, and `get_trace_details` may send their free-text
# query to the LLM provider the server is configured with; that provider
# is the deployment's own. `analyze_issue_with_seer` starts a Seer run on
# Sentry's side and is a write.

[policy]
version = 2

# --- the nine listed tools ---

[[policy.tool]]
name = "mcp/sentry/find_organizations"
delta = { trust = "suspicious", audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/sentry/find_projects"
delta = { trust = "suspicious", audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/sentry/update_issue"
delta = { trust = "suspicious", audience = ["internal"] }
requires = { trust = "trusted", audience = { contains = ["internal"] }, attention = ["sentry-review"] }
effects = ["sentry.changed"]

[[policy.tool]]
name = "mcp/sentry/search_events"
delta = { trust = "suspicious", audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/sentry/analyze_issue_with_seer"
delta = { trust = "suspicious", audience = ["internal"] }
requires = { trust = "trusted", audience = { contains = ["internal"] }, attention = ["sentry-review"] }
effects = ["sentry.changed"]

[[policy.tool]]
name = "mcp/sentry/search_issues"
delta = { trust = "suspicious", audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/sentry/get_sentry_resource"
delta = { trust = "suspicious", audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/sentry/search_sentry_tools"
delta = {}

# --- the catalog, one contract per inner tool ---

[[policy.tool]]
name = "mcp/sentry/execute_sentry_tool(name:whoami)"
parameters = { type = "object", properties = { name = { type = "string" } }, required = ["name"], additionalProperties = true }
delta = { trust = "suspicious", audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

