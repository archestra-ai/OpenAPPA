schema = 1
name = "slack"
description = "Rules for the claude.ai Slack connector, all 19 of its tools: read, search, send, and canvases, plus the slack audience source."

[battery]
policy = "appa.toml"
hosts = ["claude-code"]
namespaces = ["claude_ai_Slack"]
helpers = ["check.py", "audience-source.py", "conversation-trust.py", "slack_api.py"]

[battery.readiness]
command = ["python3", "check.py"]
required_executables = ["python3"]
