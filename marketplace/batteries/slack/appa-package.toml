schema = 1
name = "slack"
description = "Rules for the claude.ai Slack connector, all 19 of its tools: read, search, send, and canvases, plus the slack audience source."

[battery]
policy = "appa.toml"
hosts = ["claude-code"]
namespaces = ["claude_ai_Slack"]
helpers = ["check.py", "audience-source.py", "conversation-trust.py", "slack_api.py"]
benefit = "APPA asks the Slack API who can read each channel and if the channel is shared with another organization. With this, APPA lets channel text flow only to people who can already read it, and marks Slack Connect text as suspicious."
setup = [
  "Create a Slack app at https://api.slack.com/apps: click Create New App, then From scratch, and pick your workspace.",
  "In OAuth & Permissions, add these User Token Scopes: `users:read`, `users:read.email`, `usergroups:read`, `channels:read`, `groups:read`, `im:read`, `mpim:read`.",
  "Click Install to Workspace and copy the User OAuth Token. It starts with `xoxp-`.",
  "A bot token (`xoxb-`) also works, but APPA then treats the bot, not you, as `self`, and the agent must name a DM by the recipient's user id (`U…`), since Slack shows a DM conversation (`D…`) only to its two ends.",
]

[battery.readiness]
command = ["python3", "check.py"]
required_executables = ["python3"]
