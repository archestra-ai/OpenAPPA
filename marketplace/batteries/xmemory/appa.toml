# xmemory battery: the hosted xmemory MCP servers, one namespace bound to
# both. The instance server (`https://mcp.xmemory.ai`, or
# `https://mcp.xmemory.ai/instance/<id>`) reads and writes one memory
# instance; the admin server (`https://mcp.xmemory.ai/admin`) creates,
# describes, and deletes instances. xmemory commit `b3aaaa6`.
#
# xmemory keeps no per-record permissions, and no tool reports who can
# read an instance. An API key reaches only the clusters linked to it, but
# console users reach every cluster of their organisation. So every read
# is `internal`, the coarsest honest label: map it in the root config to
# the organisation's members. A tool's input must be sharable with
# `internal`, because the instance stores it and its readers see it.
#
# Trust follows who can write the text. Memory is written by the
# organisation's members and agents, and every write needs trusted data,
# so reads keep the session's trust: suspicious text cannot enter memory
# and come back trusted. A `text` write can already update and delete
# records through extraction, so a `structured_mutations` write that
# names them exactly gets the same contract.
#
# Creating an instance and changing its metadata return the whole
# instance: its schema, description, and owner instructions. Owner
# instructions reach every agent connected to the instance. Applying a
# schema migration and deleting an instance cannot be undone and need the
# `xmemory-review` mark. The root config supplies an authority permitting
# both.

[policy]
version = 2

# --- instance reads: memory content, restricted to internal readers ---

[[policy.tool]]
name = "mcp/xmemory/read"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/xmemory/write_status"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/xmemory/get_instance_id"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/xmemory/get_instance_schema"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/xmemory/get_setup_instructions"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

# Builds a schema proposal from read traffic. It also merges duplicate
# feedback rows, which rebuild the same proposal; it changes no schema.
[[policy.tool]]
name = "mcp/xmemory/review_suggestions"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/xmemory/list_schema_migrations"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/xmemory/get_schema_migration"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/xmemory/dry_run_schema_migration"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/xmemory/enhance_schema"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

# --- memory writes: trusted internal input ---

[[policy.tool]]
name = "mcp/xmemory/write"
delta = { audience = ["internal"] }
requires = { trust = "trusted", audience = { contains = ["internal"] } }
effects = ["xmemory.changed"]

# Returns a queue id only; `write_status` returns the result.
[[policy.tool]]
name = "mcp/xmemory/write_async"
delta = {}
requires = { trust = "trusted", audience = { contains = ["internal"] } }
effects = ["xmemory.changed"]

# --- schema changes ---

# Records accept, reject, and defer decisions and echoes them;
# `apply_pending_decisions` applies them.
[[policy.tool]]
name = "mcp/xmemory/decide_suggestions"
delta = { audience = ["internal"] }
requires = { trust = "trusted", audience = { contains = ["internal"] } }
effects = ["xmemory.changed"]

[[policy.tool]]
name = "mcp/xmemory/apply_pending_decisions"
delta = { audience = ["internal"] }
requires = { trust = "trusted", audience = { contains = ["internal"] }, attention = ["xmemory-review"] }
effects = ["xmemory.schema"]

[[policy.tool]]
name = "mcp/xmemory/update_instance_schema"
delta = { audience = ["internal"] }
requires = { trust = "trusted", audience = { contains = ["internal"] }, attention = ["xmemory-review"] }
effects = ["xmemory.schema"]

# --- admin reads: clusters, instances, schemas ---

[[policy.tool]]
name = "mcp/xmemory/admin_list_clusters"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/xmemory/admin_get_cluster"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/xmemory/admin_list_instances"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/xmemory/admin_list_own_instances"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/xmemory/admin_get_instance"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/xmemory/admin_get_instance_by_id"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/xmemory/admin_get_instance_schema_by_id"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/xmemory/admin_get_setup_instructions"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

# An LLM writes the schema from the description; nothing is stored.
[[policy.tool]]
name = "mcp/xmemory/admin_generate_schema"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

[[policy.tool]]
name = "mcp/xmemory/admin_enhance_schema"
delta = { audience = ["internal"] }
requires = { audience = { contains = ["internal"] } }

# --- admin writes: trusted data ---

[[policy.tool]]
name = "mcp/xmemory/admin_create_instance"
delta = { audience = ["internal"] }
requires = { trust = "trusted", audience = { contains = ["internal"] } }
effects = ["xmemory.admin"]

[[policy.tool]]
name = "mcp/xmemory/admin_update_instance_metadata"
delta = { audience = ["internal"] }
requires = { trust = "trusted", audience = { contains = ["internal"] } }
effects = ["xmemory.admin"]

[[policy.tool]]
name = "mcp/xmemory/admin_update_instance_metadata_by_id"
delta = { audience = ["internal"] }
requires = { trust = "trusted", audience = { contains = ["internal"] } }
effects = ["xmemory.admin"]

[[policy.tool]]
name = "mcp/xmemory/admin_patch_instance_metadata"
delta = { audience = ["internal"] }
requires = { trust = "trusted", audience = { contains = ["internal"] } }
effects = ["xmemory.admin"]

[[policy.tool]]
name = "mcp/xmemory/admin_patch_instance_metadata_by_id"
delta = { audience = ["internal"] }
requires = { trust = "trusted", audience = { contains = ["internal"] } }
effects = ["xmemory.admin"]

# --- instance deletion: a person reviews; it returns the deleted instance ---

[[policy.tool]]
name = "mcp/xmemory/admin_delete_instance"
delta = { audience = ["internal"] }
requires = { trust = "trusted", audience = { contains = ["internal"] }, attention = ["xmemory-review"] }
effects = ["xmemory.deleted"]

[[policy.tool]]
name = "mcp/xmemory/admin_delete_instance_by_id"
delta = { audience = ["internal"] }
requires = { trust = "trusted", audience = { contains = ["internal"] }, attention = ["xmemory-review"] }
effects = ["xmemory.deleted"]
