# The policy `appa plugin install claude-code` writes for a Claude Code session.
#
# It names Claude Code's built-in tools, and it includes the Claude Code
# battery, which carries the Read, Grep, Write and Edit rules and the Bash
# credential selectors. A named tool without a `delta` restricts nothing: the
# result's label is the combination of its sources, unchanged.
#
# Two questions decide each tool's rule. As a source: can someone other than
# this user write the text it returns? Then it carries
# `delta = { trust = "suspicious" }`. As a sink: who can end up reading its
# arguments? Its `requires` names that reader. A reader the session cannot see
# is `public`.
#
# Who may see a value is the built-in audience chain `self` ⊆ `internal` ⊆
# `public`: `self` is the person running this session, `internal` their
# organization, `public` the unrestricted state every session starts in. The
# chain works without a directory: `self` and `internal` are symbolic, and only
# a rule naming an individual recipient needs a source to check them (see the
# end of this file).
#
# Rules match in order and the first match wins, and the root's rules precede
# an included battery's. The Bash credential selectors are repeated here, above
# this file's bare Bash rule, so that they narrow the session before the Bash
# Annotator is asked. On Unix, a tool this policy does not name gets a per-call
# contract from the `*` Annotator at the end; off Unix, it is refused.
#
# `clappa` starts Claude Code with `SendMessage` denied: a message to a peer
# session leaves this trajectory without its label. The agent starts a
# subagent with `Agent` instead, whose final message is checked.
#
# The built-in tool set varies by Claude Code version; regenerate the list from
# a live session when it drifts.

[policy]
version = 2

# --- tools whose results stay inside the session's trust boundary ---

# Starting a subagent is this harness's spawn: the deployment controls the
# child's context (`[policy.deployment]` below), so the subagent runs as a
# child trajectory. The spawn is held until the session declares what the
# subagent's final message may carry — as it is, floored at a label, or
# through a registered sanitizer such as `attest-schema` below — and that
# message is checked when the subagent stops: one that may not cross keeps
# the subagent running, with the reason or the exact text to return, until
# it stops with one that may.
[[policy.tool]]
name = "host/claude-code/Agent"
delta = {}

[[policy.tool]]
name = "host/claude-code/AskUserQuestion"
delta = {}

# An artifact is private to this user until they share it from claude.ai, so
# publishing, its data and its comments reach `self`.
