name = "host/claude-code/Artifact"
delta = {}

[[policy.tool]]
name = "host/claude-code/ArtifactComments"
delta = {}

[[policy.tool]]
name = "host/claude-code/ArtifactData"
delta = {}

[[policy.tool]]
name = "host/claude-code/BashOutput"
delta = {}

[[policy.tool]]
name = "host/claude-code/CronCreate"
delta = {}

[[policy.tool]]
name = "host/claude-code/CronDelete"
delta = {}

[[policy.tool]]
name = "host/claude-code/CronList"
delta = {}

[[policy.tool]]
name = "host/claude-code/EndConversation"
delta = {}

[[policy.tool]]
name = "host/claude-code/EnterPlanMode"
delta = {}

[[policy.tool]]
name = "host/claude-code/EnterWorktree"
delta = {}

[[policy.tool]]
name = "host/claude-code/ExitPlanMode"
