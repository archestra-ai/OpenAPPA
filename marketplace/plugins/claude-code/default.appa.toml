# Example deployment for protecting a Claude Code session.
#
# The stable built-in tools of the harness are named. Read, Grep, Write
# and Edit are left to the Claude Code battery, which `appa plugin install
# claude-code` includes with this file; a deployment that removed the battery
# sends them to the bounded Claude fallback on Unix. Off Unix, unlisted calls
# remain fail-closed. Other tools the policy does not name get the same per-call
# fallback on Unix until `/appa-guide init` gives them an exact contract.
# A named tool without a `delta` key restricts nothing, the
# same statement as `delta = {}`: the result's label is the combination of its
# sources, unchanged.
#
# Tools that bring outside content into the session — the web tools —
# carry `delta = { trust = "suspicious" }` instead: their results
# enter at the low rank of the default trust chain
# (suspicious < trusted), so a `requires = { trust = "trusted" }` sink
# never receives them undeclared.
#
# Who may see a value is the built-in audience chain `self` ⊆ `internal`
# ⊆ `public`: `self` is the person running this session, `internal` their
# organization, `public` the unrestricted state every session starts in.
# The tools that publish or transmit beyond this machine require `public`,
# so a session narrowed by a battery's reads — the Claude Code battery
# labels the requester's credentials `self`, the Slack battery labels
# channel history `internal` — cannot reach them. The chain works without a
# directory: `self` and `internal` are symbolic, and only a rule naming an
# individual recipient needs a source to check them (see the end of this
# file). Bash, Read, Grep, Write and Edit are not named here on purpose: the
# root's declarations are checked before an included file's, so a bare rule
# here would shadow the battery's argument selectors, and a name written with
# a selector is declared, so a call no selector matches is refused rather than
# sent to the `*` fallback. Their rules live in the battery, selectors first
# and the bare rule last.
#
# The built-in tool set varies by Claude Code version; regenerate the
# list from a live session when it drifts.

[policy]
version = 2

# --- tools whose results stay inside the session's trust boundary ---

# Starting a subagent is this harness's spawn: the deployment controls the
# child's context (`[policy.deployment]` below), so the subagent runs as a
# child trajectory. The spawn is held until the session declares what the
# subagent's final message may carry — as it is, floored at a label, or
# through a registered sanitizer such as `attest-schema` below — and that
# message is checked when the subagent stops: one that may not cross keeps
# the subagent running, with the reason or the exact text to return, until
# it stops with one that may.
[[policy.tool]]
name = "host/claude-code/Agent"
delta = {}

[[policy.tool]]
name = "host/claude-code/AskUserQuestion"
delta = {}

# Publishes a page on claude.ai: a public sink.
[[policy.tool]]
name = "host/claude-code/Artifact"
requires = { audience = { contains = ["public"] } }
delta = {}

[[policy.tool]]
name = "host/claude-code/BashOutput"
delta = {}

[[policy.tool]]
name = "host/claude-code/CronCreate"
delta = {}

[[policy.tool]]
name = "host/claude-code/CronDelete"
delta = {}

[[policy.tool]]
name = "host/claude-code/CronList"
delta = {}

[[policy.tool]]
name = "host/claude-code/EnterPlanMode"
delta = {}

[[policy.tool]]
name = "host/claude-code/EnterWorktree"
delta = {}

[[policy.tool]]
name = "host/claude-code/ExitPlanMode"
delta = {}

[[policy.tool]]
name = "host/claude-code/ExitWorktree"
delta = {}

[[policy.tool]]
name = "host/claude-code/Glob"
delta = {}

[[policy.tool]]
name = "host/claude-code/KillShell"
delta = {}

[[policy.tool]]
name = "host/claude-code/LSP"
delta = {}

[[policy.tool]]
name = "host/claude-code/ListAgents"
delta = {}

[[policy.tool]]
name = "host/claude-code/ListMcpResourcesTool"
delta = {}

[[policy.tool]]
name = "host/claude-code/Monitor"
delta = {}

[[policy.tool]]
name = "host/claude-code/NotebookEdit"
delta = {}

[[policy.tool]]
name = "host/claude-code/PushNotification"
delta = {}

[[policy.tool]]
name = "host/claude-code/ReadMcpResourceDirTool"
delta = {}

[[policy.tool]]
name = "host/claude-code/ReadMcpResourceTool"
delta = {}

[[policy.tool]]
name = "host/claude-code/ReportFindings"
delta = {}

[[policy.tool]]
name = "host/claude-code/ScheduleWakeup"
delta = {}

[[policy.tool]]
name = "host/claude-code/SendMessage"
delta = {}

[[policy.tool]]
name = "host/claude-code/SendUserFile"
delta = {}

[[policy.tool]]
name = "host/claude-code/Skill"
delta = {}

[[policy.tool]]
name = "host/claude-code/SlashCommand"
delta = {}

# `Task` is the earlier name of `Agent`: the same spawn, the same contract.
[[policy.tool]]
name = "host/claude-code/Task"
delta = {}

[[policy.tool]]
name = "host/claude-code/TaskCreate"
delta = {}

[[policy.tool]]
name = "host/claude-code/TaskGet"
delta = {}

[[policy.tool]]
name = "host/claude-code/TaskList"
delta = {}

[[policy.tool]]
name = "host/claude-code/TaskOutput"
delta = {}

[[policy.tool]]
name = "host/claude-code/TaskStop"
delta = {}

[[policy.tool]]
name = "host/claude-code/TaskUpdate"
delta = {}

[[policy.tool]]
name = "host/claude-code/TodoWrite"
delta = {}

[[policy.tool]]
name = "host/claude-code/ToolSearch"
delta = {}

[[policy.tool]]
name = "host/claude-code/Workflow"
delta = {}

# --- tools that bring outside content into the session ---

# Web pages and search results are authored outside the session, and the URL
# or query itself leaves it: a public sink and an untrusted source at once.
[[policy.tool]]
name = "host/claude-code/WebFetch"
requires = { audience = { contains = ["public"] } }
delta = { trust = "suspicious" }

[[policy.tool]]
name = "host/claude-code/WebSearch"
requires = { audience = { contains = ["public"] } }
delta = { trust = "suspicious" }

# Reporting to the OpenAPPA team that APPA is in the way. Served by the runtime
# itself, and gated by the same algebra as any other sink that leaves this
# machine: the report carries this session's APPA decisions, so a session
# narrowed by a battery's reads reaches a human review instead of sending. The
# report never carries a prompt, a tool argument or a tool output — what it may
# carry is decided by the runtime, not by this rule. Turn the tool off entirely
# with `[reporting] agent_yell = false` at the end of this file; a deployment
# that leaves it on and wants a person in the loop can add
# `requires = { attention = ["hitl"] }` here instead.
[[policy.tool]]
name = "mcp/appa/yell"
requires = { audience = { contains = ["public"] } }
delta = {}

# Root rules precede included batteries. Mirror the battery's credential
# selectors here so they narrow to `self` before the root's bare Bash rule.
[[policy.tool]]
name = "host/claude-code/Bash(command:*.env*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.claude.json*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.credentials.json*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.ssh/*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.aws/credentials*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.netrc*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.config/gh/hosts.yml*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*id_rsa*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*id_ed25519*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*/proc/*environ*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*/Library/Keychains/*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.docker/config.json*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.git-credentials*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.kube/*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.npmrc*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.pypirc*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*.databrickscfg*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*databricks*auth token*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*databricks*auth env*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*databricks*secrets get-secret*)"
delta = { audience = ["self"] }
tags = ["credentials"]

[[policy.tool]]
name = "host/claude-code/Bash(command:*databricks*configure*)"
delta = { audience = ["self"] }
tags = ["credentials"]

# On Unix, a compatibility net covers tools installed after this policy. Exact
# declarations always win over the wildcard, including declarations supplied by
# connector batteries. The mandate is deliberately closed to this deployment's
# two trust ranks, HITL, and no effects. `audiences` is left omitted, so an
# annotation may narrow a result to `self` or `internal`, or require a reader
# this policy names, exactly as a static rule above would.
# APPA-UNIX-FALLBACK-BEGIN
# The Bash Annotators run a Claude subprocess, which is available only on Unix.
# The root supplies the Bash rules absent from the portable battery. The
# repository input resolves a publishing destination before its Annotator runs.
[[policy.annotator]]
name = "claude-code.bash-repository-requirements"
builtin = "claude-code"
inputs = { call = "$tool_call", repository = "$input.claude-code.repository" }
hint = "`repository` is the deployment's own finding: the GitHub repository the command reaches, with its `visibility`, or `null` with a `reason`. A push, pull request, issue, release, or comment into a public repository, or into one not established, requires audience public; into a private or internal one requires audience internal. A read keeps the session's audience."

[[policy.tool]]
name = "host/claude-code/Bash(command:*git push*)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

# Options between `git` and `push`, such as `git -C sub push`.
[[policy.tool]]
name = "host/claude-code/Bash(command:*git -* push*)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh pr *)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh issue *)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh release *)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh api *)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[[policy.tool]]
name = "host/claude-code/Bash(command:*gh repo *)"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-repository-requirements"

[externals.inputs."claude-code.repository"]
command = ["python3", "batteries/claude-code/repository.py"]

# How a model Annotator classifies — trust by who wrote the returned text,
# audience by the visible destination — is the runtime's. Add a `hint` with
# what only this deployment knows: which hosts are its own and which paths hold
# whose data. The mandate leaves `audiences` omitted, so it may name readers.
[[policy.annotator]]
name = "claude-code.bash-requirements"
builtin = "claude-code"

[[policy.tool]]
name = "host/claude-code/Bash"
description = "Runs one shell command and returns its output."
annotator = "claude-code.bash-requirements"

[[policy.annotator]]
name = "claude-code.undeclared-tool"
builtin = "claude-code"
ranks = ["suspicious", "trusted"]
marks = ["hitl"]
effects = []

[[policy.tool]]
name = "*"
annotator = "claude-code.undeclared-tool"
# APPA-UNIX-FALLBACK-END

# The reserved builtin sanitizer of a structured subagent return. The
# session declares a JSON schema of bounded fields when it starts the
# subagent; a final message that matches it crosses at the session's own
# trust instead of the rank the subagent's reads left it at. It runs in
# the runtime itself and needs no externals entry.
[[policy.sanitizer]]
name = "attest-schema"
on = ["tool_output"]

[policy.sanitizer.permits]
trust = { from = "suspicious", to = "trusted" }

# The deployment controls what a subagent starts from: the harness gives
# every subagent exactly the prompt the parent's spawn call carried, and
# nothing else of the parent's context. That is what lets the runtime
# check the subagent's return as a branch of the parent.
[policy.deployment]
context_control = true

# Batteries and Annotators can require fresh attention, trusted data, or a
# wider audience before a tool runs. This authority shows the person running
# the Claude Code session the exact call and can approve those gaps for that
# call: any attention mark a battery declares (`*` — every mark but the
# reserved `blocked`), data below `trusted`, and an audience up to `public`.
# Approval does not change the trajectory's label or authorize later calls.
[[policy.authority]]
name = "hitl"
hint = "Ask the person running this session to review the exact call, the data it carries, and any required audience expansion."

[policy.authority.permits]
trust_below = "trusted"
audience_missing = ["public"]
attention = ["*"]

[externals]
timeout_ms = 5000
review_timeout_ms = 600000
max_body_bytes = 65536

[externals.authorities.hitl]
builtin = "hitl"

# Who `self` and `internal` are, read from a directory when a decision needs
# actual membership: a rule naming an individual recipient
# (`requires = { audience = { contains = ["$to"] } }`) checked against a
# narrowed session. Without a source the chain still decides symbolically and
# such a call is refused as unanswerable. To add one, install the GitHub
# battery — it binds the `github` source and declares its selectors — and put
# the mapping under `[policy]` here:
#
#   [policy.audience]
#   self = ["github:viewer"]
#   internal = ["github:org/<your-org>/members"]

# Whether the agent may report on its own through the `yell` tool. Off leaves it
# unadvertised and unroutable; a person can always report with `appa yell`.
# A first `appa plugin install claude-code` asks, and writes the answer here.
[reporting]
agent_yell = false
