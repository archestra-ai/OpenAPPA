# --- tools that bring outside content into the session ---

# Vendor-written docs and OpenAPPA's own sites: the operator may see the URL,
# and strangers do not write the page. Each host ends in `/` so a lookalike
# host such as `code.claude.com.example` falls through to the bare rule.
[[policy.tool]]
name = "host/claude-code/WebFetch(url:https://openappa.com/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/WebFetch(url:https://archestra.ai/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/WebFetch(url:https://code.claude.com/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/WebFetch(url:https://docs.anthropic.com/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/WebFetch(url:https://platform.claude.com/*)"
delta = {}

[[policy.tool]]
name = "host/claude-code/WebFetch(url:https://developers.openai.com/*)"
