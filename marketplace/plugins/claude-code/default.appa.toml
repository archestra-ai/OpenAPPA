# Google sees the search query; strangers write the results.
[[policy.tool]]
name = "host/claude-code/WebFetch(url:https://www.google.com/search?*)"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "host/claude-code/WebFetch(url:https://google.com/search?*)"
delta = { trust = "suspicious" }

# Web pages and search results are authored outside the session, and the URL
# or query itself leaves it: a public sink and an untrusted source at once.
[[policy.tool]]
name = "host/claude-code/WebFetch"
requires = { audience = { contains = ["public"] } }
delta = { trust = "suspicious" }

[[policy.tool]]
name = "host/claude-code/WebSearch"
requires = { audience = { contains = ["public"] } }
delta = { trust = "suspicious" }

# Another session's message and a resource of any MCP server arrive without
# the label of whoever wrote them. GitHub notifications carry comments anyone
# can write.
[[policy.tool]]
name = "host/claude-code/FetchInboxMessage"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "host/claude-code/ReadMcpResourceTool"
delta = { trust = "suspicious" }

[[policy.tool]]
name = "host/claude-code/ReadNotifications"
delta = { trust = "suspicious" }

# Reporting to the OpenAPPA team that APPA is in the way. Served by the runtime
# itself, and gated by the same algebra as any other sink that leaves this
# machine: the report carries this session's APPA decisions, so a session
# narrowed by a battery's reads reaches a human review instead of sending. The
# report never carries a prompt, a tool argument or a tool output — what it may
# carry is decided by the runtime, not by this rule. Turn the tool off entirely
# with `[reporting] agent_yell = false` at the end of this file; a deployment
# that leaves it on and wants a person in the loop can add
# `requires = { attention = ["hitl"] }` here instead.
[[policy.tool]]
name = "mcp/appa/yell"
requires = { audience = { contains = ["public"] } }
delta = {}

# A compatibility net covers tools installed after this policy. Exact
# declarations always win over the wildcard, including declarations supplied by
# connector batteries. The mandate is deliberately closed to this deployment's
# two trust ranks, HITL, and no effects. `audiences` is left omitted, so an
# annotation may narrow a result to `self` or `internal`, or require a reader
# this policy names, exactly as a static rule above would.
[[policy.annotator]]
name = "claude-code.undeclared-tool"
builtin = "claude-code"
ranks = ["suspicious", "trusted"]
marks = ["hitl"]
effects = []

[[policy.tool]]
name = "*"
annotator = "claude-code.undeclared-tool"

# The reserved builtin sanitizer of a structured subagent return. The
# session declares a JSON schema of bounded fields when it starts the
# subagent; a final message that matches it crosses at the session's own
# trust instead of the rank the subagent's reads left it at. It runs in
# the runtime itself and needs no externals entry.
[[policy.sanitizer]]
name = "attest-schema"
on = ["tool_output"]

[policy.sanitizer.permits]
trust = { from = "suspicious", to = "trusted" }

# The deployment controls what a subagent starts from: the harness gives
# every subagent exactly the prompt the parent's spawn call carried, and
# nothing else of the parent's context. That is what lets the runtime
# check the subagent's return as a branch of the parent.
[policy.deployment]
context_control = true

# Batteries and Annotators can require fresh attention, trusted data, or a
# wider audience before a tool runs. This authority shows the person running
# the Claude Code session the exact call and can approve those gaps for that
# call: any attention mark a battery declares (`*` — every mark but the
# reserved `blocked`), data below `trusted`, and an audience up to `public`.
# Approval does not change the trajectory's label or authorize later calls.
[[policy.authority]]
name = "hitl"
hint = "Ask the person running this session to review the exact call, the data it carries, and any required audience expansion."

[policy.authority.permits]
trust_below = "trusted"
audience_missing = ["public"]
attention = ["*"]

[externals]
timeout_ms = 5000
review_timeout_ms = 600000
max_body_bytes = 65536

[externals.authorities.hitl]
builtin = "hitl"

# Who `self` and `internal` are, read from a directory when a decision needs
# actual membership: a rule naming an individual recipient
# (`requires = { audience = { contains = ["$to"] } }`) checked against a
# narrowed session. Without a source the chain still decides symbolically and
# such a call is refused as unanswerable. To add one, install the GitHub
# battery — it binds the `github` source and declares its selectors — and put
# the mapping under `[policy]` here:
#
#   [policy.audience]
#   self = ["github:viewer"]
#   internal = ["github:org/<your-org>/members"]

# Whether the agent may report on its own through the `yell` tool. Off leaves it
# unadvertised and unroutable; a person can always report with `appa yell`.
# A first `appa plugin install claude-code` asks, and writes the answer here.
[reporting]
agent_yell = false
