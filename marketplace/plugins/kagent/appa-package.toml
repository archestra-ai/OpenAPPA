schema = 1
name = "kagent"
description = "Gates a kagent agent pod through the Google ADK plugin API: every tool call and agent-to-agent delegation is checked before it runs."

[plugin]
host = "kagent"
protocol = 1
default_policy = "default.appa.toml"
# The generation descriptor locks registry and platform digests for these
# release images. The Go image also publishes the alias kagent derives.

[plugin.images]
adk = "ghcr.io/archestra-ai/appa-kagent-adk:v0.41.0" # x-release-please-version
adk-go = "ghcr.io/archestra-ai/appa-kagent-adk-go:v0.41.0" # x-release-please-version
