schema = 1
name = "kagent"
description = "Gates a kagent agent pod through the Google ADK plugin API: every tool call and agent-to-agent delegation is checked before it runs."

[plugin]
host = "kagent"
protocol = 1
default_policy = "default.appa.toml"
# Tags, not digests: the release workflow publishes both at the release
# version, and nothing pins them by digest yet.
images = { adk = "europe-west1-docker.pkg.dev/friendly-path-465518-r6/appa-public/appa-kagent-adk:v0.14.1", adk-go = "europe-west1-docker.pkg.dev/friendly-path-465518-r6/appa-public/appa-kagent-adk-go:v0.14.1" } # x-release-please-version
