include = ["batteries/file-tracker/appa.toml", "batteries/opencode/appa.toml"]

[policy]
version = 2

[policy.deployment]
context_control = true

# `timeout_ms` bounds each `url` or `command` external. A sanitizer bound to
# `builtin = "llm"` or `"claude-code"` runs under that builtin's own
# `[externals.llm]` or `[externals.claude_code]` `timeout_ms`, 60000 ms by
# default. `max_body_bytes` caps every external's answer and every tool
# result: a larger result reaches the model as a placeholder.
[externals]
timeout_ms = 2000
max_body_bytes = 65536

# The file-tracker battery routes read, write, edit and appa_safebash through
# the file-tracker, which the `appa` executable serves. To turn file tracking
# off, run `appa battery remove file-tracker`: these bindings then stay idle,
# and the opencode battery's own rules decide those tools.
[externals.annotators.file-tracker]
command = ["appa", "file-tracker", "annotate"]

[externals.recorders.file-tracker]
command = ["appa", "file-tracker", "record"]
