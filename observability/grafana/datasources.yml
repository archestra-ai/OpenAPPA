apiVersion: 1

# Starter data sources for a local Grafana stack. Replace the URLs and UIDs to
# match the deployment. The time shifts matter for OpenAPPA's sub-millisecond
# hook spans: without them, Grafana can ask Loki for an effectively empty time
# window when following a trace's "Related logs" link.
datasources:
  - name: OpenAPPA Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: true

  - name: OpenAPPA Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki:3100
    editable: true

  - name: OpenAPPA Tempo
    type: tempo
    uid: tempo
    access: proxy
    url: http://tempo:3200
    editable: true
    jsonData:
      tracesToLogsV2:
        datasourceUid: loki
        filterByTraceID: true
        filterBySpanID: false
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
        tags:
          - key: service.name
            value: service_name
