# The previous release (pinned in previous/Cargo.toml) and this checkout share one PostgreSQL store,
# as old and new pods do during a rolling release and after a rollback. The historical revision is
# (`git rev-list -n1 v0.35.1`).
#
#   OPENAPPA_TEST_DATABASE_URL=postgres://… scripts/mixed-version/run.sh
#
# The database needs the host schema: appa-eventlog/tests/fixtures/host_schema.sql.
[package]
name = "appa-mixed-version"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
new_engine = { package = "appa-engine", path = "../../appa-engine" }
new_eventlog = { package = "appa-eventlog", path = "../../appa-eventlog", features = ["postgres"] }
new_policy = { package = "appa-policy", path = "../../appa-policy" }
serde_json = "1"
