# The deployed version and this checkout against one PostgreSQL store, as old and new pods share
# one during a rolling release and after a rollback. Point `rev` at the version being replaced:
# the OpenAPPA revision Archestra pins (platform/archestra-rs/openappa-rs/Cargo.toml).
#
#   OPENAPPA_TEST_DATABASE_URL=postgres://… cargo run --manifest-path scripts/mixed-version/Cargo.toml
#
# The database needs the host schema: appa-eventlog/tests/fixtures/host_schema.sql.
[package]
name = "appa-mixed-version"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
old_engine = { package = "appa-engine", git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "6ca466fea5fdc59930b66e145ec987a3ecea88ef" }
old_eventlog = { package = "appa-eventlog", git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "6ca466fea5fdc59930b66e145ec987a3ecea88ef", features = ["postgres"] }
old_policy = { package = "appa-policy", git = "https://github.com/archestra-ai/OpenAPPA.git", rev = "6ca466fea5fdc59930b66e145ec987a3ecea88ef" }
new_engine = { package = "appa-engine", path = "../../appa-engine" }
new_eventlog = { package = "appa-eventlog", path = "../../appa-eventlog", features = ["postgres"] }
new_policy = { package = "appa-policy", path = "../../appa-policy" }
