<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 70 90" shape-rendering="crispEdges">
  <style>
    rect { fill: hsl(0, 5%, 12%); }
    @media (prefers-color-scheme: dark) {
      rect { fill: hsl(0, 15%, 94%); }
    }
  </style>
  <!-- pixel A, 5x7 grid -->
  <rect x="20" y="10" width="30" height="10"/>
  <rect x="10" y="20" width="10" height="20"/>
  <rect x="50" y="20" width="10" height="20"/>
  <rect x="10" y="40" width="50" height="10"/>
  <rect x="10" y="50" width="10" height="30"/>
  <rect x="50" y="50" width="10" height="30"/>
</svg>
